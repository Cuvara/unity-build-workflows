name: Pipeline iOS Release

# iOS promotion pipeline. It builds nothing: it takes the signed IPA a
# Build / Release run produced (source-run-id + artifact-name) and moves it
#   Verify → Validate IPA → TestFlight internal → External → App Store
# re-verifying it against the Release Set in every job that touches it.
#
# Two binary sources (`binary-source`):
#   github             the IPA artifact above (default).
#   app-store-connect  no artifact: the build is already on App Store Connect
#                      (Build / Release uploaded it straight to TestFlight, as
#                      it does with ARTIFACT_STORAGE=firebase) and is picked by
#                      version-string + build-number. Nothing is downloaded or
#                      uploaded; the phases act on that build.
#
# Each release phase is a separate job gated by GitHub Environments.
# Store phases use the ASC API (ubuntu-latest; the TestFlight upload needs macOS).
#
# Nesting depth: project caller → this = 2 of GitHub's 4 levels.

on:
  workflow_call:
    inputs:
      toolkit-repo:
        description: >-
          Toolkit repository checked out to .toolkit/ for this workflow's own
          composite actions and scripts. A step-level `uses: ./…` in a reusable
          workflow resolves against the runner WORKSPACE, which is the caller's
          repository — so the toolkit's actions are not on disk unless checked
          out explicitly.
        type: string
        required: false
        default: Cuvara/unity-build-workflows
      toolkit-ref:
        description: Git ref of the toolkit repository to check out.
        type: string
        required: false
        default: main
      # ── Build inputs ──
      build-version:
        type: string
        required: true
      # ── Release inputs ──
      app-id:
        description: App Store Connect app ID
        type: string
        required: true
      version-string:
        description: App Store version string (e.g., 1.2.3)
        type: string
        required: true
      start-phase:
        description: Phase to start from (validate/internal/external/production)
        type: string
        required: false
        default: validate
      binary-source:
        description: >-
          Where the promoted build comes from: `github` (the IPA artifact named
          by source-run-id + artifact-name, default) or `app-store-connect` (a
          build already on App Store Connect, picked by version-string +
          build-number — no artifact, no IPA download). Use the latter when
          Build / Release ran with ARTIFACT_STORAGE=firebase and so left no
          GitHub artifact.
        type: string
        required: false
        default: github
      source-run-id:
        description: >-
          Run ID of the Build / Release run that produced the artifact. Required
          when binary-source is github, because `actions/download-artifact` only
          sees the current run by default — promotion pulls the binary from
          another run, which is what makes it the same binary QA approved rather
          than a rebuild. Unused for app-store-connect.
        type: string
        required: false
        default: ''
      artifact-name:
        description: >-
          Existing IPA artifact to publish when start-phase is
          internal/external/production. This is what makes the binary QA
          approved the binary that ships — nothing is rebuilt between them.
          Required when binary-source is github; unused for app-store-connect.
        type: string
        required: false
        default: ''
      build-number:
        description: >-
          Build number (CFBundleVersion, e.g. 474) of the build to promote.
          Required when binary-source is app-store-connect; with github it is
          read from the IPA.
        type: string
        required: false
        default: ''
      testflight-groups:
        description: >-
          External TestFlight group names, comma-separated. Required for the
          external phase when binary-source is app-store-connect; unused for
          github, where external distribution stays a manual step.
        type: string
        required: false
        default: ''
      phased-release:
        description: Enable 7-day phased release on production
        type: boolean
        required: false
        default: true
      from-tag:
        description: Git tag to generate release notes from
        type: string
        required: false
        default: ''
      dry-run:
        description: Build without submitting to store
        type: boolean
        required: false
        default: false

    secrets:
      # Optional at the call boundary, checked where they are used: a
      # `required: true` secret is validated when the workflow call is
      # RESOLVED, so declaring these required made Build Only impossible in a
      # repository that has no store credentials. Signing fails in stage 03 and
      # publishing fails in stage 05 if they are genuinely missing.
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_PRIVATE_KEY:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false

    outputs:
      artifact-name:
        description: Name of the signed IPA artifact this run promoted
        value: ${{ inputs.artifact-name }}

# No workflow_dispatch here. These are reusable workflows; the dispatch
# surface is the consumer's numbered entry point (20/21/22-release-*.yml),
# which is where a human picks a Release Set to promote. The form that used
# to sit here predated promote-only and never asked for `source-run-id`, so
# running it could only ever fail — a second, divergent form for the same
# pipeline is worse than none.

# The pipeline's stages, declared once. Every job renders this same
# ladder with itself marked, so the run summary grows into a progress
# view while the run is still going — GitHub draws no progress on a
# workflow node, and the graph shows shape without distance.
env:
  PIPELINE_STAGES: |
    04 Verify Release Identity
    04 Verify App Store Connect Build
    04 Validate IPA
    04 Release Notes
    05 Publish — TestFlight Internal
    06 Release — TestFlight External
    06 Release — Production

jobs:
  # ─── 04 — VERIFY RELEASE IDENTITY ───────────────────────────────────────────
  # A filename establishes nothing. This proves the downloaded bytes are the
  # ones the named Release Set produced: same run, same commit, same version,
  # same build number, same SHA-256. It fails closed — a promotion that cannot
  # prove what it is holding must not publish it.
  verify-artifact:
    name: iOS / Verify Release Identity
    if: inputs.binary-source != 'app-store-connect'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      # source-run-id and artifact-name stopped being required at the call
      # boundary when binary-source arrived, so the github source checks them.
      # Any binary-source other than the two known ones lands here and fails,
      # rather than skipping every job.
      - name: Check inputs
        shell: bash
        env:
          BINARY_SOURCE: ${{ inputs.binary-source }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -Eeuo pipefail
          if [[ "${BINARY_SOURCE}" != "github" ]]; then
            echo "::error::binary-source must be 'github' or 'app-store-connect', got '${BINARY_SOURCE}'."
            exit 1
          fi
          if [[ -z "${SOURCE_RUN_ID}" || -z "${ARTIFACT_NAME}" ]]; then
            echo "::error::binary-source 'github' needs source-run-id and artifact-name. To promote a build that is already on App Store Connect instead, set binary-source: app-store-connect."
            exit 1
          fi

      - name: Verify release artifact
        uses: ./.toolkit/.github/actions/verify-release-artifact
        with:
          platform:      iOS
          artifact-name: ${{ inputs.artifact-name }}
          source-run-id: ${{ inputs.source-run-id }}
          build-version: ${{ inputs.build-version }}
          path:          promoted
          github-token:  ${{ github.token }}

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Release / iOS
          stages: ${{ env.PIPELINE_STAGES }}
          current: 04 Verify Release Identity

  # ─── 04 — VERIFY APP STORE CONNECT BUILD ────────────────────────────────────
  # The app-store-connect source has no bytes to hash, so the build's identity
  # is what App Store Connect says it is: this version, this build number,
  # finished processing. It fails closed for the same reason verify-artifact
  # does — a promotion that cannot find exactly the build it was asked for must
  # not act on a different one.
  verify-asc-build:
    name: iOS / Verify App Store Connect Build
    if: inputs.binary-source == 'app-store-connect'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Verify build on App Store Connect
        uses: ./.toolkit/.github/actions/ios-asc-existing-build
        with:
          mode: verify
          app-id: ${{ inputs.app-id }}
          version-string: ${{ inputs.version-string }}
          build-number: ${{ inputs.build-number }}
          asc-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          asc-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          asc-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Summary
        shell: bash
        env:
          VERSION_STRING: ${{ inputs.version-string }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          echo "### Verify App Store Connect Build" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Build:** ${VERSION_STRING} (${BUILD_NUMBER}) — finished processing" >> "${GITHUB_STEP_SUMMARY}"

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Release / iOS
          stages: ${{ env.PIPELINE_STAGES }}
          current: 04 Verify App Store Connect Build

  # ─── 04 — ARTIFACT VALIDATION ───────────────────────────────────────────────
  # Every other platform validated the artifact it downloaded; iOS did not, so
  # the IPA was checked once at build time and never again. Running it here
  # answers a different question: stage 04 of Build / Release proved the build
  # was sound, this proves the download is — and it is the last point before
  # App Store Connect, which rejects a bad binary only after consuming a build
  # number.
  validate-ipa:
    name: iOS / Validate IPA
    needs: [verify-artifact]
    if: |
      !cancelled() &&
      needs.verify-artifact.result == 'success' &&
      inputs.start-phase == 'validate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Verify release artifact
        uses: ./.toolkit/.github/actions/verify-release-artifact
        with:
          platform:      iOS
          artifact-name: ${{ inputs.artifact-name }}
          source-run-id: ${{ inputs.source-run-id }}
          build-version: ${{ inputs.build-version }}
          path:          build-artifact
          github-token:  ${{ github.token }}

      # The IPA must be signed: an unsigned one cannot be distributed, and App
      # Store Connect discovers that after the upload rather than before it.
      - name: Validate IPA
        shell: bash
        env:
          REQUIRE_SIGNED: 'true'
          EXPECTED_VERSION: ${{ inputs.version-string }}
        run: |
          set -Eeuo pipefail
          IPA=$(find build-artifact -name '*.ipa' -type f | head -1)
          if [ -z "${IPA}" ]; then
            echo "::error::No .ipa in ${{ inputs.artifact-name }}. A promotion cannot build one — stage 03b of Build / Release is where it is produced."
            exit 1
          fi
          bash .toolkit/scripts/ios/validate_ipa.sh "${IPA}"

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Release / iOS
          stages: ${{ env.PIPELINE_STAGES }}
          current: 04 Validate IPA

  # ─── RELEASE NOTES ──────────────────────────────────────────────────────────

  release-notes:
    name: iOS / Release Notes
    needs: [verify-artifact, verify-asc-build]
    if: |
      !cancelled() &&
      (needs.verify-artifact.result == 'success' || needs.verify-asc-build.result == 'success') &&
      true
    runs-on: ubuntu-latest
    steps:
      # Release notes come from the CALLER's git history, so the caller repo is
      # the workspace checkout; the toolkit only supplies the action.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Generate notes
        uses: ./.toolkit/.github/actions/generate-release-notes
        with:
          from-tag: ${{ inputs.from-tag }}
          format: app-store-text
          output-path: release-notes.txt

      - name: Upload notes
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: ios-release-notes
          path: release-notes.txt
          retention-days: 7

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Release / iOS
          stages: ${{ env.PIPELINE_STAGES }}
          current: 04 Release Notes

  # ─── PHASE 1: TESTFLIGHT INTERNAL ──────────────────────────────────────────

  internal-testing:
    name: iOS / Publish — TestFlight Internal
    needs: [verify-artifact, verify-asc-build, validate-ipa, release-notes]
    if: |
      !cancelled() &&
      (needs.verify-artifact.result == 'success' || needs.verify-asc-build.result == 'success') &&
      needs.validate-ipa.result != 'failure' &&
      !inputs.dry-run &&
      (inputs.start-phase == 'validate' || inputs.start-phase == 'internal')
    # The TestFlight upload needs macOS; an app-store-connect promotion uploads
    # nothing and only talks to the API.
    runs-on: ${{ inputs.binary-source == 'app-store-connect' && 'ubuntu-latest' || 'macos-latest' }}
    environment: internal-testing
    outputs:
      build-number: ${{ steps.ipa.outputs.build-number || inputs.build-number }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      # app-store-connect: Build / Release already uploaded the build, so this
      # phase uploads nothing. It re-proves the build is still there and
      # processed, which is what the upload + wait does for the github source.
      - name: Verify build on App Store Connect
        if: inputs.binary-source == 'app-store-connect'
        uses: ./.toolkit/.github/actions/ios-asc-existing-build
        with:
          mode: verify
          app-id: ${{ inputs.app-id }}
          version-string: ${{ inputs.version-string }}
          build-number: ${{ inputs.build-number }}
          asc-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          asc-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          asc-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      # Re-verified here, not just in stage 04. This job downloads the artifact
      # again — a separate fetch — and an approval on an earlier phase is not
      # evidence about the bytes this job is holding. Cheap, and it is the last
      # point at which publishing the wrong binary is still preventable.
      - name: Verify release artifact
        if: inputs.binary-source != 'app-store-connect'
        uses: ./.toolkit/.github/actions/verify-release-artifact
        with:
          platform:      iOS
          artifact-name: ${{ inputs.artifact-name }}
          source-run-id: ${{ inputs.source-run-id }}
          build-version: ${{ inputs.build-version }}
          path:          ipa-artifact
          github-token:  ${{ github.token }}

      - name: Find IPA
        id: find-ipa
        if: inputs.binary-source != 'app-store-connect'
        shell: bash
        run: |
          IPA_PATH=$(find ipa-artifact/ -name '*.ipa' -type f | head -1)
          if [[ -z "${IPA_PATH}" ]]; then
            echo "::error::No .ipa file found in artifact"
            exit 1
          fi
          echo "ipa-path=${IPA_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Read IPA identity
        id: ipa
        if: inputs.binary-source != 'app-store-connect'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/ios/ipa_identity.py --ipa "${{ steps.find-ipa.outputs.ipa-path }}" --github-output

      - name: Upload to TestFlight + wait for processing
        id: upload
        if: inputs.binary-source != 'app-store-connect'
        uses: ./.toolkit/.github/actions/ios-testflight
        with:
          ipa-path: ${{ steps.find-ipa.outputs.ipa-path }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          wait-for-processing: 'true'
          app-id: ${{ inputs.app-id }}

      - name: Summary
        if: inputs.binary-source != 'app-store-connect'
        shell: bash
        run: |
          echo "### Phase 1: TestFlight Internal" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Build:** ${{ steps.ipa.outputs.build-number }} (${{ steps.ipa.outputs.bundle-id }})" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Processing:** Complete" >> "${GITHUB_STEP_SUMMARY}"

      - name: Summary (App Store Connect build)
        if: inputs.binary-source == 'app-store-connect'
        shell: bash
        env:
          VERSION_STRING: ${{ inputs.version-string }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          echo "### Phase 1: TestFlight Internal" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Build:** ${VERSION_STRING} (${BUILD_NUMBER}) — already on App Store Connect, nothing uploaded" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Processing:** Complete" >> "${GITHUB_STEP_SUMMARY}"

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Release / iOS
          stages: ${{ env.PIPELINE_STAGES }}
          current: 05 Publish — TestFlight Internal

  # ─── PHASE 2: TESTFLIGHT EXTERNAL ──────────────────────────────────────────

  external-testing:
    name: iOS / Release — TestFlight External
    needs: [verify-artifact, verify-asc-build, release-notes, internal-testing]
    if: |
      !cancelled() &&
      (needs.verify-artifact.result == 'success' || needs.verify-asc-build.result == 'success') &&
      !inputs.dry-run &&
      (
        needs.internal-testing.result == 'success' ||
        inputs.start-phase == 'external'
      )
    runs-on: ubuntu-latest
    environment: external-testing
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit
      - name: External testing gate
        if: inputs.binary-source != 'app-store-connect'
        shell: bash
        run: |
          echo "[ios-release] Build: ${{ needs.internal-testing.outputs.build-number || 'uploaded in an earlier run' }}"
          echo "[ios-release] External beta review: add build to external TestFlight groups in App Store Connect."
          echo "[ios-release] This environment gate ensures manual approval before external distribution."

      - name: Summary
        if: inputs.binary-source != 'app-store-connect'
        shell: bash
        run: |
          echo "### Phase 2: TestFlight External" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Build:** ${{ needs.internal-testing.outputs.build-number || 'uploaded in an earlier run' }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Approved for external TestFlight testing" >> "${GITHUB_STEP_SUMMARY}"

      # app-store-connect: the environment gate above has been approved, so
      # this is where the existing build actually goes out — to the external
      # groups, with "What to Test" from this run's release notes, and into
      # Beta App Review.
      - name: Download release notes
        if: inputs.binary-source == 'app-store-connect'
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ios-release-notes
          path: release-notes

      - name: Distribute build to external groups
        if: inputs.binary-source == 'app-store-connect'
        uses: ./.toolkit/.github/actions/ios-asc-existing-build
        with:
          mode: distribute
          app-id: ${{ inputs.app-id }}
          version-string: ${{ inputs.version-string }}
          build-number: ${{ inputs.build-number }}
          groups: ${{ inputs.testflight-groups }}
          notes-path: release-notes/release-notes.txt
          asc-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          asc-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          asc-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Summary (App Store Connect build)
        if: inputs.binary-source == 'app-store-connect'
        shell: bash
        env:
          VERSION_STRING: ${{ inputs.version-string }}
          BUILD_NUMBER: ${{ inputs.build-number }}
          GROUPS_CSV: ${{ inputs.testflight-groups }}
        run: |
          echo "### Phase 2: TestFlight External" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Build:** ${VERSION_STRING} (${BUILD_NUMBER})" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Distributed to external groups: ${GROUPS_CSV}; submitted for Beta App Review" >> "${GITHUB_STEP_SUMMARY}"

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Release / iOS
          stages: ${{ env.PIPELINE_STAGES }}
          current: 06 Release — TestFlight External


  production-release:
    name: iOS / Release — App Store
    needs: [verify-artifact, verify-asc-build, internal-testing, external-testing, release-notes]
    if: |
      !cancelled() &&
      (needs.verify-artifact.result == 'success' || needs.verify-asc-build.result == 'success') &&
      !inputs.dry-run &&
      (
        needs.external-testing.result == 'success' ||
        inputs.start-phase == 'production'
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      # The IPA itself, not just the manifest: the identity check below needs
      # the bytes, and App Store submission needs the bundle id and build
      # number that are inside them. This job used to verify `.` -- an empty
      # workspace -- and to take a build id from an output that was never set.
      # Re-verified here, not just in stage 04. This job downloads the artifact
      # again — a separate fetch — and an approval on an earlier phase is not
      # evidence about the bytes this job is holding. Cheap, and it is the last
      # point at which publishing the wrong binary is still preventable.
      - name: Verify release artifact
        if: inputs.binary-source != 'app-store-connect'
        uses: ./.toolkit/.github/actions/verify-release-artifact
        with:
          platform:      iOS
          artifact-name: ${{ inputs.artifact-name }}
          source-run-id: ${{ inputs.source-run-id }}
          build-version: ${{ inputs.build-version }}
          path:          ipa-artifact
          github-token:  ${{ github.token }}

      - name: Read IPA identity
        id: ipa
        if: inputs.binary-source != 'app-store-connect'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/ios/ipa_identity.py --ipa ipa-artifact --github-output

      - name: Submit for App Store review
        if: inputs.binary-source != 'app-store-connect'
        uses: ./.toolkit/.github/actions/ios-asc-submit-review
        with:
          bundle-id: ${{ steps.ipa.outputs.bundle-id }}
          version-string: ${{ inputs.version-string }}
          build-number: ${{ steps.ipa.outputs.build-number }}
          phased-release: ${{ inputs.phased-release && 'true' || 'false' }}
          asc-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          asc-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          asc-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Summary
        if: inputs.binary-source != 'app-store-connect'
        shell: bash
        run: |
          echo "### Phase 3: App Store Submission" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Version:** ${{ inputs.version-string }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Build:** ${{ steps.ipa.outputs.build-number }} (${{ steps.ipa.outputs.bundle-id }})" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Phased Release:** ${{ inputs.phased-release }}" >> "${GITHUB_STEP_SUMMARY}"

      # app-store-connect: no IPA to read the bundle id from, so the verify
      # step asks App Store Connect for it. deliver then submits the build that
      # version + build number name, with the same phased-release and metadata
      # behaviour as the github source (skip_binary_upload).
      - name: Verify build on App Store Connect
        id: asc
        if: inputs.binary-source == 'app-store-connect'
        uses: ./.toolkit/.github/actions/ios-asc-existing-build
        with:
          mode: verify
          app-id: ${{ inputs.app-id }}
          version-string: ${{ inputs.version-string }}
          build-number: ${{ inputs.build-number }}
          asc-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          asc-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          asc-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Submit App Store Connect build for review
        if: inputs.binary-source == 'app-store-connect'
        uses: ./.toolkit/.github/actions/ios-asc-submit-review
        with:
          bundle-id: ${{ steps.asc.outputs.bundle-id }}
          version-string: ${{ inputs.version-string }}
          build-number: ${{ inputs.build-number }}
          phased-release: ${{ inputs.phased-release && 'true' || 'false' }}
          asc-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          asc-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          asc-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Summary (App Store Connect build)
        if: inputs.binary-source == 'app-store-connect'
        shell: bash
        env:
          VERSION_STRING: ${{ inputs.version-string }}
          BUILD_NUMBER: ${{ inputs.build-number }}
          BUNDLE_ID: ${{ steps.asc.outputs.bundle-id }}
          PHASED_RELEASE: ${{ inputs.phased-release }}
        run: |
          echo "### Phase 3: App Store Submission" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Version:** ${VERSION_STRING}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Build:** ${BUILD_NUMBER} (${BUNDLE_ID})" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Phased Release:** ${PHASED_RELEASE}" >> "${GITHUB_STEP_SUMMARY}"

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Release / iOS
          stages: ${{ env.PIPELINE_STAGES }}
          current: 06 Release — Production

  # ─── 07 — REPORT & NOTIFY ───────────────────────────────────────────────────
  # The pipeline used to end at stage 06, so a release run produced no report:
  # the only way to see how far a promotion got was to read the graph. This
  # says which phase it reached, or which one stopped it, and posts the same
  # to Discord.

  report:
    name: iOS / Report & Notify
    needs: [verify-artifact, verify-asc-build, validate-ipa, release-notes, internal-testing, external-testing, production-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Report
        uses: ./.toolkit/.github/actions/release-report
        with:
          platform: iOS
          destination: App Store Connect
          build-version: ${{ inputs.build-version }}
          artifact-name: ${{ inputs.artifact-name || format('App Store Connect build {0} ({1})', inputs.version-string, inputs.build-number) }}
          start-phase: ${{ inputs.start-phase }}
          dry-run: ${{ inputs.dry-run }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          discord-vars-json: ${{ toJSON(vars) }}
          discord-config-file: ${{ vars.DISCORD_CONFIG_FILE || '.github/discord.json' }}
          phases: |
            04 Verify Release Identity=${{ needs.verify-artifact.result }}
            04 Verify App Store Connect Build=${{ needs.verify-asc-build.result }}
            04 Validate IPA=${{ needs.validate-ipa.result }}
            04 Release Notes=${{ needs.release-notes.result }}
            05 Publish — TestFlight Internal=${{ needs.internal-testing.result }}
            06 Release — TestFlight External=${{ needs.external-testing.result }}
            06 Release — Production=${{ needs.production-release.result }}
