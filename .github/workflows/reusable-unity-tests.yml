name: Reusable Unity Tests

# Runs Unity EditMode / PlayMode / All tests and uploads NUnit XML + Editor.log.
# Supports three execution lanes: docker (game-ci), self-hosted-windows, self-hosted-macos.
# Called by the consumer workflow's unity-tests job; skip logic lives in the consumer.

on:
  workflow_call:
    inputs:
      # GitHub renders a called workflow as "<caller job name> / <inner job name>",
      # so a caller named "02 / Unity Tests (All)" calling a job also named
      # "Unity Tests (All)" renders the mode twice. The caller owns the stage
      # half; node-label owns the rest.
      node-label:
        description: >-
          Display name for this workflow's job, appended after the caller's job
          name. Defaults to the legacy "Unity Tests (<mode>)".
        required: false
        default: ''
        type: string

      unity-version:
        description: Unity version string (e.g. 6000.0.26f1). Must be resolved by caller.
        required: true
        type: string

      test-mode:
        description: Unity test runner mode — EditMode | PlayMode | All
        required: false
        default: 'All'
        type: string

      project-path:
        description: Path to the Unity project root relative to the workspace root.
        required: false
        default: '.'
        type: string

      runner-mode:
        description: |
          Execution lane:
            docker              — game-ci/unity-test-runner on ubuntu-latest (default)
            self-hosted-windows — local Unity on [self-hosted, Windows, unity] runner
            self-hosted-macos   — local Unity on [self-hosted, macOS, unity] runner
        required: false
        default: 'docker'
        type: string

      activation-strategy:
        description: |
          Unity license activation strategy (docker lane only; ignored for self-hosted lanes
          where Unity is pre-activated).
          Values: auto | manual-license | account | serial | preactivated | none
        required: false
        default: 'auto'
        type: string

      post-test-check-run:
        description: |
          Let game-ci/unity-test-runner post its results as a GitHub check run.

          OFF by default, and the default is the honest one: the token is
          read-only unless a repository says otherwise, so with this on and no
          `checks: write` the action fails with

            Resource not accessible by integration - .../checks/runs#create-a-check-run

          on every single run. Granting it is not free either: an explicit
          `permissions:` block REPLACES the default set, so a caller that lists
          only `checks: write` also revokes `packages: read` and the docker lane
          can no longer pull its image from GHCR.

          To turn it on, the CALLING workflow must grant the full set it needs:

            permissions:
              contents: read
              packages: read
              actions:  read
              checks:   write

          Nothing is lost by leaving it off. The job already fails on a failed
          test, the failing test's name and file are in the job log, and the
          NUnit XML is uploaded as `unity-tests-<mode>`.
        required: false
        default: false
        type: boolean

      submodule-auth:
        description: >-
          How git submodules are authenticated. 'token' (the default, and the
          historical behaviour) lets actions/checkout fetch them, which rewrites
          every submodule URL to HTTPS and injects GITHUB_TOKEN — that token only
          reaches submodules inside the calling repository. 'ssh' skips that and
          fetches them in a separate step over SSH, using the SUBMODULE_SSH_KEY
          secret when one is set and the runner's own SSH credentials otherwise.
          'ssh' is the only route to a private submodule in another organization.
        required: false
        default: token
        type: string

      toolkit-repo:
        description: Toolkit repository (owner/repo) checked out for Unity preflight on native lanes.
        required: false
        default: 'Cuvara/unity-build-workflows'
        type: string

      toolkit-ref:
        description: Git ref of the toolkit repo (used when calling toolkit scripts).
        required: false
        default: 'main'
        type: string

      artifact-retention-days:
        description: Days to retain uploaded test-result artifacts.
        required: false
        default: 14
        type: number

      log-retention-days:
        description: >-
          Days to retain test logs and reports. Diagnostics for this run only.
        required: false
        default: 7
        type: number

      # ── Grouped-config additions (backward compatible; defaults preserve today) ─
      build-timeout-minutes:
        description: Maximum minutes the test job may run before GitHub Actions cancels it.
        required: false
        default: 120
        type: number

      cache-library:
        description: Cache the Unity Library folder.
        required: false
        default: true
        type: boolean

      test-fail-fast:
        description: |
          Best-effort fail-fast toggle. No test matrix exists today (single job runs
          EditMode then PlayMode sequentially), so this is currently informational only
          and reserved for a future matrix-based implementation.
        required: false
        default: false
        type: boolean

      runner-windows-label:
        description: Runner label used for the self-hosted-windows lane.
        required: false
        default: 'self-hosted-windows'
        type: string

      runner-macos-label:
        description: Runner label used for the self-hosted-macos lane.
        required: false
        default: 'self-hosted-macos'
        type: string

      runner-linux-label:
        description: Runner label used for the docker/ubuntu lane.
        required: false
        default: 'ubuntu-latest'
        type: string

      # ── Runner / Build-Engine separation (V2) ─────────────────────────────────
      runner-labels:
        description: |
          JSON array string of runs-on labels (e.g. ["ubuntu-latest"] or
          ["self-hosted","windows"]). Resolver-provided; drives runs-on directly.
        required: false
        default: '["ubuntu-latest"]'
        type: string

      build-engine:
        description: |
          HOW Unity runs tests: docker (game-ci) | local (Unity Hub install on
          the runner). Independent of runner-labels (WHERE the job runs).
        required: false
        default: 'docker'
        type: string

    secrets:
      UNITY_LICENSE:
        description: Raw .ulf file contents (personal-combined strategy). Optional.
        required: false
      SUBMODULE_SSH_KEY:
        description: >-
          Private SSH key used to fetch submodules when submodule-auth is 'ssh'.
          Optional — when unset, the runner's own SSH credentials are used, which
          is usually what a self-hosted runner already has.
        required: false
      UNITY_EMAIL:
        description: Unity account email. Required for docker lane activation.
        required: false
      UNITY_PASSWORD:
        description: Unity account password. Required for docker lane activation.
        required: false

    outputs:
      result:
        description: Job result — success | failure | skipped
        value: ${{ jobs.test.outputs.result }}

      tests-passed:
        description: Count of passing tests (integer string).
        value: ${{ jobs.test.outputs.tests-passed }}

      tests-failed:
        description: Count of failing tests (integer string).
        value: ${{ jobs.test.outputs.tests-failed }}

      artifact-name:
        description: Name of the uploaded test-results artifact.
        value: ${{ jobs.test.outputs.artifact-name }}

jobs:
  test:
    name: ${{ inputs.node-label != '' && inputs.node-label || format('Unity Tests ({0})', inputs.test-mode) }}
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    # ── Runner selection (V2) ────────────────────────────────────────────────
    # runs-on is driven directly by the resolver-provided runner-labels JSON
    # array (WHERE the job runs). build-engine (HOW tests run) is independent.
    # runner-mode/runner-*-label inputs are kept for backward compat only.
    runs-on: ${{ fromJSON(inputs.runner-labels != '' && inputs.runner-labels || '["ubuntu-latest"]') }}

    outputs:
      result:        ${{ steps.set-result.outputs.result }}
      tests-passed:  ${{ steps.parse-results.outputs.tests-passed }}
      tests-failed:  ${{ steps.parse-results.outputs.tests-failed }}
      artifact-name: ${{ steps.set-result.outputs.artifact-name }}

    steps:
      # On Windows, `shell: bash` resolves `bash` on PATH. On a self-hosted
      # runner System32 usually comes before Git, so it found
      # C:\WINDOWS\system32\bash.exe — the WSL launcher — and every bash step
      # failed with "Windows Subsystem for Linux has no installed
      # distributions". Ask git where it is installed, run that Git Bash to be
      # sure, and put it first on PATH for the rest of the job.
      # It runs before any checkout (it sets core.longpaths for the project
      # checkout, which would clean away a toolkit checked out earlier), so
      # it cannot come from the toolkit. reusable-build-platform.yml carries the same
      # block; tests/test_shared_job_steps.py keeps the two identical.
      - name: Use Git Bash and long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $git = Get-Command git -ErrorAction SilentlyContinue
          if (-not $git) {
            Write-Output "::error title=Git for Windows not found::Install Git for Windows (Git Bash) for the runner account: https://git-scm.com/download/win"
            exit 1
          }
          # git --exec-path -> <root>\mingw64\libexec\git-core
          $root = (Resolve-Path (Join-Path (& $git.Source --exec-path) '..\..\..')).Path
          $bin = Join-Path $root 'bin'
          $bash = Join-Path $bin 'bash.exe'
          $version = & $bash --version 2>$null | Select-Object -First 1
          if (-not $version) {
            Write-Output "::error title=Git Bash not runnable::$bash did not run. Reinstall Git for Windows."
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin -Encoding utf8
          Write-Output "Using Git Bash: $bash ($version)"

          # Long paths. actions/checkout runs plain `git`, which stops at
          # Windows' 260-character MAX_PATH ("Filename too long") on asset
          # packs nested deep under the runner workspace - and offers no input
          # for it. Set it for the runner account before checkout.
          & $git.Source config --global core.longpaths true
          Write-Output "git core.longpaths = $(& $git.Source config --global core.longpaths)"
          # Unity and Gradle need the OS setting too; it takes admin, so only
          # say how.
          $lp = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          if ($lp -ne 1) {
            Write-Output "::warning title=Windows long paths disabled::LongPathsEnabled is off, so Unity or Gradle may fail on paths over 260 characters. As an administrator: New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force - or give the runner a short work folder (e.g. C:\r)."
          }

      # ── 1. Free disk space (docker / ubuntu-latest only) ─────────────────────
      - name: Free disk space
        if: ${{ inputs.build-engine == 'docker' }}
        shell: bash
        run: |
          # Unity editor image is ~15GB; reclaim host space before pulling it.
          echo "Before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "After:"; df -h / | tail -1

      # ── 2. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: ${{ inputs.submodule-auth == 'ssh' && 'false' || 'recursive' }}

      # The toolkit, right after the project checkout (which would clean it
      # away if it came first), for the submodule fetch and the native
      # lanes' Unity preflight and test runner.
      - name: Checkout toolkit
        if: ${{ inputs.submodule-auth == 'ssh' || (inputs.build-engine == 'local' && (runner.os == 'Windows' || runner.os == 'macOS')) }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit
          clean: false

      - name: Fetch submodules over SSH
        if: ${{ inputs.submodule-auth == 'ssh' }}
        shell: bash
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
        # The URLs in .gitmodules, used exactly as written (actions/checkout
        # rewrites them to HTTPS with a token that cannot see a private
        # submodule in another organization):
        # scripts/common/fetch_submodules_ssh.sh, shared with the other job.
        run: bash .toolkit/scripts/common/fetch_submodules_ssh.sh

      # ── 3. Cache Library ──────────────────────────────────────────────────────
      - name: Cache Library
        if: ${{ inputs.cache-library == true }}
        uses: actions/cache@v4
        with:
          path: ${{ inputs.project-path }}/Library
          key: >-
            Library-test-${{ inputs.test-mode }}-${{
              hashFiles(
                format('{0}/ProjectSettings/ProjectVersion.txt', inputs.project-path),
                format('{0}/Packages/manifest.json', inputs.project-path)
              )
            }}
          restore-keys: Library-test-${{ inputs.test-mode }}-

      # ── 4a. Run tests — Docker lane (EditMode) ────────────────────────────────
      # game-ci/unity-test-runner handles activation via UNITY_LICENSE+EMAIL+PASSWORD.
      # Run EditMode first; PlayMode step uses if:always() so it still runs if EditMode fails.
      #
      # PINNED EXACTLY, not `@v4`. On 2026-09-09 the `v4` tag moved to v4.4.0, which is
      # not a bug-fix release but a REWRITE: a thin wrapper around the new game-ci CLI,
      # which it then resolves at `cliVersion: latest`. Two floating versions stacked, one
      # of them a different program.
      #
      # It broke every consumer the next morning, and it did not look like a version
      # problem. Every run reported:
      #
      #   Unclassified error occured while trying to activate license.
      #   [Licensing::Client] Error: Code 400 ... (status: TimeStamp validation failed)
      #   ::error::No test result files were produced (runner/activation error).
      #
      # i.e. a licence failure, sending the reader to UNITY_LICENSE and the runner clock.
      # The builds in the same run activated fine with the same secret, which is the tell:
      # they use unity-builder, a different action. game-ci's own v4.3.2 notes warn about
      # this exact confusion — a failure "which surfaced as a retry-then-fail loop that
      # looked like a license activation problem".
      #
      # v4.3.2 is the last release on the old, long-stable architecture, and carries the
      # --shm-size fix Unity 6.6+ needs. Revisit by TESTING v4.4.0 on a branch, never by
      # floating back to `@v4` and finding out in production.
      - name: Run EditMode tests (Docker)
        if: ${{ inputs.build-engine == 'docker' && (inputs.test-mode == 'EditMode' || inputs.test-mode == 'All') }}
        continue-on-error: true   # job result is decided by parsed tests-failed, not the runner's exit code
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath:   ${{ inputs.project-path }}
          unityVersion:  ${{ inputs.unity-version }}
          testMode:      EditMode
          artifactsPath: test-results/EditMode
          # Empty unless asked for: supplying a token is what makes the action
          # attempt a check run, and the attempt fails on a read-only token.
          githubToken:   ${{ inputs.post-test-check-run && github.token || '' }}

      # ── 4b. Run tests — Docker lane (PlayMode) ────────────────────────────────
      # always() ensures PlayMode still runs even if EditMode tests failed.
      - name: Run PlayMode tests (Docker)
        if: >-
          ${{
            always() &&
            inputs.build-engine == 'docker' &&
            (inputs.test-mode == 'PlayMode' || inputs.test-mode == 'All')
          }}
        continue-on-error: true   # no PlayMode tests => non-zero exit; not a real failure
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath:   ${{ inputs.project-path }}
          unityVersion:  ${{ inputs.unity-version }}
          testMode:      PlayMode
          artifactsPath: test-results/PlayMode
          # Empty unless asked for: supplying a token is what makes the action
          # attempt a check run, and the attempt fails on a read-only token.
          githubToken:   ${{ inputs.post-test-check-run && github.token || '' }}

      # ── 4b. Unity preflight — native lanes ────────────────────────────────────
      # The preflight and later steps run Python 3.8+. A self-hosted runner may
      # have none (Windows: only the Microsoft Store placeholder). Find one by
      # running each candidate, install it per-user when missing, and put it —
      # plus a `python3` wrapper on Windows — on PATH for the following steps.
      - name: Ensure Python (self-hosted)
        if: ${{ inputs.build-engine == 'local' && (runner.os == 'Windows' || runner.os == 'macOS') }}
        shell: bash
        run: bash .toolkit/scripts/common/ensure_python.sh

      # The test steps used to assume a Unity Hub default path
      # (/Applications/Unity/Hub/Editor/<v>, C:\Program Files\Unity\Hub\Editor\<v>)
      # and failed with "Unity executable not found" on a runner whose editors
      # live elsewhere — while the build job, which runs preflight, found the
      # same editor. Same discovery as the build job; tests need no platform
      # module, only the editor ProjectVersion.txt names.
      - name: Unity preflight (provision editor)
        id: unity-preflight
        if: ${{ inputs.build-engine == 'local' && (runner.os == 'Windows' || runner.os == 'macOS') }}
        shell: bash
        env:
          PROJECT_PATH:     ${{ inputs.project-path }}
          EXPECTED_VERSION: ${{ inputs.unity-version }}
          UNITY_NO_ELEVATE: '1'
          # Where this repository keeps its Unity editors, per runner OS
          # (scripts/common/unity_editor_root.sh). Empty = runner configuration.
          UNITY_EDITOR_ROOT_WINDOWS: ${{ vars.UNITY_EDITOR_ROOT_WINDOWS || '' }}
          UNITY_EDITOR_ROOT_MACOS:   ${{ vars.UNITY_EDITOR_ROOT_MACOS || '' }}
        run: |
          set -Eeuo pipefail
          # Older toolkit-ref checkouts predate this helper; they keep runner config.
          if [[ -f .toolkit/scripts/common/unity_editor_root.sh ]]; then
            source .toolkit/scripts/common/unity_editor_root.sh
          fi
          args=(--project "${PROJECT_PATH}" --cli unity --format github-actions
                --install-cli-to "${UNITY_PREFLIGHT_CLI_HOME:-${RUNNER_TOOL_CACHE}/unity-cli}"
                --fallback-install-root "${USERPROFILE:-${HOME}}/Unity/Editors")
          RESULT="$(bash .toolkit/scripts/unity-preflight.sh "${args[@]}")"
          eval "${RESULT}"
          if [[ -n "${EXPECTED_VERSION}" && "${EXPECTED_VERSION}" != "${UNITY_VERSION}" ]]; then
            echo "::error title=Unity version mismatch::unity-version input is ${EXPECTED_VERSION}, but ${UNITY_PROJECT_PATH}/ProjectSettings/ProjectVersion.txt requires ${UNITY_VERSION}."
            exit 1
          fi
          echo "Unity ${UNITY_VERSION} for tests: ${UNITY_EDITOR} (${UNITY_EDITOR_SOURCE})"

      # ── 4c. Run tests — self-hosted Windows / macOS lanes ─────────────────────
      # The local editor the preflight step found or installed (no Docker, no
      # license secrets). run_unity_player.sh --tests is the same script the
      # build lanes use, so the editor path, Git Bash path conversion and
      # results layout are spelled once. It runs EditMode then PlayMode for
      # All and always exits 0: the verdict is the parsed results below (a
      # mode with no tests exits non-zero). Git Bash waits for Unity.exe,
      # which PowerShell's `&` did not (a GUI-subsystem program).
      - name: Run tests (self-hosted)
        if: ${{ inputs.build-engine == 'local' && (runner.os == 'Windows' || runner.os == 'macOS') }}
        shell: bash
        env:
          TEST_MODE:     ${{ inputs.test-mode }}
          PROJECT_PATH:  ${{ inputs.project-path }}
          UNITY_EDITOR:  ${{ steps.unity-preflight.outputs.unity_editor }}
        run: |
          bash .toolkit/scripts/build/run_unity_player.sh --tests "${TEST_MODE}" \
            --project "${PROJECT_PATH}" --editor "${UNITY_EDITOR}" --results-dir test-results

      # ── 5. Parse NUnit XML results ────────────────────────────────────────────
      # Sums passed/failed counts across all result XML files produced above.
      # Parse the NUnit3 <test-run> root attributes (passed/failed) from each XML.
      # Uses bash so it runs on every lane WITHOUT python3 — docker/macOS have
      # bash natively, self-hosted Windows uses Git Bash (no python3 required).
      - name: Parse test results
        id: parse-results
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          passed=0; failed=0; found=false
          files=$(find test-results -type f -name '*.xml' 2>/dev/null || true)
          if [ -z "${files}" ]; then
            echo "::warning::No NUnit XML result files found in test-results/"
          else
            found=true
            while IFS= read -r f; do
              [ -z "${f}" ] && continue
              # NUnit3 root <test-run ... passed="P" failed="F" total="T" ...> is the
              # first element carrying these attributes.
              p=$(grep -oE 'passed="[0-9]+"' "${f}" | head -1 | grep -oE '[0-9]+' || echo 0)
              fl=$(grep -oE 'failed="[0-9]+"' "${f}" | head -1 | grep -oE '[0-9]+' || echo 0)
              p=${p:-0}; fl=${fl:-0}
              passed=$((passed + p))
              failed=$((failed + fl))
              echo "${f}: passed=${p} failed=${fl}"
            done <<< "${files}"
          fi
          {
            echo "tests-passed=${passed}"
            echo "tests-failed=${failed}"
            echo "results-found=${found}"
          } >> "${GITHUB_OUTPUT}"
          echo "Total — passed: ${passed}, failed: ${failed}"

      # ── 6. Upload test results artifact ───────────────────────────────────────
      # Artifact name matches the convention in EXPLICIT_PLATFORM_FLOW_SPEC.md §4.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-tests-${{ inputs.test-mode }}
          path: test-results/
          if-no-files-found: warn
          retention-days: ${{ inputs.log-retention-days }}

      # ── 7. Set job-level result output ────────────────────────────────────────
      - name: Set result output
        id: set-result
        if: always()
        shell: bash
        run: |
          # Decide the job result from the PARSED test outcome, not the runner's
          # raw exit code (game-ci returns non-zero for a mode with no tests).
          FAILED="${{ steps.parse-results.outputs.tests-failed }}"
          FOUND="${{ steps.parse-results.outputs.results-found }}"
          FAILED="${FAILED:-0}"
          if [ "${FOUND}" != "true" ]; then
            RESULT="failure"
            echo "::error::No test result files were produced (runner/activation error)."
          elif [ "${FAILED}" -gt 0 ]; then
            RESULT="failure"
            echo "::error::${FAILED} test(s) failed."
          else
            RESULT="success"
          fi
          echo "result=${RESULT}"               >> "$GITHUB_OUTPUT"
          echo "artifact-name=unity-tests-${{ inputs.test-mode }}" >> "$GITHUB_OUTPUT"
          echo "Job result: ${RESULT} (failed=${FAILED}, results-found=${FOUND})"
          [ "${RESULT}" = "success" ]
