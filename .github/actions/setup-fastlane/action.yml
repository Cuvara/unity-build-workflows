name: Setup Fastlane
description: >
  Install Ruby and Fastlane with Bundler caching. On GitHub-hosted runners via
  ruby/setup-ruby; on self-hosted runners with the runner's own Ruby, because
  ruby/setup-ruby installs into /Users/runner/hostedtoolcache (macOS) or
  /opt/hostedtoolcache, which a self-hosted runner account cannot create
  ("EACCES: permission denied, mkdir '/Users/runner'").

inputs:
  ruby-version:
    description: Ruby version to install (GitHub-hosted runners only).
    required: false
    default: '3.2'
  working-directory:
    description: Directory containing the Gemfile (toolkit root).
    required: false
    default: '.toolkit'

runs:
  using: composite
  steps:
    - name: Setup Ruby (GitHub-hosted)
      if: ${{ runner.environment != 'self-hosted' }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true
        working-directory: ${{ inputs.working-directory }}

    - name: Find or install Ruby (self-hosted)
      id: ruby
      if: ${{ runner.environment == 'self-hosted' }}
      shell: bash
      # Runs every candidate and checks its version (PATH, then brew / rbenv /
      # asdf / where), installs Ruby when none qualifies, and puts it on PATH
      # for the following steps — the runner service's own PATH is frozen at
      # configuration time and misses a Ruby installed later.
      run: bash "${{ github.action_path }}/../../../scripts/common/ensure_ruby.sh"

    - name: Install gems (self-hosted)
      if: ${{ runner.environment == 'self-hosted' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -Eeuo pipefail
        echo "Ruby ${{ steps.ruby.outputs.ruby-version }} (${{ steps.ruby.outputs.ruby-source }}): ${{ steps.ruby.outputs.ruby-bin }}"
        # A per-runner cache instead of the system gem dir: no sudo, reused
        # across runs.
        bundle config set --local path "${RUNNER_TOOL_CACHE:-${HOME}/.cache}/toolkit-gems"
        bundle install --quiet
