name: Unity Pipeline (Reusable)

# Drop-in reusable: ports ALL orchestration jobs from the consumer workflow.
# Callers get the full resolve-config → validate → tests → builds → report
# → discord flow by referencing this file with workflow_call.
#
# Nesting depth: caller → unity-pipeline → reusable-build-platform = 3 (max 4 ✓)
#
# Architecture: see docs/EXPLICIT_PLATFORM_FLOW_SPEC.md
# Branch flow:  see docs/BRANCH_FLOW_CONTRACT.md
# Activation:   see docs/UNITY_PERSONAL_DOCKER_LICENSE.md

on:
  workflow_call:
    inputs:
      # ── Toolkit location ──────────────────────────────────────────────────
      project-path:
        description: "Path to the Unity project root relative to the workspace root."
        required: false
        default: '.'
        type: string

      submodule-auth:
        description: >-
          How git submodules are authenticated: 'token' (default) lets
          actions/checkout fetch them with GITHUB_TOKEN, 'ssh' fetches them in a
          separate step over SSH. Use 'ssh' when a submodule is a private
          repository in another organization — GITHUB_TOKEN cannot see it, and
          git reports it as "not found".
        required: false
        default: token
        type: string

      toolkit-repo:
        description: "Toolkit repository (owner/repo) for resolve_build_flow.sh."
        required: false
        default: 'Cuvara/unity-build-workflows'
        type: string

      toolkit-ref:
        description: "Git ref of the toolkit repo (branch, tag, SHA)."
        required: false
        default: 'main'
        type: string

      # ── Pass-through: mirror of workflow_dispatch inputs ─────────────────
      platform:
        description: "Target platform(s): All | Android | WebGL | Linux64 | LinuxServer | iOS"
        required: false
        default: 'All'
        type: string

      environment:
        description: "Build environment: production | staging | development"
        required: false
        default: 'production'
        type: string

      run-tests:
        description: "Run EditMode/PlayMode tests before building."
        required: false
        default: false
        type: boolean

      test-mode:
        description: "Test suite: EditMode | PlayMode | All"
        required: false
        default: 'All'
        type: string

      build-addressables:
        description: "Run Addressable build pipeline before platform builds."
        required: false
        default: false
        type: boolean

      activation-strategy:
        description: "Unity license activation strategy (docker lane only): auto | manual-license | account | serial | preactivated | none"
        required: false
        default: 'auto'
        type: string

      runner-mode:
        description: "Execution lane: docker | self-hosted-windows | auto"
        required: false
        default: 'docker'
        type: string

      runner-type:
        description: "WHERE the job runs: github-hosted | self-hosted (blank = resolver default/legacy mapping)."
        required: false
        default: ''
        type: string

      build-engine:
        description: "HOW Unity builds: docker | local (blank = resolver default/legacy mapping)."
        required: false
        default: ''
        type: string

      runner-labels:
        description: "Comma-separated runs-on labels (blank = resolver-derived from runner-type)."
        required: false
        default: ''
        type: string

      unity-version:
        description: "Override Unity version (blank = use ProjectSettings/ProjectVersion.txt)."
        required: false
        default: ''
        type: string

      clean-build:
        description: "auto|true|false — Force clean Library cache before building (auto = use BUILD_CLEAN variable)."
        required: false
        default: 'auto'
        type: string

      android-export:
        description: "Android output format: apk (installable) or aab (Play Store bundle)."
        required: false
        default: 'apk'
        type: string

      define-symbols:
        description: |
          Manual-dispatch extra Scripting Define Symbols (';' or ',' separated),
          applied additively at build time. For automatic push/PR builds the
          symbols come from the per-branch *_DEFINE_SYMBOLS repository variables
          instead; this input only applies to workflow_dispatch (e.g. iOS builds,
          which are manual-only).
        required: false
        default: ''
        type: string

    secrets:
      UNITY_LICENSE:
        description: "Raw .ulf file contents. Optional — docker lane personal activation."
        required: false
      UNITY_EMAIL:
        description: "Unity account email. Optional — docker lane activation."
        required: false
      UNITY_PASSWORD:
        description: "Unity account password. Optional — docker lane activation."
        required: false
      DISCORD_WEBHOOK_URL:
        description: "Discord webhook URL for build notifications. Optional — no-op when absent."
        required: false
      SUBMODULE_SSH_KEY:
        description: >-
          Private SSH key for fetching submodules when submodule-auth is 'ssh'.
          Optional — falls back to the runner's own SSH credentials, which a
          self-hosted runner usually already has.
        required: false

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: resolve-config
  # ════════════════════════════════════════════════════════════════════════════
  resolve-config:
    name: 01 / Resolve Build Config
    runs-on: ubuntu-latest
    outputs:
      # ── Unity / project ────────────────────────────────────────────────────
      unity-version:      ${{ steps.version.outputs.version }}
      project-path:       ${{ steps.version.outputs.project-path }}
      toolkit-ref:        ${{ steps.version.outputs.toolkit-ref }}
      # ── Flow resolver outputs ───────────────────────────────────────────────
      flow-type:          ${{ steps.flow.outputs.flow-type }}
      environment:        ${{ steps.flow.outputs.environment }}
      gh-environment:     ${{ steps.flow.outputs.gh-environment }}
      run-tests:          ${{ steps.flow.outputs.run-tests }}
      test-mode:          ${{ steps.flow.outputs.test-mode }}
      build-addressables: ${{ steps.flow.outputs.build-addressables }}
      build-android:      ${{ steps.flow.outputs.build-android }}
      build-webgl:        ${{ steps.flow.outputs.build-webgl }}
      build-linux64:      ${{ steps.flow.outputs.build-linux64 }}
      build-linuxserver:  ${{ steps.flow.outputs.build-linuxserver }}
      build-windows64:    ${{ steps.flow.outputs.build-windows64 }}
      build-ios:          ${{ steps.flow.outputs.build-ios }}
      signing:            ${{ steps.flow.outputs.signing }}
      platform-source:    ${{ steps.flow.outputs.platform-source }}
      define-symbols:     ${{ steps.flow.outputs.define-symbols }}
      # ── New grouped config resolver outputs ─────────────────────────────────
      build-method:            ${{ steps.flow.outputs.build-method }}
      build-timeout-minutes:   ${{ steps.flow.outputs.build-timeout-minutes }}
      clean-build:             ${{ steps.flow.outputs.clean-build }}
      clean-build-source:      ${{ steps.flow.outputs.clean-build-source }}
      test-editmode:           ${{ steps.flow.outputs.test-editmode }}
      test-playmode:           ${{ steps.flow.outputs.test-playmode }}
      test-fail-fast:          ${{ steps.flow.outputs.test-fail-fast }}
      runner-mode:             ${{ steps.flow.outputs.runner-mode }}
      runner-windows-label:    ${{ steps.flow.outputs.runner-windows-label }}
      runner-macos-label:      ${{ steps.flow.outputs.runner-macos-label }}
      runner-linux-label:      ${{ steps.flow.outputs.runner-linux-label }}
      # ── Runner / Build-Engine separation (V2) ───────────────────────────────
      runner-type:             ${{ steps.flow.outputs.runner-type }}
      build-engine:            ${{ steps.flow.outputs.build-engine }}
      execution-strategy:      ${{ steps.flow.outputs.execution-strategy }}
      runner-labels:           ${{ steps.flow.outputs.runner-labels }}
      runner-labels-csv:       ${{ steps.flow.outputs.runner-labels-csv }}
      activation-strategy:     ${{ steps.flow.outputs.activation-strategy }}
      cache-library:           ${{ steps.flow.outputs.cache-library }}
      cache-gradle:            ${{ steps.flow.outputs.cache-gradle }}
      cache-addressables:      ${{ steps.flow.outputs.cache-addressables }}
      cache-nuget:             ${{ steps.flow.outputs.cache-nuget }}
      artifact-retention-days: ${{ steps.flow.outputs.artifact-retention-days }}
      artifact-compression:    ${{ steps.flow.outputs.artifact-compression }}
      # ── Project metadata (extract_project_metadata.sh) ─────────────────────
      product-name:       ${{ steps.meta.outputs.product-name }}
      app-version:        ${{ steps.meta.outputs.app-version }}
      bundle-id:          ${{ steps.meta.outputs.bundle-id-android }}
      scripting-backend:  ${{ steps.meta.outputs.scripting-backend }}
      android-arch:       ${{ steps.meta.outputs.android-arch }}
      orientation:        ${{ steps.meta.outputs.orientation }}
      store-link:         ${{ steps.meta.outputs.store-link-android }}
      android-export-type: ${{ steps.flow.outputs.android-export-type }}
      define-symbols-count: ${{ steps.meta.outputs.define-symbols-count }}
      # ── Build matrix + node display labels (stages 03/04) ──────────────────
      configuration:          ${{ steps.matrix.outputs.configuration }}
      android-artifact-type:  ${{ steps.matrix.outputs.android-artifact-type }}
      label-addressables:     ${{ steps.matrix.outputs.label-addressables }}
      build-matrix:           ${{ steps.matrix.outputs.build-matrix }}
      validate-matrix:        ${{ steps.matrix.outputs.validate-matrix }}
      has-builds:             ${{ steps.matrix.outputs.has-builds }}
      has-validations:        ${{ steps.matrix.outputs.has-validations }}
    steps:
      - name: Checkout (shallow — only needs ProjectVersion.txt)
        uses: actions/checkout@v4
        with:
          # `project-path` may be '.' (project at the repo root) or a subdirectory,
          # and the next step reads "${PROJECT_PATH}/ProjectSettings/ProjectVersion.txt".
          # A non-cone pattern containing a slash is anchored to the repo root, so the
          # bare 'ProjectSettings/...' pattern checked out nothing for a project in a
          # subdirectory and the resolve step failed. A leading '**/' matches the file
          # at any depth, the repo root included, which covers every project-path.
          sparse-checkout: |
            **/ProjectSettings/ProjectVersion.txt
          sparse-checkout-cone-mode: false

      - name: Resolve Unity version
        id: version
        shell: bash
        env:
          # Explicit pin: dispatch input > UNITY_VERSION repo variable. Either is
          # OPTIONAL and is validated against ProjectVersion.txt (the SSOT) below —
          # a mismatch fails the build, so the pin can only confirm, never override.
          OVERRIDE:     ${{ inputs.unity-version || vars.UNITY_VERSION }}
          PROJECT_PATH: ${{ inputs.project-path }}
          TOOLKIT_REF:  ${{ inputs.toolkit-ref }}
        run: |
          set -euo pipefail
          PV="${PROJECT_PATH%/}/ProjectSettings/ProjectVersion.txt"
          if [ ! -f "$PV" ]; then
            echo "::error::ProjectVersion.txt not found at ${PV}"
            exit 1
          fi
          # Unity on Windows writes ProjectVersion.txt with CRLF, so awk's field
          # keeps a trailing CR. Strip it, or the comparison below rejects two
          # versions that print identically.
          PROJECT_VERSION=$(grep '^m_EditorVersion:' "$PV" | awk '{print $2}' | tr -d '\r')
          echo "Project Unity version (SSOT): ${PROJECT_VERSION}"
          if [ -n "${OVERRIDE}" ] && [ "${OVERRIDE}" != "${PROJECT_VERSION}" ]; then
            echo "::error::Unity version mismatch:"
            echo "::error::  ProjectVersion.txt: ${PROJECT_VERSION}"
            echo "::error::  Pin (input/UNITY_VERSION var): ${OVERRIDE}"
            echo "::error::ProjectVersion.txt is the source of truth. Either update it to change the Unity version, or fix the UNITY_VERSION repository variable / unity-version input to match."
            exit 1
          fi
          RESOLVED="${OVERRIDE:-${PROJECT_VERSION}}"
          echo "version=${RESOLVED}"          >> "$GITHUB_OUTPUT"
          echo "project-path=${PROJECT_PATH}" >> "$GITHUB_OUTPUT"
          echo "toolkit-ref=${TOOLKIT_REF}"   >> "$GITHUB_OUTPUT"
          echo "Resolved: version=${RESOLVED} project-path=${PROJECT_PATH} toolkit-ref=${TOOLKIT_REF}"

      - name: Checkout toolkit (for resolve_build_flow.sh)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref:        ${{ inputs.toolkit-ref }}
          path:       .toolkit

      - name: Extract project metadata
        id: meta
        continue-on-error: true
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set +e
          bash .toolkit/scripts/common/extract_project_metadata.sh || true

      - name: Resolve build flow
        id: flow
        shell: bash
        env:
          EVENT_NAME:            ${{ github.event_name }}
          REF_NAME:              ${{ github.ref_name }}
          BASE_REF:              ${{ github.base_ref }}
          IN_PLATFORM:           ${{ inputs.platform || '' }}
          IN_ENVIRONMENT:        ${{ inputs.environment || '' }}
          IN_RUN_TESTS:          ${{ inputs.run-tests || '' }}
          IN_TEST_MODE:          ${{ inputs.test-mode || '' }}
          IN_BUILD_ADDRESSABLES: ${{ inputs.build-addressables || '' }}
          IN_ANDROID_EXPORT:     ${{ inputs.android-export || '' }}
          IN_DEFINE_SYMBOLS:     ${{ inputs.define-symbols || '' }}
          # ── Repository Variables (optional platform/config overrides) ──────
          VAR_DEVELOP_BUILD_PLATFORMS:     ${{ vars.DEVELOP_BUILD_PLATFORMS || '' }}
          VAR_STAGING_BUILD_PLATFORMS:     ${{ vars.STAGING_BUILD_PLATFORMS || '' }}
          VAR_RELEASE_BUILD_PLATFORMS:     ${{ vars.RELEASE_BUILD_PLATFORMS || '' }}
          VAR_DEVELOP_RUN_TESTS:          ${{ vars.DEVELOP_RUN_TESTS || '' }}
          VAR_STAGING_RUN_TESTS:          ${{ vars.STAGING_RUN_TESTS || '' }}
          VAR_RELEASE_RUN_TESTS:          ${{ vars.RELEASE_RUN_TESTS || '' }}
          VAR_DEVELOP_BUILD_ADDRESSABLES: ${{ vars.DEVELOP_BUILD_ADDRESSABLES || '' }}
          VAR_STAGING_BUILD_ADDRESSABLES: ${{ vars.STAGING_BUILD_ADDRESSABLES || '' }}
          VAR_RELEASE_BUILD_ADDRESSABLES: ${{ vars.RELEASE_BUILD_ADDRESSABLES || '' }}
          VAR_DEFAULT_RUNNER_MODE:        ${{ vars.DEFAULT_RUNNER_MODE || '' }}
          VAR_DEVELOP_DEFINE_SYMBOLS:     ${{ vars.DEVELOP_DEFINE_SYMBOLS || '' }}
          VAR_STAGING_DEFINE_SYMBOLS:     ${{ vars.STAGING_DEFINE_SYMBOLS || '' }}
          VAR_RELEASE_DEFINE_SYMBOLS:     ${{ vars.RELEASE_DEFINE_SYMBOLS || '' }}
          # ── New grouped Repository Variables (New > Legacy > Default) ──────
          NEW_BUILD_DEVELOP_PLATFORMS:  ${{ vars.BUILD_DEVELOP_PLATFORMS }}
          NEW_BUILD_STAGING_PLATFORMS:  ${{ vars.BUILD_STAGING_PLATFORMS }}
          NEW_BUILD_RELEASE_PLATFORMS:  ${{ vars.BUILD_RELEASE_PLATFORMS }}
          NEW_TEST_DEVELOP_ENABLED:     ${{ vars.TEST_DEVELOP_ENABLED }}
          NEW_TEST_STAGING_ENABLED:     ${{ vars.TEST_STAGING_ENABLED }}
          NEW_TEST_RELEASE_ENABLED:     ${{ vars.TEST_RELEASE_ENABLED }}
          NEW_ADDRESSABLES_DEVELOP_ENABLED: ${{ vars.ADDRESSABLES_DEVELOP_ENABLED }}
          NEW_ADDRESSABLES_STAGING_ENABLED: ${{ vars.ADDRESSABLES_STAGING_ENABLED }}
          NEW_ADDRESSABLES_RELEASE_ENABLED: ${{ vars.ADDRESSABLES_RELEASE_ENABLED }}
          NEW_DEVELOP_DEFINE_SYMBOLS:   ${{ vars.UNITY_DEVELOP_DEFINE_SYMBOLS }}
          NEW_STAGING_DEFINE_SYMBOLS:   ${{ vars.UNITY_STAGING_DEFINE_SYMBOLS }}
          NEW_RELEASE_DEFINE_SYMBOLS:   ${{ vars.UNITY_RELEASE_DEFINE_SYMBOLS }}
          # UNITY_VERSION / UNITY_PROJECT_PATH are NOT wired as repo variables:
          # Unity version SSOT is ProjectSettings/ProjectVersion.txt; project path
          # is set by the caller (unity-build.yml). Both would be redundant.
          NEW_UNITY_BUILD_METHOD:       ${{ vars.UNITY_BUILD_METHOD }}
          NEW_BUILD_TIMEOUT_MINUTES:    ${{ vars.BUILD_TIMEOUT_MINUTES }}
          NEW_BUILD_CLEAN:              ${{ vars.BUILD_CLEAN }}
          NEW_TEST_EDITMODE_ENABLED:    ${{ vars.TEST_EDITMODE_ENABLED }}
          NEW_TEST_PLAYMODE_ENABLED:    ${{ vars.TEST_PLAYMODE_ENABLED }}
          NEW_TEST_FAIL_FAST:           ${{ vars.TEST_FAIL_FAST }}
          NEW_RUNNER_DEFAULT_MODE:      ${{ vars.RUNNER_DEFAULT_MODE }}
          NEW_RUNNER_WINDOWS_LABEL:     ${{ vars.RUNNER_WINDOWS_LABEL }}
          NEW_RUNNER_MACOS_LABEL:       ${{ vars.RUNNER_MACOS_LABEL }}
          NEW_RUNNER_LINUX_LABEL:       ${{ vars.RUNNER_LINUX_LABEL }}
          # ── Runner / Build-Engine separation (V2) ───────────────────────────
          NEW_RUNNER_TYPE:              ${{ vars.RUNNER_TYPE }}
          NEW_BUILD_ENGINE:             ${{ vars.BUILD_ENGINE }}
          NEW_RUNNER_LABELS:            ${{ vars.RUNNER_LABELS }}
          IN_RUNNER_TYPE:               ${{ inputs.runner-type }}
          IN_BUILD_ENGINE:              ${{ inputs.build-engine }}
          IN_RUNNER_LABELS:             ${{ inputs.runner-labels }}
          IN_ACTIVATION_STRATEGY:       ${{ inputs.activation-strategy }}
          NEW_CACHE_LIBRARY_ENABLED:    ${{ vars.CACHE_LIBRARY_ENABLED }}
          NEW_CACHE_GRADLE_ENABLED:     ${{ vars.CACHE_GRADLE_ENABLED }}
          NEW_CACHE_ADDRESSABLES_ENABLED: ${{ vars.CACHE_ADDRESSABLES_ENABLED }}
          NEW_CACHE_NUGET_ENABLED:      ${{ vars.CACHE_NUGET_ENABLED }}
          NEW_ARTIFACT_RETENTION_DAYS:  ${{ vars.ARTIFACT_RETENTION_DAYS }}
          NEW_ARTIFACT_COMPRESSION:     ${{ vars.ARTIFACT_COMPRESSION }}
          IN_CLEAN_BUILD:               ${{ inputs.clean-build || '' }}
        run: |
          set -euo pipefail
          echo "Flow resolver: event=${EVENT_NAME} ref=${REF_NAME} base=${BASE_REF:-<none>}"
          bash .toolkit/scripts/common/resolve_build_flow.sh

      # ── Build matrix ───────────────────────────────────────────────────────
      # The platform set is DATA, not nine hardcoded jobs. Nine `if:`-gated jobs
      # meant GitHub drew a skipped node for every platform you did not ask for,
      # so an Android-only run still rendered WebGL, iOS, Linux64, LinuxServer,
      # Windows64 and two artifact validations greyed out. A matrix renders
      # exactly the platforms that were selected — and adding a platform becomes
      # a row here instead of a new 45-line job.
      #
      # Casing lives here too: GitHub expressions have no upper()/title(), so
      # resolving "Production" and "AAB" once beats seven copies of `tr`.
      - name: Resolve build matrix
        id: matrix
        shell: bash
        env:
          ENVIRONMENT:  ${{ steps.flow.outputs.environment }}
          ANDROID_TYPE: ${{ steps.flow.outputs.android-export-type }}
          SEL_ANDROID:     ${{ steps.flow.outputs.build-android }}
          SEL_WEBGL:       ${{ steps.flow.outputs.build-webgl }}
          SEL_LINUX64:     ${{ steps.flow.outputs.build-linux64 }}
          SEL_LINUXSERVER: ${{ steps.flow.outputs.build-linuxserver }}
          SEL_WINDOWS64:   ${{ steps.flow.outputs.build-windows64 }}
          SEL_IOS:         ${{ steps.flow.outputs.build-ios }}
        run: |
          set -Eeuo pipefail

          case "${ENVIRONMENT}" in
            development) CONFIG="Development" ;;
            staging)     CONFIG="Staging" ;;
            production)  CONFIG="Production" ;;
            "")          CONFIG="Production" ;;
            *)           CONFIG="$(printf '%s' "${ENVIRONMENT:0:1}" | tr '[:lower:]' '[:upper:]')${ENVIRONMENT:1}" ;;
          esac
          ANDROID_ARTIFACT=$(printf '%s' "${ANDROID_TYPE:-apk}" | tr '[:lower:]' '[:upper:]')

          BUILD_ROWS=""
          VALIDATE_ROWS=""

          # add <selected> <platform> <artifact-type> <node-suffix> <validator>
          # node-suffix is appended after "03 / <platform>" in the graph, so it
          # only carries what the platform name does not already say.
          # validator is empty for platforms with no stage-04 checker.
          add() {
            [ "$1" = "true" ] || return 0
            local platform="$2" artifact="$3" suffix="$4" validator="$5"
            BUILD_ROWS="${BUILD_ROWS}{\"platform\":\"${platform}\",\"artifact-type\":\"${artifact}\",\"node\":\"${suffix}\"},"
            if [ -n "${validator}" ]; then
              VALIDATE_ROWS="${VALIDATE_ROWS}{\"platform\":\"${platform}\",\"artifact-type\":\"${artifact}\",\"validator\":\"${validator}\",\"node\":\"${suffix}\"},"
            fi
          }

          add "${SEL_ANDROID}"     Android     "${ANDROID_ARTIFACT}" "${CONFIG} / ${ANDROID_ARTIFACT}" android
          add "${SEL_IOS}"         iOS         XCODEPROJ             "${CONFIG} / Xcode Project"      ios
          add "${SEL_WEBGL}"       WebGL       WEBGL                 "${CONFIG}"                      webgl
          add "${SEL_LINUX64}"     Linux64     LINUX                 "${CONFIG}"                      ""
          add "${SEL_LINUXSERVER}" LinuxServer LINUX                 "${CONFIG}"                      ""
          add "${SEL_WINDOWS64}"   Windows64   EXE                   "${CONFIG}"                      ""

          BUILD_MATRIX="[${BUILD_ROWS%,}]"
          VALIDATE_MATRIX="[${VALIDATE_ROWS%,}]"

          # A matrix with no vectors is a workflow error, so the jobs are also
          # gated on these being non-empty.
          {
            echo "configuration=${CONFIG}"
            echo "android-artifact-type=${ANDROID_ARTIFACT}"
            echo "label-addressables=${CONFIG}"
            echo "build-matrix=${BUILD_MATRIX}"
            echo "validate-matrix=${VALIDATE_MATRIX}"
            echo "has-builds=$([ "${BUILD_MATRIX}" = "[]" ] && echo false || echo true)"
            echo "has-validations=$([ "${VALIDATE_MATRIX}" = "[]" ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"

          echo "[matrix] configuration=${CONFIG}"
          echo "[matrix] build=${BUILD_MATRIX}"
          echo "[matrix] validate=${VALIDATE_MATRIX}"

      - name: Write config summary
        if: always()
        continue-on-error: true
        shell: bash
        env:
          FLOW_TYPE:      ${{ steps.flow.outputs.flow-type }}
          ENVIRONMENT:    ${{ steps.flow.outputs.environment }}
          UNITY_VERSION:  ${{ steps.version.outputs.version }}
          RUNNER_MODE:    ${{ steps.flow.outputs.runner-mode }}
          RUNNER_TYPE:        ${{ steps.flow.outputs.runner-type }}
          RUNNER_LABELS_CSV:  ${{ steps.flow.outputs.runner-labels-csv }}
          BUILD_ENGINE:       ${{ steps.flow.outputs.build-engine }}
          EXECUTION_STRATEGY: ${{ steps.flow.outputs.execution-strategy }}
          ACTIVATION_STRATEGY: ${{ steps.flow.outputs.activation-strategy }}
          SEL_ANDROID:     ${{ steps.flow.outputs.build-android }}
          SEL_WEBGL:       ${{ steps.flow.outputs.build-webgl }}
          SEL_LINUX64:     ${{ steps.flow.outputs.build-linux64 }}
          SEL_LINUXSERVER: ${{ steps.flow.outputs.build-linuxserver }}
          SEL_WINDOWS64:   ${{ steps.flow.outputs.build-windows64 }}
          SEL_IOS:         ${{ steps.flow.outputs.build-ios }}
          RUN_TESTS:       ${{ steps.flow.outputs.run-tests }}
          TEST_MODE:       ${{ steps.flow.outputs.test-mode }}
          BUILD_ADDR:      ${{ steps.flow.outputs.build-addressables }}
          DEFINE_SYMBOLS:  ${{ steps.flow.outputs.define-symbols }}
          BUILD_TIMEOUT:   ${{ steps.flow.outputs.build-timeout-minutes }}
          CACHE_LIBRARY:      ${{ steps.flow.outputs.cache-library }}
          CACHE_GRADLE:       ${{ steps.flow.outputs.cache-gradle }}
          CACHE_ADDRESSABLES: ${{ steps.flow.outputs.cache-addressables }}
          CACHE_NUGET:        ${{ steps.flow.outputs.cache-nuget }}
          ARTIFACT_RETENTION: ${{ steps.flow.outputs.artifact-retention-days }}
          ARTIFACT_COMPRESSION: ${{ steps.flow.outputs.artifact-compression }}
          CLEAN_BUILD:        ${{ steps.flow.outputs.clean-build }}
          CLEAN_BUILD_SOURCE: ${{ steps.flow.outputs.clean-build-source }}
        run: |
          set +e
          PLATFORMS=""
          [ "${SEL_ANDROID}" = "true" ]     && PLATFORMS="${PLATFORMS:+$PLATFORMS, }Android"
          [ "${SEL_WEBGL}" = "true" ]       && PLATFORMS="${PLATFORMS:+$PLATFORMS, }WebGL"
          [ "${SEL_LINUX64}" = "true" ]     && PLATFORMS="${PLATFORMS:+$PLATFORMS, }Linux64"
          [ "${SEL_LINUXSERVER}" = "true" ] && PLATFORMS="${PLATFORMS:+$PLATFORMS, }LinuxServer"
          [ "${SEL_WINDOWS64}" = "true" ]   && PLATFORMS="${PLATFORMS:+$PLATFORMS, }Windows64"
          [ "${SEL_IOS}" = "true" ]         && PLATFORMS="${PLATFORMS:+$PLATFORMS, }iOS"
          [ -z "${PLATFORMS}" ] && PLATFORMS="(none)"

          TESTS="disabled"
          [ "${RUN_TESTS}" = "true" ] && TESTS="${TEST_MODE:-All}"

          CACHE="library=${CACHE_LIBRARY:-?} gradle=${CACHE_GRADLE:-?} addressables=${CACHE_ADDRESSABLES:-?} nuget=${CACHE_NUGET:-?}"
          ARTIFACT="retention=${ARTIFACT_RETENTION:-?}d compression=${ARTIFACT_COMPRESSION:-?}"

          {
            echo "## Resolve Config Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Flow | \`${FLOW_TYPE:-unknown}\` |"
            echo "| Environment | \`${ENVIRONMENT:-unknown}\` |"
            echo "| Unity Version | \`${UNITY_VERSION:-unknown}\` |"
            echo "| Runner | \`${RUNNER_MODE:-unknown}\` |"
            echo "| Runner Type | \`${RUNNER_TYPE:-unknown}\` |"
            echo "| Runner Labels | \`${RUNNER_LABELS_CSV:-unknown}\` |"
            echo "| Build Engine | \`${BUILD_ENGINE:-unknown}\` |"
            echo "| Execution Strategy | \`${EXECUTION_STRATEGY:-unknown}\` |"
            echo "| Activation Strategy | \`${ACTIVATION_STRATEGY:-unknown}\` |"
            echo "| Platforms | ${PLATFORMS} |"
            echo "| Tests | \`${TESTS}\` |"
            echo "| Addressables | \`${BUILD_ADDR:-false}\` |"
            echo "| Define Symbols | \`${DEFINE_SYMBOLS:-(none)}\` |"
            echo "| Timeout | \`${BUILD_TIMEOUT:-?} min\` |"
            echo "| Cache | \`${CACHE}\` |"
            echo "| Artifact | \`${ARTIFACT}\` |"
            echo "| Clean Build | \`${CLEAN_BUILD:-false}\` (source: \`${CLEAN_BUILD_SOURCE:-default}\`) |"
          } >> "$GITHUB_STEP_SUMMARY" || true

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: validate-project
  # ════════════════════════════════════════════════════════════════════════════
  validate-project:
    name: 01 / Validate Unity Project
    needs: [resolve-config]
    if: needs.resolve-config.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project structure
        shell: bash
        env:
          PROJECT_PATH:  ${{ needs.resolve-config.outputs.project-path }}
          UNITY_VERSION: ${{ needs.resolve-config.outputs.unity-version }}
        run: |
          set -euo pipefail
          ERRORS=0

          check() {
            local path="$1" label="$2"
            if [ ! -e "${PROJECT_PATH%/}/${path}" ]; then
              echo "::error::Missing ${label}: ${PROJECT_PATH%/}/${path}"
              ERRORS=$((ERRORS + 1))
            else
              echo "  ✓ ${label}"
            fi
          }

          echo "Validating Unity project at '${PROJECT_PATH}' (Unity ${UNITY_VERSION})"
          check "ProjectSettings/ProjectVersion.txt" "ProjectVersion.txt"
          check "Packages/manifest.json"             "Packages/manifest.json"
          check "Assets"                             "Assets directory"

          if [ "${ERRORS}" -gt 0 ]; then
            echo "::error::Project validation failed (${ERRORS} error(s))"
            exit 1
          fi
          echo "Project validation passed."

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2.5: validate-license
  # ════════════════════════════════════════════════════════════════════════════
  # Validates UNITY_LICENSE before any Docker-based job runs.
  # Compares UNITY_LICENSE_VERSION variable (set by generate-license) against
  # the project's Unity version. Fails fast with clear regeneration instructions
  # when the license is missing, malformed, or version-mismatched.
  validate-license:
    name: 01 / Validate Unity License
    needs: [resolve-config]
    if: >-
      needs.resolve-config.result == 'success' &&
      needs.resolve-config.outputs.build-engine == 'docker'
    runs-on: ubuntu-latest
    outputs:
      license-valid: ${{ steps.check.outputs.valid }}
    steps:
      - name: Check license validity
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_VERSION: ${{ needs.resolve-config.outputs.unity-version }}
          LICENSE_VERSION: ${{ vars.UNITY_LICENSE_VERSION }}
        run: |
          set -euo pipefail
          VALID=true
          REASONS=""

          # Determine available credentials
          HAS_LICENSE=$( [ -n "${UNITY_LICENSE}" ] && echo true || echo false )
          HAS_EMAIL=$( [ -n "${UNITY_EMAIL}" ] && echo true || echo false )
          HAS_PASSWORD=$( [ -n "${UNITY_PASSWORD}" ] && echo true || echo false )

          echo "Credentials: license=${HAS_LICENSE} email=${HAS_EMAIL} password=${HAS_PASSWORD}"

          # Activation requires at least email+password (account activation)
          # or UNITY_LICENSE (.ulf for personal-combined)
          if [ "${HAS_LICENSE}" = "false" ]; then
            if [ "${HAS_EMAIL}" = "true" ] && [ "${HAS_PASSWORD}" = "true" ]; then
              echo "::notice::No UNITY_LICENSE — GameCI will attempt account activation with email+password."
            else
              echo "::error::No valid activation credentials found. Need: (UNITY_EMAIL+UNITY_PASSWORD) or (UNITY_LICENSE)"
              REASONS="${REASONS}\n  - No activation credentials (license or email+password)"
              VALID=false
            fi
          fi

          # If UNITY_LICENSE is set, check version match
          if [ "${HAS_LICENSE}" = "true" ] && [ -n "${LICENSE_VERSION}" ] && [ "${LICENSE_VERSION}" != "${UNITY_VERSION}" ]; then
            echo "::warning::License version mismatch: UNITY_LICENSE_VERSION=${LICENSE_VERSION}, project uses Unity ${UNITY_VERSION}. License may need regeneration."
          fi

          # Content hints (warning only)
          if [ "${HAS_LICENSE}" = "true" ]; then
            if printf '%s' "${UNITY_LICENSE}" | grep -qiE '<ActivationRequest|\.alf'; then
              echo "::warning::UNITY_LICENSE looks like an .alf (activation request), not a .ulf (license)."
            fi
          fi

          echo "valid=${VALID}" >> "$GITHUB_OUTPUT"

          if [ "${VALID}" = "false" ]; then
            {
              echo "## License Validation Failed"
              echo ""
              echo "**Problems:**"
              printf '%b\n' "${REASONS}"
              echo ""
              echo "**Fix:**"
              echo "1. Run the **Generate Docker License** workflow for Unity \`${UNITY_VERSION}\`"
              echo "2. Download the artifact (**.alf** file)"
              echo "3. Upload to https://license.unity3d.com/manual → download **.ulf**"
              echo "4. Set the secret:"
              echo '   ```bash'
              echo "   gh secret set UNITY_LICENSE --org <ORG> --visibility all < Unity_lic.ulf"
              echo "   gh variable set UNITY_LICENSE_VERSION --org <ORG> --visibility all --body \"${UNITY_VERSION}\""
              echo '   ```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "License validation passed (Unity ${UNITY_VERSION})"
          {
            echo "## License Validation"
            echo "License valid for Unity \`${UNITY_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: unity-tests
  # ════════════════════════════════════════════════════════════════════════════
  unity-tests:
    name: 02 / Unity Tests
    needs: [resolve-config, validate-project, validate-license]
    if: >-
      !cancelled() &&
      needs.validate-project.result == 'success' &&
      (needs.validate-license.result == 'success' || needs.validate-license.result == 'skipped') &&
      needs.resolve-config.outputs.run-tests == 'true'
    uses: ./.github/workflows/reusable-unity-tests.yml
    with:
      node-label:          ${{ needs.resolve-config.outputs.test-mode }}
      unity-version:       ${{ needs.resolve-config.outputs.unity-version }}
      test-mode:           ${{ needs.resolve-config.outputs.test-mode }}
      project-path:        ${{ needs.resolve-config.outputs.project-path }}
      runner-mode:         ${{ inputs.runner-mode || needs.resolve-config.outputs.runner-mode }}
      runner-labels:       ${{ needs.resolve-config.outputs.runner-labels }}
      build-engine:        ${{ needs.resolve-config.outputs.build-engine }}
      activation-strategy: ${{ needs.resolve-config.outputs.activation-strategy }}
      toolkit-ref:         ${{ needs.resolve-config.outputs.toolkit-ref }}
      submodule-auth:      ${{ inputs.submodule-auth || 'token' }}
      build-timeout-minutes:   ${{ fromJSON(needs.resolve-config.outputs.build-timeout-minutes) }}
      cache-library:           ${{ fromJSON(needs.resolve-config.outputs.cache-library) }}
      artifact-retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}
      runner-windows-label:    ${{ needs.resolve-config.outputs.runner-windows-label }}
      runner-macos-label:      ${{ needs.resolve-config.outputs.runner-macos-label }}
      runner-linux-label:      ${{ needs.resolve-config.outputs.runner-linux-label }}
      test-fail-fast:          ${{ fromJSON(needs.resolve-config.outputs.test-fail-fast) }}
    secrets:
      UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3.5: quality-gate  — STAGE 02 boundary
  # ════════════════════════════════════════════════════════════════════════════
  # The single edge every stage-03 build depends on. Before this job existed the
  # builds only needed validate-project/validate-license, so Unity Tests ran
  # *beside* the builds: a red test suite still burned a full Android + WebGL +
  # Windows build before anyone was told. Everything expensive now sits behind
  # this one node, and the graph shows exactly where the pipeline stopped.
  #
  # This job is deliberately cheap (a few seconds on ubuntu-latest). It adds one
  # node of latency in exchange for not paying for builds that were never going
  # to ship.
  #
  # Pass semantics — `skipped` is a pass, everywhere:
  #   * validate-license is skipped on the local build engine (no license needed)
  #   * unity-tests is skipped when run-tests resolves false
  # Anything else (failure, cancelled, timed_out, or an empty result from a job
  # that never reported) closes the gate.
  quality-gate:
    name: 02 / Quality Gate
    needs: [resolve-config, validate-project, validate-license, unity-tests]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
      blocking-stage: ${{ steps.gate.outputs.blocking-stage }}
    steps:
      - name: Evaluate quality gate
        id: gate
        shell: bash
        env:
          R_RESOLVE:  ${{ needs.resolve-config.result }}
          R_VALIDATE: ${{ needs.validate-project.result }}
          R_LICENSE:  ${{ needs.validate-license.result }}
          R_TESTS:    ${{ needs.unity-tests.result }}
          TEST_MODE:  ${{ needs.resolve-config.outputs.test-mode }}
          RUN_TESTS:  ${{ needs.resolve-config.outputs.run-tests }}
        run: |
          set -Eeuo pipefail

          PASSED=true
          BLOCKING=""

          gate() { # stage-label job-label result
            case "$3" in
              success|skipped) echo "  ✓ $2: $3" ;;
              *)
                echo "  ✗ $2: ${3:-<no result>}"
                PASSED=false
                [[ -z "${BLOCKING}" ]] && BLOCKING="$1 / $2"
                ;;
            esac
          }

          echo "Quality gate (run-tests=${RUN_TESTS:-false}, test-mode=${TEST_MODE:-N/A})"
          # resolve-config must be checked explicitly. Everything downstream of
          # it is SKIPPED when it fails, and `skipped` is a pass here — so
          # without this line a failed resolver opened the gate and the whole
          # run reported green with nothing built.
          gate "01 PREPARE"      "Resolve Build Config"   "${R_RESOLVE}"
          gate "01 PREPARE"      "Validate Unity Project" "${R_VALIDATE}"
          gate "01 PREPARE"      "Validate Unity License" "${R_LICENSE}"
          gate "02 QUALITY GATE" "Unity Tests"            "${R_TESTS}"

          echo "passed=${PASSED}"          >> "$GITHUB_OUTPUT"
          echo "blocking-stage=${BLOCKING}" >> "$GITHUB_OUTPUT"

          {
            echo "## 02 — Quality Gate"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| 01 / Resolve Build Config | \`${R_RESOLVE}\` |"
            echo "| 01 / Validate Unity Project | \`${R_VALIDATE}\` |"
            echo "| 01 / Validate Unity License | \`${R_LICENSE}\` |"
            echo "| 02 / Unity Tests | \`${R_TESTS}\` |"
            echo ""
            if [[ "${PASSED}" == "true" ]]; then
              echo "✅ Gate open — stage 03 (BUILD ARTIFACTS) may start."
            else
              echo "❌ Gate closed at **${BLOCKING}** — no platform build was started."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${PASSED}" != "true" ]]; then
            echo "::error title=Quality Gate::Blocked at ${BLOCKING}. Stage 03 builds were not started."
            exit 1
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4: build-addressables
  # ════════════════════════════════════════════════════════════════════════════
  build-addressables:
    name: 03 / Addressables
    needs: [resolve-config, quality-gate]
    if: >-
      !cancelled() &&
      needs.quality-gate.outputs.passed == 'true' &&
      needs.resolve-config.outputs.build-addressables == 'true'
    uses: ./.github/workflows/reusable-build-platform.yml
    with:
      platform:            Addressables
      node-label:          ${{ needs.resolve-config.outputs.label-addressables }}
      configuration:       ${{ needs.resolve-config.outputs.configuration }}
      artifact-type:       ADDRESSABLES
      app-version:         ${{ needs.resolve-config.outputs.app-version }}
      toolkit-repo:        ${{ inputs.toolkit-repo }}
      unity-version:       ${{ needs.resolve-config.outputs.unity-version }}
      project-path:        ${{ needs.resolve-config.outputs.project-path }}
      environment:         ${{ needs.resolve-config.outputs.environment }}
      runner-mode:         ${{ inputs.runner-mode || needs.resolve-config.outputs.runner-mode }}
      runner-labels:       ${{ needs.resolve-config.outputs.runner-labels }}
      build-engine:        ${{ needs.resolve-config.outputs.build-engine }}
      activation-strategy: ${{ needs.resolve-config.outputs.activation-strategy }}
      clean-build:         ${{ fromJSON(needs.resolve-config.outputs.clean-build) }}
      build-addressables:  false
      toolkit-ref:         ${{ needs.resolve-config.outputs.toolkit-ref }}
      submodule-auth:      ${{ inputs.submodule-auth || 'token' }}
      define-symbols:      ${{ needs.resolve-config.outputs.define-symbols }}
      build-timeout-minutes:   ${{ fromJSON(needs.resolve-config.outputs.build-timeout-minutes) }}
      cache-library:           ${{ fromJSON(needs.resolve-config.outputs.cache-library) }}
      cache-gradle:            ${{ fromJSON(needs.resolve-config.outputs.cache-gradle) }}
      cache-addressables:      ${{ fromJSON(needs.resolve-config.outputs.cache-addressables) }}
      cache-nuget:             ${{ fromJSON(needs.resolve-config.outputs.cache-nuget) }}
      artifact-retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}
      artifact-compression:    ${{ needs.resolve-config.outputs.artifact-compression }}
      build-method:            ${{ needs.resolve-config.outputs.build-method }}
      runner-windows-label:    ${{ needs.resolve-config.outputs.runner-windows-label }}
      runner-macos-label:      ${{ needs.resolve-config.outputs.runner-macos-label }}
      runner-linux-label:      ${{ needs.resolve-config.outputs.runner-linux-label }}
    secrets:
      UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 03 — BUILD ARTIFACTS  (one matrix job, not one job per platform)
  # ════════════════════════════════════════════════════════════════════════════
  # This was six near-identical jobs, each gated by `if:`. GitHub renders an
  # `if:`-false job as a SKIPPED NODE, so an Android-only run drew WebGL, iOS,
  # Linux64, LinuxServer and Windows64 greyed out next to it — the graph
  # advertised five platforms nobody had asked for, and adding a sixth meant
  # copying a 45-line block.
  #
  # The matrix comes from stage 01, so the graph contains exactly the platforms
  # that were selected. `fail-fast: false` keeps the platforms independent: a
  # failed iOS leg must not cancel a running Android leg.
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: 03 / ${{ matrix.platform }}
    needs: [resolve-config, quality-gate, build-addressables]
    if: >-
      !cancelled() &&
      needs.quality-gate.outputs.passed == 'true' &&
      (needs.build-addressables.result == 'success' || needs.build-addressables.result == 'skipped') &&
      needs.resolve-config.outputs.has-builds == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-config.outputs.build-matrix) }}
    uses: ./.github/workflows/reusable-build-platform.yml
    with:
      platform:            ${{ matrix.platform }}
      node-label:          ${{ matrix.node }}
      artifact-type:       ${{ matrix.artifact-type }}
      configuration:       ${{ needs.resolve-config.outputs.configuration }}
      app-version:         ${{ needs.resolve-config.outputs.app-version }}
      toolkit-repo:        ${{ inputs.toolkit-repo }}
      unity-version:       ${{ needs.resolve-config.outputs.unity-version }}
      project-path:        ${{ needs.resolve-config.outputs.project-path }}
      environment:         ${{ needs.resolve-config.outputs.environment }}
      runner-mode:         ${{ inputs.runner-mode || needs.resolve-config.outputs.runner-mode }}
      runner-labels:       ${{ needs.resolve-config.outputs.runner-labels }}
      build-engine:        ${{ needs.resolve-config.outputs.build-engine }}
      activation-strategy: ${{ needs.resolve-config.outputs.activation-strategy }}
      clean-build:         ${{ fromJSON(needs.resolve-config.outputs.clean-build) }}
      build-addressables:  false
      android-export-type: ${{ needs.resolve-config.outputs.android-export-type }}
      toolkit-ref:         ${{ needs.resolve-config.outputs.toolkit-ref }}
      submodule-auth:      ${{ inputs.submodule-auth || 'token' }}
      define-symbols:      ${{ needs.resolve-config.outputs.define-symbols }}
      build-timeout-minutes:   ${{ fromJSON(needs.resolve-config.outputs.build-timeout-minutes) }}
      cache-library:           ${{ fromJSON(needs.resolve-config.outputs.cache-library) }}
      cache-gradle:            ${{ fromJSON(needs.resolve-config.outputs.cache-gradle) }}
      cache-addressables:      ${{ fromJSON(needs.resolve-config.outputs.cache-addressables) }}
      cache-nuget:             ${{ fromJSON(needs.resolve-config.outputs.cache-nuget) }}
      artifact-retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}
      artifact-compression:    ${{ needs.resolve-config.outputs.artifact-compression }}
      build-method:            ${{ needs.resolve-config.outputs.build-method }}
      runner-windows-label:    ${{ needs.resolve-config.outputs.runner-windows-label }}
      runner-macos-label:      ${{ needs.resolve-config.outputs.runner-macos-label }}
      runner-linux-label:      ${{ needs.resolve-config.outputs.runner-linux-label }}
    secrets:
      UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 04 — ARTIFACT VALIDATION  (one matrix job, not one job per platform)
  # ════════════════════════════════════════════════════════════════════════════
  # "The build exited 0" and "the artifact is shippable" are different claims.
  # Unity happily writes a 4 KB APK with no dex, a WebGL folder with a plain
  # loader next to a brotli wasm, or an Xcode export missing Libraries/ — all
  # exit 0, all fail hours later in a store upload or a blank browser canvas.
  #
  # The matrix carries only platforms that HAVE a validator, so Linux and
  # Windows contribute no node rather than a permanently skipped one.
  #
  # `needs: [build]` is the whole build matrix, which means a failed iOS leg
  # delays Android's validation until the matrix settles. That is a GitHub
  # limitation — a matrix job cannot be depended on leg-by-leg. It costs
  # ordering, never correctness: each leg downloads its own stored artifact and
  # re-running one validation rebuilds nothing.
  #
  # A plain job, not a workflow_call: caller → unity-pipeline →
  # reusable-build-platform already spends 3 of GitHub's 4 nesting levels.
  # ════════════════════════════════════════════════════════════════════════════
  validate-artifact:
    name: 04 / ${{ matrix.platform }} / Validate
    needs: [resolve-config, build]
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.resolve-config.outputs.has-validations == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-config.outputs.validate-matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ needs.resolve-config.outputs.toolkit-ref }}
          path: .toolkit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: unity-build-${{ matrix.platform }}
          path: build-artifact/

      # The manifest is its own artifact because the build output directory is
      # owned by the Unity container on the docker lane and is not writable by
      # the runner. Landing it alongside the binary here is what lets the
      # validators fall back to the shipped identity when no Android SDK is
      # available to read the artifact directly.
      - name: Download artifact manifest
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: build-manifest-${{ matrix.platform }}
          path: build-artifact/

      - name: Validate artifact
        id: validate
        shell: bash
        env:
          VALIDATOR:     ${{ matrix.validator }}
          ARTIFACT_TYPE: ${{ matrix.artifact-type }}
          ENVIRONMENT:   ${{ needs.resolve-config.outputs.environment }}
        run: |
          set -Eeuo pipefail
          case "${VALIDATOR}" in
            android)
              ARGS=(--search-root build-artifact --expected-type "${ARTIFACT_TYPE}"
                    --report validation-${VALIDATOR}.json)
              # A production artifact that is not signed cannot ship, so the
              # check is a gate there and a warning everywhere else.
              [ "${ENVIRONMENT}" = "production" ] && ARGS+=(--require-signed)
              python3 .toolkit/scripts/android/validate_android_artifact.py "${ARGS[@]}"
              ;;
            webgl)
              python3 .toolkit/scripts/webgl/validate_webgl_artifact.py \
                --search-root build-artifact --report validation-${VALIDATOR}.json
              ;;
            ios)
              python3 .toolkit/scripts/ios/validate_xcode_project.py \
                --search-root build-artifact --report validation-${VALIDATOR}.json
              ;;
            *)
              echo "::error::No validator registered for '${VALIDATOR}'"
              exit 1
              ;;
          esac

      - name: Record platform result
        if: always()
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          OUTCOME:  ${{ steps.validate.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p pipeline-results
          printf '{"platform":"%s","stage":"04","result":"%s"}\n' \
            "${PLATFORM}" "${OUTCOME}" > "pipeline-results/validate-${PLATFORM}.json"

      # Matrix legs are not addressable from `needs`, so each leg writes its own
      # result file and stage 07 aggregates them. This is what lets the report
      # say "iOS failed at stage 04" instead of "the pipeline failed".
      - name: Upload platform result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-result-validate-${{ matrix.platform }}
          path: pipeline-results/
          retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}

      - name: Upload validation report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ matrix.platform }}
          path: validation-${{ matrix.validator }}.json
          if-no-files-found: ignore
          retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 07 — FINAL REPORT
  # ════════════════════════════════════════════════════════════════════════════
  # Stages 03 and 04 are matrix jobs, and GitHub does not expose a matrix leg's
  # result through `needs` — `needs.build.result` is one aggregate for the whole
  # matrix. Each leg therefore writes a small JSON result file and uploads it as
  # `pipeline-result-*`; this job collects them.
  #
  # That indirection buys something the old fixed table could not do: the report
  # covers whichever platforms actually ran, so adding a platform needs no change
  # here, and it carries real per-platform artifact type, size and duration
  # rather than a hardcoded artifact name.
  # ════════════════════════════════════════════════════════════════════════════
  final-report:
    name: 07 / Final Report
    needs:
      - resolve-config
      - validate-project
      - validate-license
      - unity-tests
      - quality-gate
      - build-addressables
      - build
      - validate-artifact
    if: always()
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-config.outputs.gh-environment }}
    outputs:
      overall: ${{ steps.report.outputs.overall }}
      failed-stage: ${{ steps.report.outputs.failed-stage }}
      platform-summary: ${{ steps.report.outputs.platform-summary }}
    steps:
      - name: Collect platform results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: pipeline-result-*
          path: pipeline-results
          merge-multiple: true

      - name: Write step summary
        id: report
        shell: bash
        env:
          RUN_ID:        ${{ github.run_id }}
          RUN_URL:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT:        ${{ github.sha }}
          EVENT_NAME:    ${{ github.event_name }}
          REF_NAME:      ${{ github.ref_name }}
          BASE_REF:      ${{ github.base_ref }}
          UNITY_VERSION: ${{ needs.resolve-config.outputs.unity-version }}
          FLOW_TYPE:     ${{ needs.resolve-config.outputs.flow-type }}
          ENVIRONMENT:   ${{ needs.resolve-config.outputs.environment }}
          CONFIGURATION: ${{ needs.resolve-config.outputs.configuration }}
          APP_VERSION:   ${{ needs.resolve-config.outputs.app-version }}
          BUILD_NUMBER:  ${{ github.run_number }}
          SIGNING:       ${{ needs.resolve-config.outputs.signing }}
          TEST_MODE:     ${{ needs.resolve-config.outputs.test-mode }}
          BUILD_MATRIX:  ${{ needs.resolve-config.outputs.build-matrix }}
          R_RESOLVE:     ${{ needs.resolve-config.result }}
          R_VALIDATE:    ${{ needs.validate-project.result }}
          R_LICENSE:     ${{ needs.validate-license.result }}
          R_TESTS:       ${{ needs.unity-tests.result }}
          R_GATE:        ${{ needs.quality-gate.result }}
          GATE_BLOCKER:  ${{ needs.quality-gate.outputs.blocking-stage }}
          R_ADDR:        ${{ needs.build-addressables.result }}
          R_BUILD:       ${{ needs.build.result }}
          R_VALIDATION:  ${{ needs.validate-artifact.result }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys

          env = os.environ
          results_dir = pathlib.Path("pipeline-results")

          # ── Collect what the matrix legs reported ────────────────────────
          builds, validations = {}, {}
          for path in sorted(results_dir.rglob("*.json")) if results_dir.is_dir() else []:
              try:
                  row = json.loads(path.read_text())
              except (OSError, json.JSONDecodeError):
                  continue
              target = builds if row.get("stage") == "03" else validations
              target[row.get("platform", "?")] = row

          # Platforms the pipeline INTENDED to build. One present here but absent
          # from `builds` did not report its result.
          #
          # Whether that is a failure depends on the matrix's own verdict. If
          # the build matrix succeeded, a missing file is a REPORTING gap and
          # must not fail an otherwise green run — that exact bug failed
          # NDCUnityTemplate run 34567145749, where Android and WebGL both
          # built and validated and only the report went red. If the matrix did
          # not succeed, a missing file means that leg died, and it counts.
          try:
              planned = [r["platform"] for r in json.loads(env.get("BUILD_MATRIX") or "[]")]
          except json.JSONDecodeError:
              planned = []
          matrix_result = env.get("R_BUILD", "")
          unreported = "unreported" if matrix_result == "success" else ""
          for platform in planned:
              builds.setdefault(platform, {"platform": platform, "stage": "03",
                                           "result": unreported, "artifactType": "",
                                           "artifactSizeBytes": "0", "durationSeconds": "0"})

          EMOJI = {"success": "✅", "failure": "❌", "skipped": "⏭️",
                   "cancelled": "🚫", "blocked": "⛔", "unreported": "➖"}
          def emoji(result):
              return EMOJI.get(result, "❓")

          def mib(value):
              try:
                  n = int(value)
              except (TypeError, ValueError):
                  return "—"
              return f"{n / 1048576:.1f} MB" if n else "—"

          def dur(value):
              try:
                  n = int(value)
              except (TypeError, ValueError):
                  return "—"
              return f"{n // 60}m {n % 60}s" if n else "—"

          def passed(result):
              # "unreported" = the leg's result file is missing but the matrix
              # succeeded. Surfaced in the table, never fatal.
              return result in ("success", "skipped", "unreported")

          # ── Overall verdict + the stage that broke it ────────────────────
          failed_stage = ""
          ordered = [
              # First, because everything else is skipped when it fails and
              # `skipped` counts as a pass.
              ("01 PREPARE / Resolve Build Config",   env.get("R_RESOLVE", "")),
              ("01 PREPARE / Validate Unity Project", env.get("R_VALIDATE", "")),
              ("01 PREPARE / Validate Unity License", env.get("R_LICENSE", "")),
              ("02 QUALITY GATE / Unity Tests",       env.get("R_TESTS", "")),
              ("02 QUALITY GATE",                     env.get("R_GATE", "")),
              ("03 BUILD ARTIFACTS / Addressables",   env.get("R_ADDR", "")),
          ]
          for label, result in ordered:
              if not passed(result) and not failed_stage:
                  failed_stage = f"{label} ({result or 'no result'})"
          if not failed_stage and env.get("GATE_BLOCKER"):
              failed_stage = f"02 QUALITY GATE / {env['GATE_BLOCKER']}"
          for platform, row in sorted(builds.items()):
              if not passed(row.get("result", "")) and not failed_stage:
                  failed_stage = f"03 BUILD ARTIFACTS / {platform} ({row.get('result') or 'no result'})"
          for platform, row in sorted(validations.items()):
              if not passed(row.get("result", "")) and not failed_stage:
                  failed_stage = f"04 ARTIFACT VALIDATION / {platform} ({row.get('result') or 'no result'})"

          overall = "failure" if failed_stage else "success"

          # ── Step summary ─────────────────────────────────────────────────
          out = []
          w = out.append
          w("## Unity Build — Final Report")
          w("")
          w(f"**{emoji(overall)} {overall.upper()}**"
            + (f" — failed at **{failed_stage}**" if failed_stage else ""))
          w("")
          w("| Field | Value |")
          w("|---|---|")
          w(f"| Environment | `{env.get('ENVIRONMENT') or 'unknown'}` "
            f"({env.get('CONFIGURATION') or '—'}) |")
          w(f"| Version | `{env.get('APP_VERSION') or 'unknown'}` |")
          w(f"| Build number | `{env.get('BUILD_NUMBER')}` |")
          w(f"| Commit | `{(env.get('COMMIT') or '')[:8]}` |")
          w(f"| Branch | `{env.get('REF_NAME')}` |")
          w(f"| Flow | `{env.get('FLOW_TYPE') or 'unknown'}` |")
          w(f"| Unity | `{env.get('UNITY_VERSION') or 'unknown'}` |")
          w(f"| Signing | `{env.get('SIGNING') or 'none'}` |")
          w(f"| Run | [{env.get('RUN_ID')}]({env.get('RUN_URL')}) |")
          w("")
          w("### 01–02 — Prepare & Quality Gate")
          w("| Node | Result |")
          w("|---|---|")
          for label, key in (("01 / Resolve Build Config", "R_RESOLVE"),
                             ("01 / Validate Unity Project", "R_VALIDATE"),
                             ("01 / Validate Unity License", "R_LICENSE"),
                             (f"02 / Unity Tests ({env.get('TEST_MODE') or 'N/A'})", "R_TESTS"),
                             ("02 / Quality Gate", "R_GATE")):
              result = env.get(key, "")
              w(f"| {label} | {emoji(result)} `{result or 'no result'}` |")
          if env.get("GATE_BLOCKER"):
              w("")
              w(f"> ⛔ Gate closed at **{env['GATE_BLOCKER']}** — no platform build was started.")
          w("")
          w("### 03 — Build Artifacts")
          if builds:
              w("| Platform | Result | Type | Size | Duration | Artifact |")
              w("|---|---|---|---|---|---|")
              addr = env.get("R_ADDR", "")
              w(f"| Addressables | {emoji(addr)} `{addr or 'no result'}` | — | — | — | "
                "`unity-build-Addressables` |")
              for platform, row in sorted(builds.items()):
                  result = row.get("result", "")
                  w(f"| {platform} | {emoji(result)} `{result or 'no result'}` | "
                    f"`{row.get('artifactType') or '—'}` | {mib(row.get('artifactSizeBytes'))} | "
                    f"{dur(row.get('durationSeconds'))} | `{row.get('artifactName') or '—'}` |")
          else:
              w("_No platform build ran._")
          w("")
          w("### 04 — Artifact Validation")
          if validations:
              w("| Platform | Result | Report |")
              w("|---|---|---|")
              for platform, row in sorted(validations.items()):
                  result = row.get("result", "")
                  w(f"| {platform} | {emoji(result)} `{result or 'no result'}` | "
                    f"`validation-report-{platform}` |")
          else:
              w("_No artifact validation ran._")
          w("")
          w("> Logs: `unity-build-<Platform>-logs`. Manifests: `build-manifest-<Platform>`.")
          w("> Publishing is a separate pipeline — see `pipeline-android-release.yml`, "
            "`pipeline-ios-release.yml`, `pipeline-webgl-release.yml`.")

          summary = "\n".join(out)
          with open(env["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(summary + "\n")

          # ── Outputs for the Discord stage ────────────────────────────────
          compact = [
              {"platform": p,
               "build": builds[p].get("result", ""),
               "validation": validations.get(p, {}).get("result", ""),
               "artifactType": builds[p].get("artifactType", ""),
               "artifactSizeBytes": builds[p].get("artifactSizeBytes", "0")}
              for p in sorted(builds)
          ]
          with open(env["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"overall={overall}\n")
              fh.write(f"failed-stage={failed_stage}\n")
              fh.write("platform-summary=" + json.dumps(compact) + "\n")

          if failed_stage:
              print(f"::error::Pipeline failed at {failed_stage}. See the matching job logs.")
              sys.exit(1)
          PY

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 12: notify-discord
  # ════════════════════════════════════════════════════════════════════════════
  notify-discord:
    name: 08 / Notify Discord
    needs:
      - resolve-config
      - validate-project
      - unity-tests
      - build-addressables
      - build
      - quality-gate
      - validate-artifact
      - final-report
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: unity-build-*
          path: ./artifacts

      - name: Derive overall status
        id: status
        shell: bash
        env:
          R_VALIDATE:    ${{ needs.validate-project.result }}
          R_TESTS:       ${{ needs.unity-tests.result }}
          R_ADDR:        ${{ needs.build-addressables.result }}
          R_BUILD:       ${{ needs.build.result }}
          PLATFORM_SUMMARY: ${{ needs.final-report.outputs.platform-summary }}
          R_GATE:        ${{ needs.quality-gate.result }}
          GATE_BLOCKER:  ${{ needs.quality-gate.outputs.blocking-stage }}
          V_ALL:         ${{ needs.validate-artifact.result }}
          REPORT_OVERALL: ${{ needs.final-report.outputs.overall }}
          REPORT_FAILED_STAGE: ${{ needs.final-report.outputs.failed-stage }}
        run: |
          set -Eeuo pipefail
          # Stage 07 already collected every matrix leg's result and decided the
          # verdict; re-deriving it here from `needs` is impossible anyway,
          # because a matrix job reports one aggregate result for all legs.
          # This step only unpacks that summary into the per-platform inputs the
          # Discord action takes.
          python3 - <<'PY'
          import json, os

          env = os.environ
          try:
              summary = json.loads(env.get("PLATFORM_SUMMARY") or "[]")
          except json.JSONDecodeError:
              summary = []

          by_platform = {row.get("platform", ""): row for row in summary}

          # `ok` exists to detect a PARTIAL build — some platforms up, some down.
          # A passing test run is not a platform that built, so tests/validate/
          # Addressables count toward `fail` but never toward `ok`.
          fail = ok = False
          cancelled = env.get("R_BUILD") == "cancelled" or env.get("V_ALL") == "cancelled"
          for key in ("R_VALIDATE", "R_TESTS", "R_ADDR"):
              value = env.get(key, "")
              if value == "cancelled":
                  cancelled = True
              elif value == "failure":
                  fail = True

          lines = []
          for platform, row in by_platform.items():
              build = row.get("build", "")
              validation = row.get("validation", "")
              if build == "cancelled" or validation == "cancelled":
                  cancelled = True
              if build == "failure" or validation == "failure":
                  fail = True
              if build == "success":
                  ok = True
              lines.append(f"result-{platform.lower()}={build or 'skipped'}")
              if validation:
                  lines.append(f"validation-{platform.lower()}={validation}")

          if cancelled:
              overall = "cancelled"
          elif fail and ok:
              overall = "partial"
          elif fail:
              overall = "failure"
          else:
              # Trust stage 07 when it saw something this step cannot.
              overall = "failure" if env.get("REPORT_OVERALL") == "failure" else "success"

          with open(env["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"overall={overall}\n")
              for line in lines:
                  fh.write(line + "\n")

          print(f"Overall Discord status: {overall}")
          if env.get("REPORT_FAILED_STAGE"):
              print(f"Failed at: {env['REPORT_FAILED_STAGE']}")
          PY

      # A local (./) composite action resolves from the runner workspace, which
      # for a reusable workflow is the CALLER's repo — not this toolkit. So we
      # check the toolkit out and reference the action from there.
      - name: Checkout toolkit (for the Discord action)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Gather run context (commit message, author, duration)
        id: ctx
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BUILD_DURATION=""

          # ── Commit message (first line) ───────────────────────────────────
          COMMIT_MSG=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" \
            -q '.commit.message' 2>/dev/null | head -1) || true
          echo "commit-message=${COMMIT_MSG}" >> "$GITHUB_OUTPUT"

          # ── Commit author ─────────────────────────────────────────────────
          COMMIT_AUTHOR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" \
            -q '.commit.author.name' 2>/dev/null) || true
          echo "commit-author=${COMMIT_AUTHOR}" >> "$GITHUB_OUTPUT"

          # ── Build duration ────────────────────────────────────────────────
          START=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -q '.run_started_at' 2>/dev/null) || true
          if [ -n "${START}" ]; then
            START_EPOCH=$(date -u -d "${START}" +%s 2>/dev/null) || true
            if [ -n "${START_EPOCH}" ] && [ "${START_EPOCH}" -gt 0 ] 2>/dev/null; then
              NOW=$(date -u +%s)
              ELAPSED=$(( NOW - START_EPOCH ))
              if [ "${ELAPSED}" -ge 60 ]; then
                BUILD_DURATION="$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s"
              else
                BUILD_DURATION="${ELAPSED}s"
              fi
            fi
          fi
          echo "build-duration=${BUILD_DURATION}" >> "$GITHUB_OUTPUT"

      - name: Gather per-platform error/warning counts + log artifact ids
        id: diag
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          DIAG=""
          TOTAL_ERRORS=0
          TOTAL_WARNINGS=0

          # ── Build name→id map from artifacts API ──────────────────────────
          ARTIFACT_MAP=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            -q '.artifacts[]|"\(.name) \(.id)"' 2>/dev/null) || true

          # ── Per-platform scan ─────────────────────────────────────────────
          for P in Android WebGL Linux64 LinuxServer Windows64 iOS; do
            LOG=$(find ./artifacts -path "*unity-build-${P}-logs*Editor.log" \
              -print 2>/dev/null | head -1) || true

            # Skip platforms with no log file — nothing to report
            [ -z "${LOG}" ] && continue

            errors=$(grep -cE '\): error |Aborting batchmode|BuildFailedException' \
              "${LOG}" 2>/dev/null) || errors=0
            warnings=$(grep -cE '\): warning ' \
              "${LOG}" 2>/dev/null) || warnings=0

            # Look up the logs artifact id from the map
            logsid=$(printf '%s\n' "${ARTIFACT_MAP}" \
              | grep "^unity-build-${P}-logs " \
              | awk '{print $2}' | head -1) || logsid=""

            binid=$(printf '%s\n' "${ARTIFACT_MAP}" \
              | grep "^unity-build-${P} " \
              | awk '{print $2}' | head -1) || binid=""

            DIAG="${DIAG}${P}=${errors},${warnings},${logsid},${binid}"$'\n'
            TOTAL_ERRORS=$(( TOTAL_ERRORS + errors ))
            TOTAL_WARNINGS=$(( TOTAL_WARNINGS + warnings ))
          done

          # ── Emit outputs ──────────────────────────────────────────────────
          {
            echo "platform-diagnostics<<EOF"
            printf '%s' "${DIAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "total-errors=${TOTAL_ERRORS}"   >> "$GITHUB_OUTPUT"
          echo "total-warnings=${TOTAL_WARNINGS}" >> "$GITHUB_OUTPUT"

      - name: Post build to Discord thread
        uses: ./.toolkit/.github/actions/discord-upload-build
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          status:              ${{ steps.status.outputs.overall }}
          flow-type:           ${{ needs.resolve-config.outputs.flow-type }}
          environment:         ${{ needs.resolve-config.outputs.environment }}
          run-url:             ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit-sha:          ${{ github.sha }}
          branch:              ${{ github.ref_name }}
          unity-version:       ${{ needs.resolve-config.outputs.unity-version }}
          # Per-platform results come from the matrix legs via stage 07, since a
          # matrix job's legs are not addressable through `needs`.
          result-android:      ${{ steps.status.outputs.result-android }}
          result-webgl:        ${{ steps.status.outputs.result-webgl }}
          result-linux64:      ${{ steps.status.outputs.result-linux64 }}
          result-linuxserver:  ${{ steps.status.outputs.result-linuxserver }}
          result-windows64:    ${{ steps.status.outputs.result-windows64 }}
          result-ios:          ${{ steps.status.outputs.result-ios }}
          result-addressables: ${{ needs.build-addressables.result }}
          result-tests:        ${{ needs.unity-tests.result }}
          result-validation-android: ${{ steps.status.outputs.validation-android }}
          result-validation-webgl:   ${{ steps.status.outputs.validation-webgl }}
          result-validation-ios:     ${{ steps.status.outputs.validation-ios }}
          failed-stage:        ${{ needs.final-report.outputs.failed-stage }}
          configuration:       ${{ needs.resolve-config.outputs.configuration }}
          thread-id:           ${{ vars.DISCORD_THREAD_ID }}
          artifact-dir:        ./artifacts
          attach-size-threshold-mb: '8'
          actor:               ${{ github.actor }}
          event:               ${{ github.event_name }}
          run-number:          ${{ github.run_number }}
          repository:          ${{ github.repository }}
          commit-message:      ${{ steps.ctx.outputs.commit-message }}
          commit-author:       ${{ steps.ctx.outputs.commit-author }}
          build-duration:      ${{ steps.ctx.outputs.build-duration }}
          platform-diagnostics: ${{ steps.diag.outputs.platform-diagnostics }}
          total-errors:        ${{ steps.diag.outputs.total-errors }}
          total-warnings:      ${{ steps.diag.outputs.total-warnings }}
          product-name:        ${{ needs.resolve-config.outputs.product-name }}
          app-version:         ${{ needs.resolve-config.outputs.app-version }}
          bundle-id:           ${{ needs.resolve-config.outputs.bundle-id }}
          scripting-backend:   ${{ needs.resolve-config.outputs.scripting-backend }}
          android-arch:        ${{ needs.resolve-config.outputs.android-arch }}
          orientation:         ${{ needs.resolve-config.outputs.orientation }}
          store-link:          ${{ needs.resolve-config.outputs.store-link }}
          android-export-type: ${{ needs.resolve-config.outputs.android-export-type }}
          define-symbols-count: ${{ needs.resolve-config.outputs.define-symbols-count }}
          define-symbols:      ${{ needs.resolve-config.outputs.define-symbols }}
