name: Unity Test iOS

# DEPRECATED — legacy entry point, kept working for existing callers. New
# projects call unity-pipeline.yml (build) and pipeline-*-release.yml
# (promotion); see docs/ARCHITECTURE.md § Legacy entry points. Planned for
# removal in the next major version.

# Runs Unity EditMode tests on a macOS runner for the iOS platform.
# Does NOT use distribution signing credentials.
# Optional: tests Xcode project generation when license is available.

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          Runner label(s) for the Unity job, comma-separated. Empty (default)
          uses the repository's runner policy when one exists, otherwise
          `macos-unity-xcode` as before. A value here wins over the policy.
        type: string
        required: false
        default: ''
      project-path:
        type: string
        required: false
        default: '.'
      unity-version:
        type: string
        required: true
      test-level:
        description: Tests to run (editmode, full). 'full' also attempts Xcode generation.
        type: string
        required: false
        default: editmode
      cache-mode:
        type: string
        required: false
        default: safe
      build-config-path:
        type: string
        required: false
        default: BuildConfig
      environment:
        type: string
        required: false
        default: development

    secrets:
      RUNNER_STATUS_TOKEN:
        description: >-
          Optional read-only token for runner availability (repository
          Administration: read, or organization Self-hosted runners: read).
          See docs/MULTI_RUNNER_SCHEDULING.md.
        required: false
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false

    outputs:
      tests-passed:
        description: Whether all tests passed
        value: ${{ jobs.test.outputs.tests-passed }}
      test-report-artifact:
        description: Name of the uploaded test results artifact
        value: ${{ jobs.test.outputs.test-report-artifact }}

jobs:
  # ── Runner selection (ADR 004 stage 2c) ──────────────────────────────────
  # Chooses the runner the Unity job below runs on, before that job exists:
  # runs-on cannot be decided from inside the job it schedules.
  #
  # This job runs on GitHub-hosted ubuntu-latest, and ONLY when a runner policy
  # is opted in through a repository/organization variable (RUNNER_POLICY or
  # RUNNER_POLICY_FILE) and no explicit runner label was passed. Otherwise it is
  # skipped and the Unity job below uses the explicit label, else
  # `macos-unity-xcode` -- exactly the routing this workflow had before runner
  # scheduling, with no extra GitHub-hosted job. When it runs,
  # runner_scheduler.py looks for an eligible, available self-hosted runner on
  # the standalone-native lane; if it cannot, it fails here with a report instead of
  # leaving the Unity job queued. See docs/MULTI_RUNNER_SCHEDULING.md.
  resolve-runner:
    name: Select runner
    if: ${{ (vars.RUNNER_POLICY != '' || vars.RUNNER_POLICY_FILE != '') && inputs.runner-label == '' }}
    runs-on: ubuntu-latest
    outputs:
      runs-on:         ${{ steps.select.outputs.runs-on }}
      selected-target: ${{ steps.select.outputs.selected-target }}
    steps:
      - name: Checkout runner policy and scheduler
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
            **/scripts/common/*.py
          sparse-checkout-cone-mode: false

      - name: Decide whether a runner policy applies
        id: need
        shell: bash
        env:
          RUNNER_POLICY:      ${{ vars.RUNNER_POLICY || '' }}
          RUNNER_POLICY_FILE: ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
          EXPLICIT_LABEL:     ${{ inputs.runner-label }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${EXPLICIT_LABEL}" ]] \
             && { [[ -n "${RUNNER_POLICY}" ]] || [[ -f "${RUNNER_POLICY_FILE}" ]]; }; then
            echo "scheduler=true" >> "$GITHUB_OUTPUT"
          else
            echo "scheduler=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select runner
        id: select
        shell: bash
        env:
          SCHEDULER:              ${{ steps.need.outputs.scheduler }}
          RS_JOBS:                iOS
          RS_LANE:                standalone-native
          RS_LEGACY_BUILD_ENGINE: local
          RS_LEGACY_ACTIVATION:   none
          RS_FALLBACK_LABELS:     macos-unity-xcode
          RS_EXPLICIT_LABELS:     ${{ inputs.runner-label }}
          RS_UNITY_VERSION:       ${{ inputs.unity-version }}
          RUNNER_POLICY:          ${{ vars.RUNNER_POLICY || '' }}
          RUNNER_POLICY_FILE:     ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
          # Read-only runner-status token; sent only as an Authorization header.
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ "${SCHEDULER}" != "true" ]]; then
            # No policy applies: the caller's explicit label, else the label this
            # workflow has always used. Nothing to schedule, nothing to fetch.
            if [[ -n "${RS_EXPLICIT_LABELS}" ]]; then
              labels="${RS_EXPLICIT_LABELS}"; why="explicit runner label input"
            else
              labels="${RS_FALLBACK_LABELS}"; why="no runner policy applies"
            fi
            labels="${labels//[\[\]\"]/}"
            json="["; sep=""
            for label in ${labels//,/ }; do json+="${sep}\"${label}\""; sep=","; done
            json+="]"
            echo "Runner selection: runs-on=${json} (${why})"
            echo "runs-on=${json}" >> "$GITHUB_OUTPUT"
            echo "selected-target=${labels}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This workflow runs the toolkit from the repository's own checkout
          # (as its executor check does), so the scheduler is looked up there.
          TOOLKIT="$(pwd)"
          if [[ ! -f "${TOOLKIT}/scripts/common/runner_scheduler.py" ]]; then
            echo "::error title=Runner scheduler missing::A runner policy is configured but scripts/common/runner_scheduler.py is not in this repository. Vendor the toolkit's scripts/common, pass an explicit runner label, or remove the policy."
            exit 1
          fi
          python3 "${TOOLKIT}/scripts/common/runner_scheduler.py"

  test:
    name: Test iOS (${{ inputs.test-level }})
    needs: [resolve-runner]
    # Skipped resolver (no policy opted in, or an explicit label) is the
    # normal case, not a failure.
    if: ${{ !cancelled() && (needs.resolve-runner.result == 'success' || needs.resolve-runner.result == 'skipped') }}
    runs-on: ${{ needs.resolve-runner.result == 'success' && fromJSON(needs.resolve-runner.outputs.runs-on) || inputs.runner-label || 'macos-unity-xcode' }}
    outputs:
      tests-passed: ${{ steps.check-results.outputs.tests-passed }}
      test-report-artifact: ${{ steps.set-artifact-name.outputs.artifact-name }}

    steps:
      # ── Guard: enforce macOS runner ───────────────────────────────────────────
      - name: Verify macOS runner
        shell: bash
        run: |
          if [[ "${{ runner.os }}" != "macOS" ]]; then
            echo "::error::Target \`iOS\` requires an approved macOS runner with Xcode and Unity iOS Build Support. Linux Docker execution is not supported."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # ── Platform executor validation ────────────────────────────────────────
      - name: Validate platform executor
        shell: bash
        env:
          RUNNER_OS_VAL: ${{ runner.os }}
        run: |
          if [[ -f "scripts/common/resolve_platform_executor.py" ]]; then
            python3 scripts/common/resolve_platform_executor.py \
              --target-platform iOS \
              --runner-os "${RUNNER_OS_VAL}"
          else
            echo "::notice::resolve_platform_executor.py not yet present — skipping"
          fi

      # ── Validate BuildConfig ─────────────────────────────────────────────────
      - name: Validate BuildConfig
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
          BUILD_CONFIG_PATH: ${{ inputs.build-config-path }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python3 scripts/common/validate_build_config.py \
            --config-path "${PROJECT_PATH}/${BUILD_CONFIG_PATH}" \
            --platform    iOS \
            --environment "${ENVIRONMENT}"

      # ── Resolve Unity installation ───────────────────────────────────────────
      - name: Resolve Unity installation
        id: unity-install
        shell: bash
        env:
          UNITY_VERSION: ${{ inputs.unity-version }}
        run: |
          UNITY_EDITOR="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          if [[ ! -f "${UNITY_EDITOR}" ]]; then
            echo "::error::Unity editor not found: ${UNITY_EDITOR}"
            exit 1
          fi
          echo "unity-editor=${UNITY_EDITOR}" >> "$GITHUB_OUTPUT"
          echo "[unity-install] ${UNITY_EDITOR} — OK"

      # ── Library cache ────────────────────────────────────────────────────────
      - name: Restore Library cache
        if: inputs.cache-mode != 'off'
        uses: actions/cache@v4
        with:
          path: ${{ inputs.project-path }}/Library
          key: macOS-unity-${{ inputs.unity-version }}-iOS-${{ hashFiles(format('{0}/Packages/manifest.json', inputs.project-path), format('{0}/Packages/packages-lock.json', inputs.project-path)) }}-cache-schema-v2
          restore-keys: |
            macOS-unity-${{ inputs.unity-version }}-iOS-

      # ── License activation ───────────────────────────────────────────────────
      - name: Activate Unity license
        shell: bash
        env:
          UNITY_EDITOR: ${{ steps.unity-install.outputs.unity-editor }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          LOG_PATH: Logs/iOS
        run: bash scripts/ios/run_unity_ios.sh activate

      # ── Run EditMode tests ───────────────────────────────────────────────────
      - name: Run EditMode tests
        id: test-editmode
        shell: bash
        env:
          UNITY_EDITOR: ${{ steps.unity-install.outputs.unity-editor }}
          PROJECT_PATH: ${{ inputs.project-path }}
          BUILD_CONFIG_PATH: ${{ inputs.build-config-path }}
          ENVIRONMENT: ${{ inputs.environment }}
          LOG_PATH: Logs/iOS
          TEST_RESULTS_PATH: TestResults/iOS
        run: bash scripts/ios/run_unity_ios.sh test-editmode

      # ── Optional: test Xcode generation ─────────────────────────────────────
      - name: Test Xcode project generation
        id: test-xcode-gen
        if: inputs.test-level == 'full'
        shell: bash
        env:
          UNITY_EDITOR: ${{ steps.unity-install.outputs.unity-editor }}
          PROJECT_PATH: ${{ inputs.project-path }}
          BUILD_CONFIG_PATH: ${{ inputs.build-config-path }}
          ENVIRONMENT: ${{ inputs.environment }}
          OUTPUT_PATH: Builds/iOS/Xcode
          LOG_PATH: Logs/iOS
        run: bash scripts/ios/run_unity_ios.sh test-xcode-gen

      # ── Check test results ───────────────────────────────────────────────────
      - name: Check test results
        id: check-results
        if: always()
        shell: bash
        env:
          EDITMODE_EXIT: ${{ steps.test-editmode.outputs.exit-code || '0' }}
        run: |
          PASSED="true"
          FAILURES=0

          for xml_file in TestResults/iOS/*.xml TestResults/**/*.xml; do
            [[ -f "${xml_file}" ]] || continue
            FILE_FAILS=$(python3 -c "import sys,xml.etree.ElementTree as ET; root=ET.parse(sys.argv[1]).getroot(); print(int(root.get('failures',0))+int(root.get('errors',0)))" "${xml_file}" 2>/dev/null || echo 0)
            FAILURES=$((FAILURES + FILE_FAILS))
          done

          [[ "${EDITMODE_EXIT}" != "0" ]] && FAILURES=$((FAILURES + 1))

          [[ "${FAILURES}" -gt 0 ]] && PASSED="false"

          printf 'tests-passed=%s\n' "${PASSED}" >> "$GITHUB_OUTPUT"
          echo "Test failures: ${FAILURES} | Passed: ${PASSED}"

      - name: Set artifact name
        id: set-artifact-name
        shell: bash
        run: |
          printf 'artifact-name=ios-test-results-%s-%s\n' \
            "${{ inputs.test-level }}" "${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # ── Upload test results ──────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact-name }}
          path: TestResults/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload iOS test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-logs-${{ inputs.test-level }}-${{ github.run_number }}
          path: Logs/iOS/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unity iOS Tests (${{ inputs.test-level }})
          path: TestResults/**/*.xml
          reporter: java-junit
          fail-on-error: false

      # ── Return Unity license ─────────────────────────────────────────────────
      - name: Return Unity license
        if: always()
        shell: bash
        env:
          UNITY_EDITOR: ${{ steps.unity-install.outputs.unity-editor }}
          LOG_PATH: Logs/iOS
        run: bash scripts/ios/run_unity_ios.sh return-license

      # ── Fail if tests failed ─────────────────────────────────────────────────
      - name: Fail if tests failed
        if: steps.check-results.outputs.tests-passed == 'false'
        shell: bash
        run: |
          echo "::error::One or more iOS Unity tests failed. See test report artifact for details."
          exit 1
