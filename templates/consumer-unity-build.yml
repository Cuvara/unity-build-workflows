# ──────────────────────────────────────────────────────────────────────────────
# consumer-unity-build.yml — Thin caller template for unity-build-workflows
#
# Copy this file to .github/workflows/unity-build.yml in your project.
# Pinned to @v2 (latest stable v2.x). Use @v2.2.5 for an exact pin, or @main
# for development. Keep `toolkit-ref` below on the SAME ref as `uses`.
#
# Required secrets (set in Settings → Secrets and variables → Actions):
#   UNITY_EMAIL      — Unity account email
#   UNITY_PASSWORD   — Unity account password
#   UNITY_LICENSE    — (optional but recommended) raw .ulf file contents
#
# Optional secrets:
#   DISCORD_WEBHOOK_URL    — Discord channel webhook for build notifications
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASS       — Android release signing (production only)
#
# Building on your own machine instead of GitHub-hosted runners: leave the
# runner inputs blank here and set the RUNNER_TYPE / BUILD_ENGINE /
# RUNNER_LABELS variables, or pass them per run. The self-hosted lane requires
# a PlayerBuilder.Build method in the project — see docs/SELF_HOSTED_ORG_RUNNER.md.
#
# See docs/CONSUMER_SETUP.md for the full onboarding walkthrough.
# ──────────────────────────────────────────────────────────────────────────────

name: Unity Build

# Manual builds live in the per-platform entry workflows, NOT here:
#
#   Build Android  → build-android.yml   (exposes the APK/AAB choice)
#   Build iOS      → build-ios.yml       (exposes the macOS runner labels)
#   Build WebGL    → build-webgl.yml
#   Build All      → build-all.yml       (platforms from *_BUILD_PLATFORMS)
#
# This file is the AUTOMATIC lane only: push and pull_request. Platform set,
# environment, tests and Addressables are resolved per branch by
# resolve_build_flow.sh from the repository variables, so there is nothing here
# for a human to fill in — which is why the workflow_dispatch form was removed.
# A 14-field form that showed Android's output format to somebody building iOS
# was the reason the entry points were split.

on:
  push:
    branches:
      - develop
      - staging
      - 'release-*'
    # A docs-only change does not need a Unity test run and two platform
    # builds. Safe here because this repository has no required status checks
    # — with one, a filtered-out workflow would leave a PR permanently
    # "waiting" for a check that can never report.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

  pull_request:
    branches:
      - develop
      - staging
      - 'release-*'
    # A docs-only change does not need a Unity test run and two platform
    # builds. Safe here because this repository has no required status checks
    # — with one, a filtered-out workflow would leave a PR permanently
    # "waiting" for a check that can never report.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# Cancel in-progress runs on the same branch when a new commit is pushed.
# workflow_dispatch runs are not cancelled (each manual trigger is intentional).
concurrency:
  # No lane in the key any more: this workflow only serves push/pull_request,
  # which carry no inputs, so every run of a given ref used the same 'auto'
  # placeholders. Manual lane overrides now live in the per-platform entry
  # workflows, each with its own concurrency group.
  group: unity-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Unity Pipeline
    # Pin the toolkit version. Recommended:
    #   @v2          — latest stable v2.x (gets backward-compatible fixes)   ← production default
    #   @v2.2.5      — exact release (fully reproducible)
    #   @main        — bleeding edge (development only; may break)
    uses: Cuvara/unity-build-workflows/.github/workflows/unity-pipeline.yml@v2
    secrets: inherit
    with:
      # Everything else is resolved per branch by resolve_build_flow.sh from the
      # repository variables — platform set, environment, tests, Addressables,
      # define symbols, runner lane and Android output format. Passing empty
      # overrides from a form that no longer exists would only mask that.
      project-path:        '.'
      toolkit-ref:         'main'
