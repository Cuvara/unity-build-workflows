name: Toolkit CI

# Validates the toolkit itself: Python test suite + shell syntax checks.
# Runs on push/PR to the main development branches and on demand.

on:
  push:
    branches: [main, develop, staging, 'release-*', 'feature/**']
  pull_request:
    branches: [main, develop, staging, 'release-*']
  workflow_dispatch:

concurrency:
  group: toolkit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run pytest
        run: |
          cd tests
          python -m pytest -q --junitxml=../pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 14

  shellcheck:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: bash -n on all shell scripts
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then echo "::error::syntax error in $f"; fail=1; fi
          done < <(find scripts docker -name '*.sh' -type f -print0 2>/dev/null)
          exit $fail

  # A workflow YAML that parses but is INVALID (an undeclared `inputs.x`, a
  # duplicated key, a missing required secret on a workflow_call) is accepted by
  # pytest's yaml.safe_load and rejected by GitHub at dispatch time — as a run
  # with no jobs, no logs and a bare "failure". That is unreadable, and it is
  # how a broken release pipeline stayed broken. actionlint catches it here.
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          set -Eeuo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Lint workflows
        # shellcheck/pyflakes are advisory here — `bash -n` is the shell gate and
        # runs in its own job. This job exists for the workflow-schema errors.
        run: ./actionlint -color -shellcheck= -pyflakes=

  ci-report:
    name: CI Report
    needs: [tests, shellcheck, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          {
            echo "## Toolkit CI"
            echo "- Tests:      ${{ needs.tests.result }}"
            echo "- Shellcheck: ${{ needs.shellcheck.result }}"
            echo "- Workflow lint: ${{ needs.actionlint.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.tests.result }}" = "success" ] \
            && [ "${{ needs.shellcheck.result }}" = "success" ] \
            && [ "${{ needs.actionlint.result }}" = "success" ]

  auto-merge:
    name: Auto-merge develop → main
    needs: [tests, shellcheck, actionlint]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    uses: ./.github/workflows/auto-merge.yml
    with:
      source-branch: develop
      target-branch: main
      require-build-success: false
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
