      runner-labels:       ${{ needs.resolve-config.outputs.runner-labels }}
      build-engine:        ${{ needs.resolve-config.outputs.build-engine }}
      activation-strategy: ${{ needs.resolve-config.outputs.activation-strategy }}
      clean-build:         ${{ fromJSON(needs.resolve-config.outputs.clean-build) }}
      build-addressables:  false
      toolkit-ref:         ${{ needs.resolve-config.outputs.toolkit-ref }}
      submodule-auth:      ${{ inputs.submodule-auth || 'token' }}
      define-symbols:      ${{ needs.resolve-config.outputs.define-symbols }}
      build-timeout-minutes:   ${{ fromJSON(needs.resolve-config.outputs.build-timeout-minutes) }}
      cache-library:           ${{ fromJSON(needs.resolve-config.outputs.cache-library) }}
      cache-gradle:            ${{ fromJSON(needs.resolve-config.outputs.cache-gradle) }}
      cache-addressables:      ${{ fromJSON(needs.resolve-config.outputs.cache-addressables) }}
      cache-nuget:             ${{ fromJSON(needs.resolve-config.outputs.cache-nuget) }}
      artifact-retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}
      artifact-compression:    ${{ needs.resolve-config.outputs.artifact-compression }}
      build-method:            ${{ needs.resolve-config.outputs.build-method }}
      runner-windows-label:    ${{ needs.resolve-config.outputs.runner-windows-label }}
      runner-macos-label:      ${{ needs.resolve-config.outputs.runner-macos-label }}
      runner-linux-label:      ${{ needs.resolve-config.outputs.runner-linux-label }}
    secrets:
      UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 10: build-ios
  #   Only triggered when flow resolver sets build-ios=true (manual dispatch only).
  #   runner-mode HARDCODED to self-hosted-macos. Reusable exits 0 with
  #   result=blocked if no macOS runner is registered.
  # ════════════════════════════════════════════════════════════════════════════
  build-ios:
    name: 03 / iOS
    needs: [resolve-config, quality-gate, build-addressables]
    if: >-
      !cancelled() &&
      needs.quality-gate.outputs.passed == 'true' &&
      (needs.build-addressables.result == 'success' || needs.build-addressables.result == 'skipped') &&
      needs.resolve-config.outputs.build-ios == 'true'
    uses: ./.github/workflows/reusable-build-platform.yml
    with:
      platform:            iOS
      node-label:          ${{ needs.resolve-config.outputs.label-ios }}
      configuration:       ${{ needs.resolve-config.outputs.configuration }}
      # Stage 03 emits the Unity-exported Xcode project. Archiving, signing and
      # the IPA belong to pipeline-ios-release.yml (stages 05/06).
      artifact-type:       XCODEPROJ
      app-version:         ${{ needs.resolve-config.outputs.app-version }}
      toolkit-repo:        ${{ inputs.toolkit-repo }}
      unity-version:       ${{ needs.resolve-config.outputs.unity-version }}
      project-path:        ${{ needs.resolve-config.outputs.project-path }}
      environment:         ${{ needs.resolve-config.outputs.environment }}
      runner-mode:         self-hosted-macos
      # iOS is always local macOS — literal labels (iOS never uses github-hosted/docker).
      runner-labels:       '["self-hosted","macOS"]'
      build-engine:        local
      activation-strategy: preactivated
      clean-build:         ${{ fromJSON(needs.resolve-config.outputs.clean-build) }}
      build-addressables:  false
      toolkit-ref:         ${{ needs.resolve-config.outputs.toolkit-ref }}
      submodule-auth:      ${{ inputs.submodule-auth || 'token' }}
      define-symbols:      ${{ needs.resolve-config.outputs.define-symbols }}
      build-timeout-minutes:   ${{ fromJSON(needs.resolve-config.outputs.build-timeout-minutes) }}
      cache-library:           ${{ fromJSON(needs.resolve-config.outputs.cache-library) }}
      cache-gradle:            ${{ fromJSON(needs.resolve-config.outputs.cache-gradle) }}
      cache-addressables:      ${{ fromJSON(needs.resolve-config.outputs.cache-addressables) }}
      cache-nuget:             ${{ fromJSON(needs.resolve-config.outputs.cache-nuget) }}
      artifact-retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}
      artifact-compression:    ${{ needs.resolve-config.outputs.artifact-compression }}
      build-method:            ${{ needs.resolve-config.outputs.build-method }}
      runner-windows-label:    ${{ needs.resolve-config.outputs.runner-windows-label }}
      runner-macos-label:      ${{ needs.resolve-config.outputs.runner-macos-label }}
      runner-linux-label:      ${{ needs.resolve-config.outputs.runner-linux-label }}
    secrets: inherit

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 04 — ARTIFACT VALIDATION
  # ════════════════════════════════════════════════════════════════════════════
  # "The build exited 0" and "the artifact is shippable" are different claims.
  # Unity happily writes a 4 KB APK with no dex, a WebGL folder with a plain
  # loader next to a brotli wasm, or an Xcode export missing Libraries/ — all
  # exit 0, all fail hours later in a store upload or a blank browser canvas.
  #
  # Each validation node depends on ONE build node, so a failed Android build
  # never marks the WebGL artifact unvalidated, and re-running a single failed
  # validation does not rebuild anything (it downloads the stored artifact).
  #
  # These are plain jobs, not workflow_call: caller → unity-pipeline →
  # reusable-build-platform already spends 3 of GitHub's 4 nesting levels.
  # ════════════════════════════════════════════════════════════════════════════

  # ── JOB 11: validate-artifact-android ──────────────────────────────────────
  validate-artifact-android:
    name: 04 / Android / Validate ${{ needs.resolve-config.outputs.android-artifact-type }}
    needs: [resolve-config, build-android]
    if: >-
      !cancelled() &&
      needs.build-android.result == 'success' &&
      needs.build-android.outputs.artifact-name != ''
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.validate.outcome }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ needs.resolve-config.outputs.toolkit-ref }}
          path: .toolkit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-android.outputs.artifact-name }}
          path: build-artifact/

      - name: Validate artifact
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/android/validate_android_artifact.py \
            --search-root   build-artifact \
            --expected-type "${{ needs.build-android.outputs.artifact-type }}" \
            --report        validation-android.json \
            ${{ needs.resolve-config.outputs.environment == 'production' && '--require-signed' || '' }}

      - name: Upload validation report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-Android
          path: validation-android.json
          if-no-files-found: ignore
          retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}

  # ── JOB 12: validate-artifact-webgl ────────────────────────────────────────
  validate-artifact-webgl:
    name: 04 / WebGL / Validate
    needs: [resolve-config, build-webgl]
    if: >-
      !cancelled() &&
      needs.build-webgl.result == 'success' &&
      needs.build-webgl.outputs.artifact-name != ''
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.validate.outcome }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ needs.resolve-config.outputs.toolkit-ref }}
          path: .toolkit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-webgl.outputs.artifact-name }}
          path: build-artifact/

      - name: Validate artifact
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/webgl/validate_webgl_artifact.py \
            --search-root build-artifact \
            --report      validation-webgl.json

      - name: Upload validation report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-WebGL
          path: validation-webgl.json
          if-no-files-found: ignore
          retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}

  # ── JOB 13: validate-artifact-ios ──────────────────────────────────────────
  # Stage 03 produced an Xcode project, so that is what is validated here. The
  # IPA is validated by pipeline-ios-release.yml, which is where it is created.
  validate-artifact-ios:
    name: 04 / iOS / Validate Xcode Project
    needs: [resolve-config, build-ios]
    if: >-
      !cancelled() &&
      needs.build-ios.result == 'success' &&
      needs.build-ios.outputs.artifact-name != ''
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.validate.outcome }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ needs.resolve-config.outputs.toolkit-ref }}
          path: .toolkit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-ios.outputs.artifact-name }}
          path: build-artifact/

      - name: Validate artifact
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/ios/validate_xcode_project.py \
            --search-root build-artifact \
            --report      validation-ios.json

      - name: Upload validation report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-iOS
          path: validation-ios.json
          if-no-files-found: ignore
          retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 14: final-report
  # ════════════════════════════════════════════════════════════════════════════
  final-report:
    name: 07 / Final Report
    needs:
      - resolve-config
      - validate-project
      - validate-license
      - unity-tests
      - quality-gate
      - build-addressables
      - build-android
      - build-webgl
      - build-linux64
      - build-linuxserver
      - build-windows64
      - build-ios
      - validate-artifact-android
      - validate-artifact-webgl
      - validate-artifact-ios
    if: always()
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-config.outputs.gh-environment }}
    steps:
      - name: Write step summary
        shell: bash
        env:
          # ── Run context ────────────────────────────────────────────────────
          RUN_ID:        ${{ github.run_id }}
          COMMIT:        ${{ github.sha }}
          EVENT_NAME:    ${{ github.event_name }}
          REF_NAME:      ${{ github.ref_name }}
          BASE_REF:      ${{ github.base_ref }}
          # ── Resolved config ────────────────────────────────────────────────
          UNITY_VERSION: ${{ needs.resolve-config.outputs.unity-version }}
          FLOW_TYPE:     ${{ needs.resolve-config.outputs.flow-type }}
          ENVIRONMENT:   ${{ needs.resolve-config.outputs.environment }}
          RUNNER_MODE:   ${{ inputs.runner-mode || 'docker' }}
          # ── Resolver platform flags (true/false) ───────────────────────────
          SEL_ANDROID:     ${{ needs.resolve-config.outputs.build-android }}
          SEL_WEBGL:       ${{ needs.resolve-config.outputs.build-webgl }}
          SEL_LINUX64:     ${{ needs.resolve-config.outputs.build-linux64 }}
          SEL_LINUXSERVER: ${{ needs.resolve-config.outputs.build-linuxserver }}
          SEL_WINDOWS64:   ${{ needs.resolve-config.outputs.build-windows64 }}
          SEL_IOS:         ${{ needs.resolve-config.outputs.build-ios }}
          SEL_ADDR:        ${{ needs.resolve-config.outputs.build-addressables }}
          SEL_TESTS:       ${{ needs.resolve-config.outputs.run-tests }}
          TEST_MODE:       ${{ needs.resolve-config.outputs.test-mode }}
          SIGNING:         ${{ needs.resolve-config.outputs.signing }}
          PLATFORM_SOURCE: ${{ needs.resolve-config.outputs.platform-source }}
          # ── Repository Variables (for report display) ─────────────────────
          VAR_DEV_PLAT: ${{ vars.DEVELOP_BUILD_PLATFORMS || '' }}
          VAR_STG_PLAT: ${{ vars.STAGING_BUILD_PLATFORMS || '' }}
          VAR_REL_PLAT: ${{ vars.RELEASE_BUILD_PLATFORMS || '' }}
          # ── Job results ────────────────────────────────────────────────────
          R_VALIDATE:    ${{ needs.validate-project.result }}
          R_LICENSE:     ${{ needs.validate-license.result }}
          R_TESTS:       ${{ needs.unity-tests.result }}
          R_GATE:        ${{ needs.quality-gate.result }}
          GATE_BLOCKER:  ${{ needs.quality-gate.outputs.blocking-stage }}
          R_ADDR:        ${{ needs.build-addressables.result }}
          R_ANDROID:     ${{ needs.build-android.result }}
          R_WEBGL:       ${{ needs.build-webgl.result }}
          R_LINUX64:     ${{ needs.build-linux64.result }}
          R_LINUXSERVER: ${{ needs.build-linuxserver.result }}
          R_WINDOWS64:   ${{ needs.build-windows64.result }}
          R_IOS:         ${{ needs.build-ios.result }}
          # ── Stage 04: artifact validation ──────────────────────────────────
          V_ANDROID:     ${{ needs.validate-artifact-android.result }}
          V_WEBGL:       ${{ needs.validate-artifact-webgl.result }}
          V_IOS:         ${{ needs.validate-artifact-ios.result }}
          # ── Stage 03: artifact identity ────────────────────────────────────
          CONFIGURATION: ${{ needs.resolve-config.outputs.configuration }}
          APP_VERSION:   ${{ needs.resolve-config.outputs.app-version }}
          A_ANDROID_TYPE: ${{ needs.build-android.outputs.artifact-type }}
          A_ANDROID_SIZE: ${{ needs.build-android.outputs.artifact-size-bytes }}
          A_ANDROID_SECS: ${{ needs.build-android.outputs.build-duration-seconds }}
          A_WEBGL_SIZE:   ${{ needs.build-webgl.outputs.artifact-size-bytes }}
          A_WEBGL_SECS:   ${{ needs.build-webgl.outputs.build-duration-seconds }}
          A_IOS_SIZE:     ${{ needs.build-ios.outputs.artifact-size-bytes }}
          A_IOS_SECS:     ${{ needs.build-ios.outputs.build-duration-seconds }}
          A_LINUX64_SECS: ${{ needs.build-linux64.outputs.build-duration-seconds }}
          A_LINUXSERVER_SECS: ${{ needs.build-linuxserver.outputs.build-duration-seconds }}
          A_WINDOWS64_SECS:   ${{ needs.build-windows64.outputs.build-duration-seconds }}
        run: |
          emoji() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              blocked)   echo "⛔" ;;
              *)         echo "❓" ;;
            esac
          }

          # Artifact sizes and durations come from stage-03 job outputs, which are
          # empty for a platform that never ran. Render an em dash rather than
          # "0 MB", which reads as a real measurement of an empty build.
          mib() {
            case "${1:-}" in
              ''|0) echo "—" ;;
              *) awk -v b="$1" 'BEGIN { printf "%.1f MB", b/1048576 }' ;;
            esac
          }
          dur() {
            case "${1:-}" in
              ''|0) echo "—" ;;
              *) echo "$(( $1 / 60 ))m $(( $1 % 60 ))s" ;;
            esac
          }

          SELECTED="" SKIPPED="" BLOCKERS=""
          for plat in Android WebGL Linux64 LinuxServer Windows64; do
            case "$plat" in
              Android)     flag="${SEL_ANDROID}" ;;
              WebGL)       flag="${SEL_WEBGL}" ;;
              Linux64)     flag="${SEL_LINUX64}" ;;
              LinuxServer) flag="${SEL_LINUXSERVER}" ;;
              Windows64)   flag="${SEL_WINDOWS64}" ;;
            esac
            if [ "${flag}" = "true" ]; then
              SELECTED="${SELECTED:+$SELECTED, }${plat}"
            else
              SKIPPED="${SKIPPED:+$SKIPPED, }${plat}"
            fi
          done
          if [ "${SEL_IOS}" = "true" ]; then
            SELECTED="${SELECTED:+$SELECTED, }iOS"
            BLOCKERS="iOS requires self-hosted macOS runner (result: ${R_IOS})"
          else
            SKIPPED="${SKIPPED:+$SKIPPED, }iOS (auto-excluded)"
          fi
          [ -z "${SELECTED}" ] && SELECTED="(none)"
          [ -z "${SKIPPED}"  ] && SKIPPED="(none)"
          [ -z "${BLOCKERS}" ] && BLOCKERS="(none)"

          TARGET_BRANCH="${BASE_REF:--}"

          {
            echo "## Unity Build — Final Report"
            echo ""
            echo "### Run Info"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Run ID | \`${RUN_ID}\` |"
            echo "| Commit | \`${COMMIT:0:8}\` |"
            echo "| Event | \`${EVENT_NAME}\` |"
            echo "| Branch | \`${REF_NAME}\` |"
            echo "| Target branch | \`${TARGET_BRANCH}\` |"
            echo "| Flow type | \`${FLOW_TYPE:-unknown}\` |"
            echo "| Unity version | \`${UNITY_VERSION:-unknown}\` |"
            echo "| Environment | \`${ENVIRONMENT:-unknown}\` |"
            echo "| Runner mode | \`${RUNNER_MODE}\` |"
            echo "| Signing | \`${SIGNING:-none}\` |"
            echo "| Platform source | \`${PLATFORM_SOURCE:-default}\` |"
            echo ""
            echo "### Platform Selection"
            echo "| | Platforms |"
            echo "|---|---|"
            echo "| Selected | ${SELECTED} |"
            echo "| Skipped  | ${SKIPPED} |"
            echo "| Blockers | ${BLOCKERS} |"
            echo ""
            if [ "${PLATFORM_SOURCE}" = "variable" ]; then
              echo "### Repository Variables"
              echo "| Variable | Value |"
              echo "|---|---|"
              [ -n "${VAR_DEV_PLAT}" ] && echo "| \`DEVELOP_BUILD_PLATFORMS\` | \`${VAR_DEV_PLAT}\` |"
              [ -n "${VAR_STG_PLAT}" ] && echo "| \`STAGING_BUILD_PLATFORMS\` | \`${VAR_STG_PLAT}\` |"
              [ -n "${VAR_REL_PLAT}" ] && echo "| \`RELEASE_BUILD_PLATFORMS\` | \`${VAR_REL_PLAT}\` |"
              echo ""
            fi
            echo ""
            echo "### Stage Results"
            echo ""
            echo "**01 — PREPARE**"
            echo "| Node | Result |"
            echo "|---|---|"
            echo "| 01 / Validate Unity Project | $(emoji "${R_VALIDATE}") \`${R_VALIDATE}\` |"
            echo "| 01 / Validate Unity License | $(emoji "${R_LICENSE}") \`${R_LICENSE}\` |"
            echo ""
            echo "**02 — QUALITY GATE** (test-mode: \`${TEST_MODE:-N/A}\`)"
            echo "| Node | Result | Artifact |"
            echo "|---|---|---|"
            echo "| 02 / Unity Tests | $(emoji "${R_TESTS}") \`${R_TESTS}\` | \`unity-tests-${TEST_MODE:-All}\` |"
            echo "| 02 / Quality Gate | $(emoji "${R_GATE}") \`${R_GATE}\` | — |"
            if [ -n "${GATE_BLOCKER}" ]; then
              echo ""
              echo "> ⛔ Quality gate closed at **${GATE_BLOCKER}** — no stage 03 build was started."
            fi
            echo ""
            echo "**03 — BUILD ARTIFACTS** (configuration: \`${CONFIGURATION:-unknown}\`, version: \`${APP_VERSION:-unknown}\`)"
            echo "| Node | Result | Type | Size | Duration | Artifact |"
            echo "|---|---|---|---|---|---|"
            echo "| 03 / Addressables | $(emoji "${R_ADDR}") \`${R_ADDR}\` | ADDRESSABLES | — | — | \`unity-build-Addressables\` |"
            echo "| 03 / Android / ${CONFIGURATION} / ${A_ANDROID_TYPE:-?} | $(emoji "${R_ANDROID}") \`${R_ANDROID}\` | \`${A_ANDROID_TYPE:-—}\` | $(mib "${A_ANDROID_SIZE}") | $(dur "${A_ANDROID_SECS}") | \`unity-build-Android\` |"
            echo "| 03 / WebGL / ${CONFIGURATION} | $(emoji "${R_WEBGL}") \`${R_WEBGL}\` | \`WEBGL\` | $(mib "${A_WEBGL_SIZE}") | $(dur "${A_WEBGL_SECS}") | \`unity-build-WebGL\` |"
            echo "| 03 / iOS / ${CONFIGURATION} | $(emoji "${R_IOS}") \`${R_IOS}\` | \`XCODEPROJ\` | $(mib "${A_IOS_SIZE}") | $(dur "${A_IOS_SECS}") | \`unity-build-iOS\` |"
            echo "| 03 / Linux64 / ${CONFIGURATION} | $(emoji "${R_LINUX64}") \`${R_LINUX64}\` | \`LINUX\` | — | $(dur "${A_LINUX64_SECS}") | \`unity-build-Linux64\` |"
            echo "| 03 / LinuxServer / ${CONFIGURATION} | $(emoji "${R_LINUXSERVER}") \`${R_LINUXSERVER}\` | \`LINUX\` | — | $(dur "${A_LINUXSERVER_SECS}") | \`unity-build-LinuxServer\` |"
            echo "| 03 / Windows64 / ${CONFIGURATION} | $(emoji "${R_WINDOWS64}") \`${R_WINDOWS64}\` | \`EXE\` | — | $(dur "${A_WINDOWS64_SECS}") | \`unity-build-Windows64\` |"
            echo ""
            echo "**04 — ARTIFACT VALIDATION**"
            echo "| Node | Result | Report |"
            echo "|---|---|---|"
            echo "| 04 / Android / Validate ${A_ANDROID_TYPE:-artifact} | $(emoji "${V_ANDROID}") \`${V_ANDROID}\` | \`validation-report-Android\` |"
            echo "| 04 / WebGL / Validate | $(emoji "${V_WEBGL}") \`${V_WEBGL}\` | \`validation-report-WebGL\` |"
            echo "| 04 / iOS / Validate Xcode Project | $(emoji "${V_IOS}") \`${V_IOS}\` | \`validation-report-iOS\` |"
            echo ""
            echo "> Log artifacts: \`unity-build-<Platform>-logs\`. Artifact manifests: \`build-manifest-<Platform>\`."
            echo "> Publishing is a separate pipeline — see \`pipeline-android-release.yml\` / \`pipeline-ios-release.yml\` / \`pipeline-webgl-release.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

          # Gate on EVERY result the table above prints, and treat anything that is
          # not a pass as a failure.
          #
          # Two defects this replaces, both of which let a red pipeline report green:
          #
          # 1. `[ "${result}" = "failure" ]` matched ONLY the literal string `failure`.
          #    A `cancelled` job — the shape a timeout produces — sailed through. That
          #    is not hypothetical: Cuvara/IndieRPGMMOAdventure collected three
          #    cancelled Unity Build runs on `staging` in a week, one of them a
          #    120-minute Addressables timeout that took every platform build down with
          #    it, and this gate called each of them a pass.
          #
          # 2. R_TESTS, R_ADDR and R_IOS were printed in the summary table but were
          #    absent from the loop. **Final Report went green when the tests failed.**
          #    On `develop` that was masked, because Unity Tests is separately a
          #    required check there. Nothing masks it on a branch where it is not.
          #
          # `skipped` stays a pass: platforms outside the environment's build list are
          # legitimately skipped, and so is Addressables when the env disables it.
          # Everything else — failure, cancelled, timed_out, or an empty/unknown value
          # from a job that never reported — fails, and is NAMED, because "one or more
          # build jobs failed" sent people to read seven job logs to find out which.
          FAILED=0
          FAILED_NAMES=""
          check_result() { # name value
            case "$2" in
              success|skipped) return 0 ;;
              *)
                FAILED=1
                FAILED_NAMES="${FAILED_NAMES} $1=${2:-<no result>}"
                ;;
            esac
          }
          # Named by STAGE / NODE so the error line alone says where the pipeline
          # broke — "01 / Validate Unity Project" instead of "validate".
          check_result "01/validate-project" "${R_VALIDATE}"
          check_result "01/validate-license" "${R_LICENSE}"
          check_result "02/unity-tests"      "${R_TESTS}"
          check_result "02/quality-gate"     "${R_GATE}"
          check_result "03/addressables"     "${R_ADDR}"
          check_result "03/android"          "${R_ANDROID}"
          check_result "03/webgl"            "${R_WEBGL}"
          check_result "03/linux64"          "${R_LINUX64}"
          check_result "03/linuxserver"      "${R_LINUXSERVER}"
          check_result "03/windows64"        "${R_WINDOWS64}"
          check_result "03/ios"              "${R_IOS}"
          # Stage 04 is a real gate: an artifact that fails validation must not
          # report the pipeline green, because stage 05 would publish it.
          check_result "04/android-validate" "${V_ANDROID}"
          check_result "04/webgl-validate"   "${V_WEBGL}"
          check_result "04/ios-validate"     "${V_IOS}"
          if [ "${FAILED}" -eq 1 ]; then
            echo "::error::Pipeline failed at:${FAILED_NAMES}. See the matching job logs."
            exit 1
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 12: notify-discord
  # ════════════════════════════════════════════════════════════════════════════
  notify-discord:
    name: 08 / Notify Discord
    needs:
      - resolve-config
      - validate-project
      - unity-tests
      - build-addressables
      - build-android
      - build-webgl
      - build-linux64
      - build-linuxserver
      - build-windows64
      - build-ios
      - quality-gate
      - validate-artifact-android
      - validate-artifact-webgl
      - validate-artifact-ios
      - final-report
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: unity-build-*
          path: ./artifacts

      - name: Derive overall status
        id: status
        shell: bash
        env:
          R_VALIDATE:    ${{ needs.validate-project.result }}
          R_TESTS:       ${{ needs.unity-tests.result }}
          R_ADDR:        ${{ needs.build-addressables.result }}
          R_ANDROID:     ${{ needs.build-android.result }}
          R_WEBGL:       ${{ needs.build-webgl.result }}
          R_LINUX64:     ${{ needs.build-linux64.result }}
          R_LINUXSERVER: ${{ needs.build-linuxserver.result }}
          R_WINDOWS64:   ${{ needs.build-windows64.result }}
          R_IOS:         ${{ needs.build-ios.result }}
          R_GATE:        ${{ needs.quality-gate.result }}
          GATE_BLOCKER:  ${{ needs.quality-gate.outputs.blocking-stage }}
          V_ANDROID:     ${{ needs.validate-artifact-android.result }}
          V_WEBGL:       ${{ needs.validate-artifact-webgl.result }}
          V_IOS:         ${{ needs.validate-artifact-ios.result }}
        run: |
          # R_TESTS, R_ADDR and R_IOS were missing from this job's env AND from both
          # loops below, so Discord announced a green pipeline when the tests had
          # failed. Unlike the Final Report gate this job already handled `cancelled`
          # correctly; the omitted results were its whole defect.
          #
          # Tests, validate and Addressables count toward `fail` but NOT toward `ok`:
          # `ok` exists to detect a PARTIAL platform build (some targets up, some
          # down), and a passing test run is not a platform that built.
          set +e
          overall=success
          for r in "$R_VALIDATE" "$R_TESTS" "$R_ADDR" "$R_ANDROID" "$R_WEBGL" "$R_LINUX64" "$R_LINUXSERVER" "$R_WINDOWS64" "$R_IOS"; do
            [ "$r" = "cancelled" ] && overall=cancelled
          done
          if [ "$overall" != "cancelled" ]; then
            fail=0; ok=0
            [ "$R_VALIDATE" = "failure" ] && fail=1
            [ "$R_TESTS" = "failure" ] && fail=1
            [ "$R_ADDR" = "failure" ] && fail=1
            for r in "$R_ANDROID" "$R_WEBGL" "$R_LINUX64" "$R_LINUXSERVER" "$R_WINDOWS64" "$R_IOS"; do
              [ "$r" = "failure" ] && fail=1
              [ "$r" = "success" ] && ok=1
            done
            # Stage 04: a platform that built but failed artifact validation is
            # a failure — publishing it is exactly what stage 04 exists to stop.
            for r in "$V_ANDROID" "$V_WEBGL" "$V_IOS"; do
              [ "$r" = "failure" ] && fail=1
            done
            if [ "$fail" = 1 ] && [ "$ok" = 1 ]; then overall=partial
            elif [ "$fail" = 1 ]; then overall=failure
            else overall=success; fi
          fi

          # ── Name the stage that stopped the pipeline ─────────────────────
          # First failure in stage order wins; the quality gate reports the
          # node it closed on rather than just "quality gate".
          FAILED_STAGE=""
          note() { [ -z "${FAILED_STAGE}" ] && FAILED_STAGE="$1"; }
          [ "$R_VALIDATE" = "failure" ] && note "01 PREPARE / Validate Unity Project"
          [ "$R_TESTS" = "failure" ]    && note "02 QUALITY GATE / Unity Tests"
          [ "$R_GATE" = "failure" ]     && note "02 QUALITY GATE${GATE_BLOCKER:+ / ${GATE_BLOCKER}}"
          [ "$R_ADDR" = "failure" ]     && note "03 BUILD ARTIFACTS / Addressables"
          for entry in "Android:$R_ANDROID" "WebGL:$R_WEBGL" "Linux64:$R_LINUX64" \
                       "LinuxServer:$R_LINUXSERVER" "Windows64:$R_WINDOWS64" "iOS:$R_IOS"; do
            [ "${entry##*:}" = "failure" ] && note "03 BUILD ARTIFACTS / ${entry%%:*}"
          done
          for entry in "Android:$V_ANDROID" "WebGL:$V_WEBGL" "iOS:$V_IOS"; do
            [ "${entry##*:}" = "failure" ] && note "04 ARTIFACT VALIDATION / ${entry%%:*}"
          done

          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          echo "failed-stage=$FAILED_STAGE" >> "$GITHUB_OUTPUT"
          echo "Overall Discord status: $overall${FAILED_STAGE:+ (failed at ${FAILED_STAGE})}"

      # A local (./) composite action resolves from the runner workspace, which
      # for a reusable workflow is the CALLER's repo — not this toolkit. So we
      # check the toolkit out and reference the action from there.
      - name: Checkout toolkit (for the Discord action)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Gather run context (commit message, author, duration)
        id: ctx
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BUILD_DURATION=""

          # ── Commit message (first line) ───────────────────────────────────
          COMMIT_MSG=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" \
            -q '.commit.message' 2>/dev/null | head -1) || true
          echo "commit-message=${COMMIT_MSG}" >> "$GITHUB_OUTPUT"

          # ── Commit author ─────────────────────────────────────────────────
          COMMIT_AUTHOR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" \
            -q '.commit.author.name' 2>/dev/null) || true
          echo "commit-author=${COMMIT_AUTHOR}" >> "$GITHUB_OUTPUT"

          # ── Build duration ────────────────────────────────────────────────
          START=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -q '.run_started_at' 2>/dev/null) || true
          if [ -n "${START}" ]; then
            START_EPOCH=$(date -u -d "${START}" +%s 2>/dev/null) || true
            if [ -n "${START_EPOCH}" ] && [ "${START_EPOCH}" -gt 0 ] 2>/dev/null; then
              NOW=$(date -u +%s)
              ELAPSED=$(( NOW - START_EPOCH ))
              if [ "${ELAPSED}" -ge 60 ]; then
                BUILD_DURATION="$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s"
              else
                BUILD_DURATION="${ELAPSED}s"
              fi
            fi
          fi
          echo "build-duration=${BUILD_DURATION}" >> "$GITHUB_OUTPUT"

      - name: Gather per-platform error/warning counts + log artifact ids
        id: diag
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          DIAG=""
          TOTAL_ERRORS=0
          TOTAL_WARNINGS=0

          # ── Build name→id map from artifacts API ──────────────────────────
          ARTIFACT_MAP=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            -q '.artifacts[]|"\(.name) \(.id)"' 2>/dev/null) || true

          # ── Per-platform scan ─────────────────────────────────────────────
          for P in Android WebGL Linux64 LinuxServer Windows64 iOS; do
            LOG=$(find ./artifacts -path "*unity-build-${P}-logs*Editor.log" \
              -print 2>/dev/null | head -1) || true

            # Skip platforms with no log file — nothing to report
            [ -z "${LOG}" ] && continue

            errors=$(grep -cE '\): error |Aborting batchmode|BuildFailedException' \
              "${LOG}" 2>/dev/null) || errors=0
            warnings=$(grep -cE '\): warning ' \
              "${LOG}" 2>/dev/null) || warnings=0

            # Look up the logs artifact id from the map
            logsid=$(printf '%s\n' "${ARTIFACT_MAP}" \
              | grep "^unity-build-${P}-logs " \
              | awk '{print $2}' | head -1) || logsid=""

            binid=$(printf '%s\n' "${ARTIFACT_MAP}" \
              | grep "^unity-build-${P} " \
              | awk '{print $2}' | head -1) || binid=""

            DIAG="${DIAG}${P}=${errors},${warnings},${logsid},${binid}"$'\n'
            TOTAL_ERRORS=$(( TOTAL_ERRORS + errors ))
            TOTAL_WARNINGS=$(( TOTAL_WARNINGS + warnings ))
          done

          # ── Emit outputs ──────────────────────────────────────────────────
          {
            echo "platform-diagnostics<<EOF"
            printf '%s' "${DIAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "total-errors=${TOTAL_ERRORS}"   >> "$GITHUB_OUTPUT"
          echo "total-warnings=${TOTAL_WARNINGS}" >> "$GITHUB_OUTPUT"

      - name: Post build to Discord thread
        uses: ./.toolkit/.github/actions/discord-upload-build
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          status:              ${{ steps.status.outputs.overall }}
          flow-type:           ${{ needs.resolve-config.outputs.flow-type }}
          environment:         ${{ needs.resolve-config.outputs.environment }}
          run-url:             ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit-sha:          ${{ github.sha }}
          branch:              ${{ github.ref_name }}
          unity-version:       ${{ needs.resolve-config.outputs.unity-version }}
          result-android:      ${{ needs.build-android.result }}
          result-webgl:        ${{ needs.build-webgl.result }}
          result-linux64:      ${{ needs.build-linux64.result }}
          result-linuxserver:  ${{ needs.build-linuxserver.result }}
          result-windows64:    ${{ needs.build-windows64.result }}
          result-ios:          ${{ needs.build-ios.result }}
          result-addressables: ${{ needs.build-addressables.result }}
          result-tests:        ${{ needs.unity-tests.result }}
          result-validation-android: ${{ needs.validate-artifact-android.result }}
          result-validation-webgl:   ${{ needs.validate-artifact-webgl.result }}
          result-validation-ios:     ${{ needs.validate-artifact-ios.result }}
          failed-stage:        ${{ steps.status.outputs.failed-stage }}
          configuration:       ${{ needs.resolve-config.outputs.configuration }}
          thread-id:           ${{ vars.DISCORD_THREAD_ID }}
          artifact-dir:        ./artifacts
          attach-size-threshold-mb: '8'
          actor:               ${{ github.actor }}
          event:               ${{ github.event_name }}
          run-number:          ${{ github.run_number }}
          repository:          ${{ github.repository }}
          commit-message:      ${{ steps.ctx.outputs.commit-message }}
          commit-author:       ${{ steps.ctx.outputs.commit-author }}
          build-duration:      ${{ steps.ctx.outputs.build-duration }}
          platform-diagnostics: ${{ steps.diag.outputs.platform-diagnostics }}
          total-errors:        ${{ steps.diag.outputs.total-errors }}
          total-warnings:      ${{ steps.diag.outputs.total-warnings }}
          product-name:        ${{ needs.resolve-config.outputs.product-name }}
          app-version:         ${{ needs.resolve-config.outputs.app-version }}
          bundle-id:           ${{ needs.resolve-config.outputs.bundle-id }}
          scripting-backend:   ${{ needs.resolve-config.outputs.scripting-backend }}
          android-arch:        ${{ needs.resolve-config.outputs.android-arch }}
          orientation:         ${{ needs.resolve-config.outputs.orientation }}
          store-link:          ${{ needs.resolve-config.outputs.store-link }}
          android-export-type: ${{ needs.resolve-config.outputs.android-export-type }}
          define-symbols-count: ${{ needs.resolve-config.outputs.define-symbols-count }}
          define-symbols:      ${{ needs.resolve-config.outputs.define-symbols }}
