name: Release Orchestrator

# Top-level release pipeline. Consumer repos use this as their release workflow.
#
#   01 Resolve Release Config → 01 Version Bump
#        ↓
#   02 Unity Tests → 02 Quality Gate      ← every platform below waits on this
#        ↓
#   Android            iOS               WebGL          (independent fan-out)
#        ↓
#   07 Release Report
#
# Each platform has its own self-contained pipeline, and each separates build
# from publish (see docs/PIPELINE_ARCHITECTURE.md):
#   Android: build → validate → internal → external → production
#   iOS:     build → archive/IPA → validate → testflight → external → app store
#   WebGL:   build → validate → staging → production
#
# A failed platform does not invalidate the others: re-run the failed pipeline,
# or dispatch it directly with start-phase to publish an already-built artifact.
#
# This is NOT a reusable workflow — it's a consumer-facing entry point.
# Nesting: orchestrator → pipeline-*-release → unity-build-* = 3 levels (safe).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform(s) to release
        required: true
        type: choice
        options: [Android, iOS, WebGL, Android+iOS, All]
      bump-type:
        description: Version bump type (none = use current version)
        required: false
        type: choice
        default: none
        options: [none, patch, minor, major]
      rollout-percentage:
        description: Production rollout percentage for Android (1-100)
        required: false
        type: number
        default: 10
      phased-release-ios:
        description: Enable 7-day phased release for iOS
        required: false
        type: boolean
        default: true
      skip-external-testing:
        description: Skip external testing phase (internal → production)
        required: false
        type: boolean
        default: false
      dry-run:
        description: Build without deploying to stores
        required: false
        type: boolean
        default: false

      # ── Platform-specific required inputs ──
      android-package-name:
        description: Android package name (required for Android release)
        required: false
        type: string
        default: ''
      ios-app-id:
        description: App Store Connect app ID (required for iOS release)
        required: false
        type: string
        default: ''
      unity-version:
        description: Unity editor version (reads from ProjectVersion.txt if empty)
        required: false
        type: string
        default: ''
      ios-bundle-id:
        description: Expected CFBundleIdentifier, checked by iOS artifact validation
        required: false
        type: string
        default: ''
      cloudflare-pages-project:
        description: Cloudflare Pages project name (required for WebGL release)
        required: false
        type: string
        default: ''
      run-tests:
        description: >-
          Run Unity Tests as the quality gate before any release build starts.
          Turning this off means paying for release builds that the test suite
          would have rejected — only do it to re-cut a release from a commit
          whose tests already passed.
        required: false
        type: boolean
        default: true
      test-mode:
        description: Unity test mode for the quality gate
        required: false
        type: choice
        default: All
        options: [All, EditMode, PlayMode]

jobs:
  # ─── RESOLVE & VALIDATE ─────────────────────────────────────────────────────
  preflight:
    name: 01 / Resolve Release Config
    runs-on: ubuntu-latest
    outputs:
      build-android: ${{ steps.resolve.outputs.build-android }}
      build-ios: ${{ steps.resolve.outputs.build-ios }}
      build-webgl: ${{ steps.resolve.outputs.build-webgl }}
      version: ${{ steps.resolve.outputs.version }}
      unity-version: ${{ steps.resolve.outputs.unity-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Resolve platform flags and version
        id: resolve
        shell: bash
        run: |
          PLATFORM="${{ inputs.platform }}"
          # "Both" is kept as an accepted value so existing dispatch history and
          # any scripted caller keep working after WebGL joined the choice list.
          is_selected() { # platform-name
            [[ "${PLATFORM}" == "$1" || "${PLATFORM}" == "All" ]] && return 0
            [[ "$1" != "WebGL" && ( "${PLATFORM}" == "Both" || "${PLATFORM}" == "Android+iOS" ) ]] && return 0
            return 1
          }
          echo "build-android=$(is_selected Android && echo true || echo false)" >> "${GITHUB_OUTPUT}"
          echo "build-ios=$(is_selected iOS && echo true || echo false)"         >> "${GITHUB_OUTPUT}"
          echo "build-webgl=$(is_selected WebGL && echo true || echo false)"     >> "${GITHUB_OUTPUT}"

          # Read version from ProjectSettings
          VERSION=$(grep -oP '^\s*bundleVersion:\s*\K[0-9]+\.[0-9]+\.[0-9]+' ProjectSettings/ProjectSettings.asset || echo "0.0.0")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          # Resolve Unity version
          UNITY_VER="${{ inputs.unity-version }}"
          if [[ -z "${UNITY_VER}" ]]; then
            UNITY_VER=$(grep -oP 'm_EditorVersion:\s*\K\S+' ProjectSettings/ProjectVersion.txt || echo "")
          fi
          echo "unity-version=${UNITY_VER}" >> "${GITHUB_OUTPUT}"

          echo "[orchestrator] Platform: ${PLATFORM}, Version: ${VERSION}, Unity: ${UNITY_VER}"

      - name: Validate inputs
        shell: bash
        run: |
          if [[ "${{ steps.resolve.outputs.build-android }}" == "true" && -z "${{ inputs.android-package-name }}" ]]; then
            echo "::error::android-package-name is required for Android release"
            exit 1
          fi
          if [[ "${{ steps.resolve.outputs.build-ios }}" == "true" && -z "${{ inputs.ios-app-id }}" ]]; then
            echo "::error::ios-app-id is required for iOS release"
            exit 1
          fi
          if [[ "${{ steps.resolve.outputs.build-webgl }}" == "true" && -z "${{ inputs.cloudflare-pages-project }}" ]]; then
            echo "::error::cloudflare-pages-project is required for WebGL release"
            exit 1
          fi
          if [[ -z "${{ steps.resolve.outputs.unity-version }}" ]]; then
            echo "::error::Unity version could not be resolved. Set unity-version input or check ProjectVersion.txt"
            exit 1
          fi

  # ─── VERSION BUMP (optional) ────────────────────────────────────────────────
  version-bump:
    name: 01 / Version Bump
    needs: [preflight]
    if: inputs.bump-type != 'none'
    uses: ./.github/workflows/version-bump.yml
    with:
      bump-type: ${{ inputs.bump-type }}
    # version-bump.yml requires APP_ID / APP_PRIVATE_KEY to push the bump commit;
    # the call passed no secrets at all, so a bump could never have succeeded.
    secrets: inherit

  # ─── 02 — QUALITY GATE ─────────────────────────────────────────────────────
  # A release build is the most expensive thing this repository does: Android,
  # iOS and WebGL in parallel, each a full Unity compile, then store uploads
  # that consume a build number whether or not the binary was any good.
  # Running the test suite alongside them meant discovering a red suite after
  # paying for all of it. Everything below now waits on this node.
  unity-tests:
    name: 02 / Unity Tests
    needs: [preflight]
    if: inputs.run-tests
    uses: ./.github/workflows/reusable-unity-tests.yml
    with:
      node-label: ${{ inputs.test-mode }}
      unity-version: ${{ needs.preflight.outputs.unity-version }}
      test-mode: ${{ inputs.test-mode }}
    secrets: inherit

  quality-gate:
    name: 02 / Quality Gate
    needs: [preflight, version-bump, unity-tests]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
      blocking-stage: ${{ steps.gate.outputs.blocking-stage }}
    steps:
      - name: Evaluate quality gate
        id: gate
        shell: bash
        env:
          R_PREFLIGHT: ${{ needs.preflight.result }}
          R_BUMP:      ${{ needs.version-bump.result }}
          R_TESTS:     ${{ needs.unity-tests.result }}
        run: |
          set -Eeuo pipefail
          PASSED=true
          BLOCKING=""
          gate() { # stage-label node-label result
            case "$3" in
              success|skipped) echo "  ✓ $2: $3" ;;
              *)
                echo "  ✗ $2: ${3:-<no result>}"
                PASSED=false
                [[ -z "${BLOCKING}" ]] && BLOCKING="$1 / $2"
                ;;
            esac
          }
          gate "01 PREPARE"      "Resolve Release Config" "${R_PREFLIGHT}"
          gate "01 PREPARE"      "Version Bump"           "${R_BUMP}"
          gate "02 QUALITY GATE" "Unity Tests"            "${R_TESTS}"

          echo "passed=${PASSED}"           >> "$GITHUB_OUTPUT"
          echo "blocking-stage=${BLOCKING}" >> "$GITHUB_OUTPUT"

          {
            echo "## 02 — Quality Gate"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| 01 / Resolve Release Config | \`${R_PREFLIGHT}\` |"
            echo "| 01 / Version Bump | \`${R_BUMP}\` |"
            echo "| 02 / Unity Tests | \`${R_TESTS}\` |"
            echo ""
            if [[ "${PASSED}" == "true" ]]; then
              echo "✅ Gate open — release builds may start."
            else
              echo "❌ Gate closed at **${BLOCKING}** — no release build was started."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${PASSED}" != "true" ]]; then
            echo "::error title=Quality Gate::Blocked at ${BLOCKING}. No release build was started."
            exit 1
          fi

  # ─── ANDROID PIPELINE ──────────────────────────────────────────────────────
  android-release:
    name: Android
    needs: [preflight, quality-gate]
    if: |
      always() &&
      needs.preflight.outputs.build-android == 'true' &&
      needs.quality-gate.outputs.passed == 'true'
    uses: ./.github/workflows/pipeline-android-release.yml
    with:
      unity-version: ${{ needs.preflight.outputs.unity-version }}
      build-version: ${{ needs.preflight.outputs.version }}
      package-name: ${{ inputs.android-package-name }}
      rollout-percentage: ${{ inputs.rollout-percentage }}
      skip-external: ${{ inputs.skip-external-testing }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  # ─── iOS PIPELINE ──────────────────────────────────────────────────────────
  ios-release:
    name: iOS
    needs: [preflight, quality-gate]
    if: |
      always() &&
      needs.preflight.outputs.build-ios == 'true' &&
      needs.quality-gate.outputs.passed == 'true'
    uses: ./.github/workflows/pipeline-ios-release.yml
    with:
      unity-version: ${{ needs.preflight.outputs.unity-version }}
      build-version: ${{ needs.preflight.outputs.version }}
      version-string: ${{ needs.preflight.outputs.version }}
      app-id: ${{ inputs.ios-app-id }}
      bundle-id: ${{ inputs.ios-bundle-id }}
      phased-release: ${{ inputs.phased-release-ios }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  # ─── WEBGL PIPELINE ────────────────────────────────────────────────────────
  # Independent of Android and iOS: a failed Android upload leaves an already
  # deployed WebGL build deployed, and re-running this node alone re-deploys
  # without rebuilding the other two platforms.
  webgl-release:
    name: WebGL
    needs: [preflight, quality-gate]
    if: |
      always() &&
      needs.preflight.outputs.build-webgl == 'true' &&
      needs.quality-gate.outputs.passed == 'true'
    uses: ./.github/workflows/pipeline-webgl-release.yml
    with:
      unity-version: ${{ needs.preflight.outputs.unity-version }}
      build-version: ${{ needs.preflight.outputs.version }}
      cloudflare-pages-project: ${{ inputs.cloudflare-pages-project }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  # ─── FINAL REPORT ──────────────────────────────────────────────────────────
  report:
    name: 07 / Release Report
    needs: [preflight, unity-tests, quality-gate, android-release, ios-release, webgl-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        shell: bash
        env:
          R_TESTS:   ${{ needs.unity-tests.result }}
          R_GATE:    ${{ needs.quality-gate.result }}
          GATE_BLOCKER: ${{ needs.quality-gate.outputs.blocking-stage }}
          R_ANDROID: ${{ needs.android-release.result }}
          R_IOS:     ${{ needs.ios-release.result }}
          R_WEBGL:   ${{ needs.webgl-release.result }}
          VERSION:   ${{ needs.preflight.outputs.version }}
          DRY_RUN:   ${{ inputs.dry-run }}
        run: |
          set -Eeuo pipefail
          emoji() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❓" ;;
            esac
          }
          {
            echo "## Release Report"
            echo ""
            echo "**Version:** \`${VERSION}\` · **Dry run:** \`${DRY_RUN}\`"
            echo ""
            echo "### 02 — Quality Gate"
            echo "| Node | Result |"
            echo "|---|---|"
            echo "| 02 / Unity Tests | $(emoji "${R_TESTS}") \`${R_TESTS:-skipped}\` |"
            echo "| 02 / Quality Gate | $(emoji "${R_GATE}") \`${R_GATE:-skipped}\` |"
            if [[ -n "${GATE_BLOCKER}" ]]; then
              echo ""
              echo "> ⛔ Gate closed at **${GATE_BLOCKER}** — no release build was started."
            fi
            echo ""
            echo "### 03–06 — Platform Pipelines"
            echo "| Platform | Pipeline | Result |"
            echo "|---|---|---|"
            echo "| Android | \`pipeline-android-release\` | $(emoji "${R_ANDROID}") \`${R_ANDROID:-skipped}\` |"
            echo "| iOS | \`pipeline-ios-release\` | $(emoji "${R_IOS}") \`${R_IOS:-skipped}\` |"
            echo "| WebGL | \`pipeline-webgl-release\` | $(emoji "${R_WEBGL}") \`${R_WEBGL:-skipped}\` |"
            echo ""
            echo "> Each platform pipeline is independent: re-run a single failed"
            echo "> platform from this run without rebuilding the others, or dispatch"
            echo "> it directly with \`start-phase\` to publish an already-built artifact."
          } >> "${GITHUB_STEP_SUMMARY}"

          FAILED=""
          for entry in "Android:${R_ANDROID}" "iOS:${R_IOS}" "WebGL:${R_WEBGL}"; do
            case "${entry##*:}" in
              success|skipped|"") ;;
              *) FAILED="${FAILED} ${entry%%:*}=${entry##*:}" ;;
            esac
          done
          if [[ -n "${GATE_BLOCKER}" ]]; then
            echo "::error::Release blocked at ${GATE_BLOCKER}."
            exit 1
          fi
          if [[ -n "${FAILED}" ]]; then
            echo "::error::Release failed for:${FAILED}. Re-run only the failed platform pipeline."
            exit 1
          fi
