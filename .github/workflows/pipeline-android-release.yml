name: Pipeline Android Release

# Android promotion pipeline — PROMOTE ONLY. This workflow builds nothing.
#
#   Verify Identity → Validate AAB → Release Notes → Internal → External → Production
#
# It consumes an artifact that `Build / Release` already produced and signed,
# pinned by `source-run-id`, and publishes those exact bytes. Every phase is a
# separate job gated by a GitHub Environment.
#
# The absence of a build step is the point (I-005): the bytes QA approved must
# be the bytes that ship, and a rebuild — however identical the inputs look —
# produces a different artifact that nobody approved. `check_promotion_never_
# mutates` in scripts/common/validate_pipeline_invariants.py fails CI if a
# build, export or signing operation reappears here.

on:
  workflow_call:
    inputs:
      toolkit-repo:
        description: >-
          Toolkit repository checked out to .toolkit/ for this workflow's own
          composite actions and scripts. A step-level `uses: ./…` in a reusable
          workflow resolves against the runner WORKSPACE, which is the caller's
          repository — so the toolkit's actions are not on disk unless checked
          out explicitly.
        type: string
        required: false
        default: Cuvara/unity-build-workflows
      toolkit-ref:
        description: Git ref of the toolkit repository to check out.
        type: string
        required: false
        default: main
      # ── Build inputs ──
      project-path:
        type: string
        required: false
        default: '.'
      unity-version:
        type: string
        required: true
      build-config-path:
        type: string
        required: false
        default: BuildConfig
      build-version:
        type: string
        required: true
      build-addressables:
        type: boolean
        required: false
        default: true
      image-registry:
        type: string
        required: false
        default: ghcr.io
      image-namespace:
        type: string
        required: false
        default: ''
      image-name:
        type: string
        required: false
        default: ''
      image-digest:
        type: string
        required: false
        default: ''
      workflow-repository:
        type: string
        required: false
        default: ''
      workflow-ref:
        type: string
        required: false
        default: ''
      integration-mode:
        type: string
        required: false
        default: remote
      toolkit-path:
        type: string
        required: false
        default: tools/unity-build-workflows

      # ── Release inputs ──
      package-name:
        description: Android package name (e.g., com.company.app)
        type: string
        required: true
      start-phase:
        description: Phase to start from (validate/internal/external/production)
        type: string
        required: false
        default: validate
      allow-unverified-build-number:
        description: >-
          Proceed when the store's existing versionCodes cannot be read. Only
          for a first upload to a package that does not exist in the console
          yet — it disables the guard against reusing a build number.
        type: boolean
        required: false
        default: false
      source-run-id:
        description: >-
          Run ID of the Build / Release run that produced the artifact. Required
          because `actions/download-artifact` only sees the current run by
          default — promotion pulls the binary from another run, which is what
          makes it the same binary QA approved rather than a rebuild.
        type: string
        required: true
      artifact-name:
        description: >-
          Existing build artifact to publish when start-phase is
          internal/external/production. This is what makes "retry the upload"
          publish the same validated bytes instead of rebuilding the AAB.
        type: string
        required: false
        default: ''
      rollout-percentage:
        description: Production rollout percentage (1-100, default 100)
        type: number
        required: false
        default: 100
      skip-external:
        description: Skip external testing phase (internal → production)
        type: boolean
        required: false
        default: false
      from-tag:
        description: Git tag to generate release notes from
        type: string
        required: false
        default: ''
      dry-run:
        description: Build without deploying to store
        type: boolean
        required: false
        default: false

    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASS:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASS:
        required: false
      DISCORD_WEBHOOK_URL:
        description: Discord webhook for the stage-07 release notification. Optional.
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        # Deliberately optional: stage 03/04 (Build Only, dry-run) must run in a
        # repo that has no Play credentials at all. A workflow_call-level
        # `required: true` is checked when the call is *resolved*, so it made a
        # build-only run impossible before a single job started. The publish
        # jobs check for it themselves and fail there, where it matters.
        required: false

    outputs:
      artifact-name:
        description: Name of the build artifact
        value: ${{ inputs.artifact-name }}

  workflow_dispatch:
    inputs:
      unity-version:
        description: Unity editor version
        required: true
        type: string
      build-version:
        description: Build version string
        required: true
        type: string
      package-name:
        description: Android package name
        required: true
        type: string
      start-phase:
        description: Phase to start from
        required: false
        type: choice
        default: validate
        options: [validate, internal, external, production]
      artifact-name:
        description: Existing artifact to publish (required unless start-phase is build)
        required: false
        type: string
        default: ''
      rollout-percentage:
        description: Production rollout percentage (1-100)
        required: false
        type: number
        default: 100
      skip-external:
        description: Skip external testing phase
        required: false
        type: boolean
        default: false
      dry-run:
        description: Build without deploying
        required: false
        type: boolean
        default: false

jobs:
  # ─── 04 — VERIFY RELEASE IDENTITY ───────────────────────────────────────────
  # A filename establishes nothing. This proves the downloaded bytes are the
  # ones the named Release Set produced: same run, same commit, same version,
  # same build number, same SHA-256. It fails closed — a promotion that cannot
  # prove what it is holding must not publish it.
  verify-artifact:
    name: 04 / Android / Verify Release Identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Download artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ${{ inputs.artifact-name }}
          path: promoted/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Download release manifest
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: release-manifest
          path: release-set/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Verify release identity and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/common/release_manifest.py verify \
            --manifest             release-set/release-manifest.json \
            --platform             Android \
            --artifact-path        promoted \
            --expect-run-id        "${{ inputs.source-run-id }}" \
            --expect-artifact-name "${{ inputs.artifact-name }}" \
            --expect-version       "${{ inputs.build-version }}"

      # Play rejects a duplicate versionCode, but only after the upload has
      # started — a late, misleading failure. A code merely LOWER than the
      # current one uploads fine and then cannot be promoted, which surfaces
      # days later mid-rollout. Ask the store first.
      #
      # Skipped on a dry run: there is nothing to collide with, and a dry run
      # must not require store credentials.
      - name: Check the build number against the store
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -Eeuo pipefail
          pip install --quiet google-api-python-client google-auth
          BUILD_NUMBER=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["releaseSet"]["buildNumber"])' \
            release-set/release-manifest.json)
          python3 .toolkit/scripts/android/check_build_number.py \
            --package-name  "${{ inputs.package-name }}" \
            --build-number  "${BUILD_NUMBER}" \
            ${{ inputs.allow-unverified-build-number && '--allow-unverified' || '' }}
  # ─── VALIDATE AAB ───────────────────────────────────────────────────────────
  validate-aab:
    name: 04 / Android / Validate AAB
    needs: [verify-artifact]
    if: |
      needs.verify-artifact.result == 'success' &&
      inputs.start-phase == 'validate'
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ${{ inputs.artifact-name }}
          path: build-artifact/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      # A >1000-byte file was the whole of the old gate, so an unsigned AAB, an
      # APK where an AAB was expected, or a bundle with the wrong package id all
      # reached Google Play and failed there. Validate the artifact properly.
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Validate build artifact
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/android/validate_android_artifact.py \
            --search-root      build-artifact \
            --expected-type    AAB \
            --expected-package "${{ inputs.package-name }}" \
            --expected-version-name "${{ inputs.build-version }}" \
            --require-signed \
            --report           validation-android.json

      - name: Upload validation report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: validation-report-Android
          path: validation-android.json
          retention-days: 30

  # ─── RELEASE NOTES ──────────────────────────────────────────────────────────
  release-notes:
    name: 04 / Android / Release Notes
    needs: [verify-artifact]
    if: |
      needs.verify-artifact.result == 'success' &&
      true
    runs-on: ubuntu-latest
    steps:
      # Release notes come from the CALLER's git history, so the caller repo is
      # the workspace checkout; the toolkit only supplies the action.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Generate notes
        uses: ./.toolkit/.github/actions/generate-release-notes
        with:
          from-tag: ${{ inputs.from-tag }}
          format: google-play-json
          output-path: release-notes.json

      - name: Upload notes
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: android-release-notes
          path: release-notes.json
          retention-days: 7

  # ─── PHASE 1: INTERNAL TESTING ──────────────────────────────────────────────
  internal-testing:
    name: 05 / Android / Publish — Internal Testing
    needs: [verify-artifact, validate-aab, release-notes]
    if: |
      needs.verify-artifact.result == 'success' &&
      !inputs.dry-run &&
      (
        (inputs.start-phase == 'validate' && needs.validate-aab.result == 'success') ||
        inputs.start-phase == 'internal'
      )
    runs-on: ubuntu-latest
    environment: internal-testing
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Download build artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ${{ inputs.artifact-name }}
          path: build-artifact/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Download release notes
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: android-release-notes
          path: ./
        continue-on-error: true

      - name: Install dependencies
        run: pip install --quiet google-api-python-client google-auth

      - name: Upload to internal track
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          ARGS=(
            --build-path build-artifact/
            --version "${{ inputs.build-version }}"
            --track internal
            --package-name "${{ inputs.package-name }}"
          )
          if [[ -f release-notes.json ]]; then
            ARGS+=(--release-notes-file release-notes.json)
          fi
          python3 .toolkit/scripts/android/upload_google_play.py "${ARGS[@]}"

      - name: Summary
        run: |
          echo "### Phase 1: Internal Testing" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Package:** ${{ inputs.package-name }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Version:** ${{ inputs.build-version }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Track:** internal" >> "${GITHUB_STEP_SUMMARY}"

  # ─── PHASE 2: EXTERNAL TESTING ─────────────────────────────────────────────
  external-testing:
    name: 06 / Android / Release — External Testing
    needs: [verify-artifact, internal-testing]
    if: |
      needs.verify-artifact.result == 'success' &&
      !inputs.dry-run && !inputs.skip-external &&
      (
        needs.internal-testing.result == 'success' ||
        inputs.start-phase == 'external'
      )
    runs-on: ubuntu-latest
    environment: external-testing
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Promote to alpha track
        uses: ./.toolkit/.github/actions/google-play-promote
        with:
          package-name: ${{ inputs.package-name }}
          from-track: internal
          to-track: alpha
          service-account-json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Summary
        run: |
          echo "### Phase 2: External Testing" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Promoted:** internal → alpha" >> "${GITHUB_STEP_SUMMARY}"

  # ─── PHASE 3: PRODUCTION ───────────────────────────────────────────────────
  production-release:
    name: 06 / Android / Release — Production
    needs: [verify-artifact, internal-testing, external-testing, release-notes]
    if: |
      needs.verify-artifact.result == 'success' &&
      !inputs.dry-run &&
      (
        inputs.start-phase == 'production' ||
        needs.external-testing.result == 'success' ||
        (inputs.skip-external && needs.internal-testing.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Download release notes
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: android-release-notes
          path: ./
        continue-on-error: true

      - name: Determine source track and rollout fraction
        id: source
        shell: bash
        run: |
          if [[ "${{ inputs.skip-external }}" == "true" ]]; then
            echo "track=internal" >> "${GITHUB_OUTPUT}"
          else
            echo "track=alpha" >> "${GITHUB_OUTPUT}"
          fi
          # Compute rollout fraction (percentage / 100)
          PERCENT="${{ inputs.rollout-percentage }}"
          FRACTION=$(python3 -c "print(${PERCENT} / 100.0)")
          echo "rollout-fraction=${FRACTION}" >> "${GITHUB_OUTPUT}"

      - name: Promote to production
        uses: ./.toolkit/.github/actions/google-play-promote
        with:
          package-name: ${{ inputs.package-name }}
          from-track: ${{ steps.source.outputs.track }}
          to-track: production
          rollout-fraction: ${{ steps.source.outputs.rollout-fraction }}
          release-notes-path: release-notes.json
          service-account-json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Summary
        run: |
          ROLLOUT="${{ inputs.rollout-percentage }}"
          echo "### Phase 3: Production" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Source:** ${{ steps.source.outputs.track }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Rollout:** ${ROLLOUT}%" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${ROLLOUT}" -lt 100 ]]; then
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "Staged rollout active. Use \`update_rollout.py --rollout-fraction X\` to adjust." >> "${GITHUB_STEP_SUMMARY}"
          fi

  # ─── 07 — REPORT & NOTIFY ───────────────────────────────────────────────────
  # The pipeline used to end at stage 06, so a release run produced no report:
  # the only way to see how far a promotion got was to read the graph. This
  # says which phase it reached, or which one stopped it, and posts the same
  # to Discord.
  report:
    name: 07 / Android / Report & Notify
    needs: [verify-artifact, validate-aab, release-notes, internal-testing, external-testing, production-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Report
        uses: ./.toolkit/.github/actions/release-report
        with:
          platform: Android
          destination: Google Play
          build-version: ${{ inputs.build-version }}
          artifact-name: ${{ inputs.artifact-name }}
          start-phase: ${{ inputs.start-phase }}
          dry-run: ${{ inputs.dry-run }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          phases: |
            04 Verify Release Identity=${{ needs.verify-artifact.result }}
            04 Validate AAB=${{ needs.validate-aab.result }}
            04 Release Notes=${{ needs.release-notes.result }}
            05 Publish — Internal Testing=${{ needs.internal-testing.result }}
            06 Release — External Testing=${{ needs.external-testing.result }}
            06 Release — Production=${{ needs.production-release.result }}
