name: Unity Release iOS

# DEPRECATED — legacy entry point, kept working for existing callers. New
# projects call unity-pipeline.yml (build) and pipeline-*-release.yml
# (promotion); see docs/ARCHITECTURE.md § Legacy entry points. Planned for
# removal in the next major version.

# Distribution signing, archive, IPA export, and optional TestFlight upload.
# Runs on macos-unity-xcode. Never executes in Docker.
# Requires ios-production GitHub Environment (protected) for deployment secrets.
# Third-party actions are pinned to commit SHAs for supply-chain security.

on:
  workflow_dispatch:
    inputs:
      runner-label:
        description: >-
          Runner label(s) for the Unity job, comma-separated. Empty (default)
          uses the repository's runner policy when one exists, otherwise
          `macos-unity-xcode` as before. A value here wins over the policy.
        required: false
        type: string
        default: ''
      unity-version:
        description: Unity editor version (e.g., 6000.0.23f1)
        required: true
        type: string
      export-method:
        description: IPA export method
        required: true
        type: choice
        options: [app-store, ad-hoc, enterprise, development]
        default: app-store
      upload-to-testflight:
        description: Upload IPA to TestFlight after export (requires ios-production environment)
        required: false
        type: boolean
        default: false
      dry-run:
        description: Build and sign without uploading to TestFlight
        required: false
        type: boolean
        default: false
      project-path:
        description: Path to Unity project root
        required: false
        type: string
        default: '.'
      build-config-path:
        description: Path to BuildConfig directory (relative to project-path)
        required: false
        type: string
        default: BuildConfig
      app-name:
        description: >
          Application name used for archive and IPA file naming
          (e.g. "MyGame" → MyGame.xcarchive, MyGame.ipa).
          Defaults to "Unity". Must not contain spaces or special characters.
        required: false
        type: string
        default: Unity

  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-ios*'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # ─── PRE-RELEASE GATES ─────────────────────────────────────────────────────────
  pre-release-checks:
    name: Pre-release Gates
    # Consumer-facing iOS release workflow — must run inside a Unity project.
    # The upstream toolkit repo is not one, and its `v*` tags are toolkit
    # releases, not game releases. Skip the whole chain there (downstream jobs
    # `need` this one).
    if: ${{ github.repository != 'Cuvara/unity-build-workflows' }}
    runs-on: ubuntu-latest
    outputs:
      build-version: ${{ steps.version.outputs.version }}
      unity-version: ${{ steps.resolve-unity.outputs.unity-version }}
      export-method: ${{ steps.resolve-export.outputs.export-method }}
      bundle-identifier: ${{ steps.read-config.outputs.bundle-identifier }}
      development-team: ${{ steps.read-config.outputs.development-team }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Refuse fork / unowned-repo context
        shell: bash
        run: |
          # Block fork execution
          if [[ "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
            echo "::error::iOS release workflow cannot run from a forked repository."
            exit 1
          fi
          # Block if triggered from a PR (extra guard)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "::error::iOS release workflow cannot run from a pull_request event."
            exit 1
          fi
          echo "[pre-release] Context validated — not a fork, not a PR"

      - name: Resolve Unity version
        id: resolve-unity
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "unity-version=${{ inputs.unity-version }}" >> "$GITHUB_OUTPUT"
          else
            UNITY_VERSION=$(grep -r "m_EditorVersion:" "${{ inputs.project-path || '.' }}/ProjectSettings/ProjectVersion.txt" \
              2>/dev/null | awk '{print $2}' | tr -d '\r' || echo "")
            if [[ -z "${UNITY_VERSION}" ]]; then
              echo "::error::Cannot resolve Unity version from ProjectVersion.txt — use workflow_dispatch and specify unity-version."
              exit 1
            fi
            echo "unity-version=${UNITY_VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "Unity version: $(cat $GITHUB_OUTPUT | grep unity-version | cut -d= -f2)"

      - name: Resolve export method
        id: resolve-export
        shell: bash
        run: |
          METHOD="${{ inputs.export-method || 'app-store' }}"
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            METHOD="development"
            echo "::notice::dry-run=true — overriding export-method to 'development'"
          fi
          echo "export-method=${METHOD}" >> "$GITHUB_OUTPUT"

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 scripts/common/resolve_project_version.py \
            --project-path "${{ inputs.project-path || '.' }}" \
            --config-path  "${{ inputs.project-path || '.' }}/${{ inputs.build-config-path || 'BuildConfig' }}" \
            --environment  production \
            --ref          "${{ github.ref }}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Validate version matches tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          TAG="${TAG%%-ios*}"
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "::error::Git tag does not match BuildConfig version '${VERSION}'"
            exit 1
          fi
          echo "Version matches tag: ${VERSION}"

      - name: Read iOS BuildConfig
        id: read-config
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project-path || '.' }}
          BUILD_CONFIG_PATH: ${{ inputs.build-config-path || 'BuildConfig' }}
        run: |
          python3 scripts/common/validate_build_config.py \
            --config-path "${PROJECT_PATH}/${BUILD_CONFIG_PATH}" \
            --platform    iOS \
            --environment production \
            --check-release-flags \
            --strict

          # Extract iOS fields for downstream jobs.
          # Schema canonical key is "iOS" (uppercase); "ios" is the deprecated lowercase alias.
          # developmentTeamId is the canonical key; developmentTeam is the legacy alias.
          BUNDLE_ID=$(python3 -c \
            "import json,pathlib,glob; configs=sorted(glob.glob('${PROJECT_PATH}/${BUILD_CONFIG_PATH}/*.json')); merged={}; [merged.update(json.loads(pathlib.Path(c).read_text())) for c in configs]; ios=merged.get('iOS',merged.get('ios',{})); print(ios.get('bundleIdentifier',''))" \
            2>/dev/null || echo "")

          DEV_TEAM=$(python3 -c \
            "import json,pathlib,glob; configs=sorted(glob.glob('${PROJECT_PATH}/${BUILD_CONFIG_PATH}/*.json')); merged={}; [merged.update(json.loads(pathlib.Path(c).read_text())) for c in configs]; ios=merged.get('iOS',merged.get('ios',{})); print(ios.get('developmentTeamId',ios.get('developmentTeam','')))" \
            2>/dev/null || echo "")

          if [[ -z "${BUNDLE_ID}" ]]; then
            echo "::error::ios.bundleIdentifier not found in BuildConfig"
            exit 1
          fi
          if [[ -z "${DEV_TEAM}" ]]; then
            echo "::error::ios.developmentTeamId (or legacy ios.developmentTeam) not found in BuildConfig"
            exit 1
          fi

          echo "bundle-identifier=${BUNDLE_ID}" >> "$GITHUB_OUTPUT"
          echo "development-team=${DEV_TEAM}"   >> "$GITHUB_OUTPUT"
          echo "Bundle ID: ${BUNDLE_ID} | Team: ${DEV_TEAM}"

      - name: Verify signing secrets present
        shell: bash
        env:
          IOS_DIST_CERT:    ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DIST_PASS:    ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROFILE:      ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          MISSING=""
          [[ -z "${IOS_DIST_CERT}" ]]  && MISSING="${MISSING} IOS_DISTRIBUTION_CERTIFICATE_BASE64"
          [[ -z "${IOS_DIST_PASS}" ]]  && MISSING="${MISSING} IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
          [[ -z "${IOS_PROFILE}" ]]    && MISSING="${MISSING} IOS_PROVISIONING_PROFILE_BASE64"
          if [[ -n "${MISSING}" ]]; then
            echo "::error::Missing required iOS signing secrets:${MISSING}"
            exit 1
          fi
          echo "[pre-release] All required iOS signing secrets are present"

  # ─── iOS DISTRIBUTION BUILD ────────────────────────────────────────────────────
  # ── Runner selection (ADR 004 stage 2c) ──────────────────────────────────
  # Chooses the runner the Unity job below runs on, before that job exists:
  # runs-on cannot be decided from inside the job it schedules.
  #
  # This job runs on GitHub-hosted ubuntu-latest, and ONLY when a runner policy
  # is opted in through a repository/organization variable (RUNNER_POLICY or
  # RUNNER_POLICY_FILE) and no explicit runner label was passed. Otherwise it is
  # skipped and the Unity job below uses the explicit label, else
  # `macos-unity-xcode` -- exactly the routing this workflow had before runner
  # scheduling, with no extra GitHub-hosted job. When it runs,
  # runner_scheduler.py looks for an eligible, available self-hosted runner on
  # the standalone-native lane; if it cannot, it fails here with a report instead of
  # leaving the Unity job queued. See docs/MULTI_RUNNER_SCHEDULING.md.
  resolve-runner:
    name: Select runner
    needs: pre-release-checks
    if: ${{ (vars.RUNNER_POLICY != '' || vars.RUNNER_POLICY_FILE != '') && inputs.runner-label == '' }}
    runs-on: ubuntu-latest
    outputs:
      runs-on:         ${{ steps.select.outputs.runs-on }}
      selected-target: ${{ steps.select.outputs.selected-target }}
    steps:
      - name: Checkout runner policy and scheduler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
            **/scripts/common/*.py
          sparse-checkout-cone-mode: false

      - name: Decide whether a runner policy applies
        id: need
        shell: bash
        env:
          RUNNER_POLICY:      ${{ vars.RUNNER_POLICY || '' }}
          RUNNER_POLICY_FILE: ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
          EXPLICIT_LABEL:     ${{ inputs.runner-label }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${EXPLICIT_LABEL}" ]] \
             && { [[ -n "${RUNNER_POLICY}" ]] || [[ -f "${RUNNER_POLICY_FILE}" ]]; }; then
            echo "scheduler=true" >> "$GITHUB_OUTPUT"
          else
            echo "scheduler=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select runner
        id: select
        shell: bash
        env:
          SCHEDULER:              ${{ steps.need.outputs.scheduler }}
          RS_JOBS:                iOS
          RS_LANE:                standalone-native
          RS_LEGACY_BUILD_ENGINE: local
          RS_LEGACY_ACTIVATION:   none
          RS_FALLBACK_LABELS:     macos-unity-xcode
          RS_EXPLICIT_LABELS:     ${{ inputs.runner-label }}
          RS_UNITY_VERSION:       ${{ needs.pre-release-checks.outputs.unity-version }}
          RUNNER_POLICY:          ${{ vars.RUNNER_POLICY || '' }}
          RUNNER_POLICY_FILE:     ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
          # Read-only runner-status token; sent only as an Authorization header.
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ "${SCHEDULER}" != "true" ]]; then
            # No policy applies: the caller's explicit label, else the label this
            # workflow has always used. Nothing to schedule, nothing to fetch.
            if [[ -n "${RS_EXPLICIT_LABELS}" ]]; then
              labels="${RS_EXPLICIT_LABELS}"; why="explicit runner label input"
            else
              labels="${RS_FALLBACK_LABELS}"; why="no runner policy applies"
            fi
            labels="${labels//[\[\]\"]/}"
            json="["; sep=""
            for label in ${labels//,/ }; do json+="${sep}\"${label}\""; sep=","; done
            json+="]"
            echo "Runner selection: runs-on=${json} (${why})"
            echo "runs-on=${json}" >> "$GITHUB_OUTPUT"
            echo "selected-target=${labels}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This workflow runs the toolkit from the repository's own checkout
          # (as its executor check does), so the scheduler is looked up there.
          TOOLKIT="$(pwd)"
          if [[ ! -f "${TOOLKIT}/scripts/common/runner_scheduler.py" ]]; then
            echo "::error title=Runner scheduler missing::A runner policy is configured but scripts/common/runner_scheduler.py is not in this repository. Vendor the toolkit's scripts/common, pass an explicit runner label, or remove the policy."
            exit 1
          fi
          python3 "${TOOLKIT}/scripts/common/runner_scheduler.py"

  release-build:
    name: iOS Distribution Build
    needs: [pre-release-checks, resolve-runner]
    # Skipped resolver (no policy opted in, or an explicit label) is the
    # normal case, not a failure.
    if: ${{ !cancelled() && needs.pre-release-checks.result == 'success' && (needs.resolve-runner.result == 'success' || needs.resolve-runner.result == 'skipped') }}
    runs-on: ${{ needs.resolve-runner.result == 'success' && fromJSON(needs.resolve-runner.outputs.runs-on) || inputs.runner-label || 'macos-unity-xcode' }}
    environment: ios-production
    env:
      UNITY_VERSION: ${{ needs.pre-release-checks.outputs.unity-version }}
      BUILD_VERSION: ${{ needs.pre-release-checks.outputs.build-version }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_THREAD_ID: ${{ vars.DISCORD_THREAD_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          lfs: true
          fetch-depth: 0

      # ── Guard ────────────────────────────────────────────────────────────────
      - name: Verify macOS runner
        shell: bash
        run: |
          if [[ "${{ runner.os }}" != "macOS" ]]; then
            echo "::error::Target \`iOS\` requires an approved macOS runner with Xcode and Unity iOS Build Support. Linux Docker execution is not supported."
            exit 1
          fi

      # ── Platform executor validation ─────────────────────────────────────────
      - name: Validate platform executor
        shell: bash
        run: |
          if [[ -f "scripts/common/resolve_platform_executor.py" ]]; then
            python3 scripts/common/resolve_platform_executor.py \
              --target-platform iOS \
              --runner-os "${{ runner.os }}"
          else
            echo "::notice::resolve_platform_executor.py not yet present — skipping"
          fi

      # ── Verify Unity + iOS Support ───────────────────────────────────────────
      - name: Resolve Unity installation
        id: unity-install
        shell: bash
        run: |
          UNITY_EDITOR="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          IOS_SUPPORT="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/PlaybackEngines/iOSSupport"
          if [[ ! -f "${UNITY_EDITOR}" ]]; then
            echo "::error::Unity editor not found: ${UNITY_EDITOR}"
            exit 1
          fi
          if [[ ! -d "${IOS_SUPPORT}" ]]; then
            echo "::error::Unity iOS Build Support not found: ${IOS_SUPPORT}"
            exit 1
          fi
          echo "unity-editor=${UNITY_EDITOR}" >> "$GITHUB_OUTPUT"
          echo "[unity-install] Unity and iOS Build Support verified"

      # ── Cleanup trap (registered early so it runs even on cancellation) ───────
      # Actual cleanup step runs last with if: always()

      # ── Validate BuildConfig ─────────────────────────────────────────────────
      - name: Validate BuildConfig
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project-path || '.' }}
          BUILD_CONFIG_PATH: ${{ inputs.build-config-path || 'BuildConfig' }}
        run: |
          python3 scripts/common/validate_build_config.py \
            --config-path "${PROJECT_PATH}/${BUILD_CONFIG_PATH}" \
            --platform    iOS \
            --environment production \
            --check-release-flags \
            --strict

      # ── Library cache (safe mode, no secrets) ────────────────────────────────
      - name: Restore Library cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c6158d  # v4.2.2
        with:
          path: ${{ inputs.project-path || '.' }}/Library
          key: macOS-unity-${{ needs.pre-release-checks.outputs.unity-version }}-iOS-${{ hashFiles(format('{0}/Packages/manifest.json', inputs.project-path || '.'), format('{0}/Packages/packages-lock.json', inputs.project-path || '.')) }}-cache-schema-v2
          restore-keys: |
            macOS-unity-${{ needs.pre-release-checks.outputs.unity-version }}-iOS-

      # ── Generate build metadata ──────────────────────────────────────────────
      - name: Generate build metadata
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project-path || '.' }}
          BUILD_VERSION: ${{ needs.pre-release-checks.outputs.build-version }}
        run: |
          python3 scripts/common/generate_build_metadata.py \
            --project-path "${PROJECT_PATH}" \
            --platform     iOS \
            --version      "${BUILD_VERSION}" \
            --environment  production \
            --build-number "${{ github.run_number }}" \
            --commit       "${{ github.sha }}"

      # ── Activate Unity license ───────────────────────────────────────────────
      - name: Activate Unity license
        shell: bash
        env:
          UNITY_EDITOR: ${{ steps.unity-install.outputs.unity-editor }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          LOG_PATH: Logs/iOS
        run: bash scripts/ios/run_unity_ios.sh activate

      # ── Unity build: generate Xcode project ─────────────────────────────────
      - name: Build Unity iOS (generate Xcode project)
        id: unity-build
        shell: bash
        env:
          UNITY_EDITOR: ${{ steps.unity-install.outputs.unity-editor }}
          PROJECT_PATH: ${{ inputs.project-path || '.' }}
          ENVIRONMENT: production
          BUILD_CONFIG_PATH: ${{ inputs.build-config-path || 'BuildConfig' }}
          OUTPUT_PATH: Builds/iOS/Xcode
          LOG_PATH: Logs/iOS
        run: bash scripts/ios/run_unity_ios.sh build

      # ── iOS code signing ─────────────────────────────────────────────────────
      - name: Setup iOS signing
        id: signing
        # Seconds normally; a hang must not hold the Mac for hours.
        timeout-minutes: 10
        uses: ./.github/actions/ios-setup-signing
        with:
          ios-distribution-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          ios-distribution-certificate-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          export-method: ${{ needs.pre-release-checks.outputs.export-method }}
          bundle-identifier: ${{ needs.pre-release-checks.outputs.bundle-identifier }}
          development-team: ${{ needs.pre-release-checks.outputs.development-team }}

      # ── Archive + Export ─────────────────────────────────────────────────────
      - name: Archive and export IPA
        id: archive-export
        uses: ./.github/actions/ios-archive-export
        with:
          xcode-project-path: ${{ steps.unity-build.outputs.xcode-project-path }}
          export-options-path: ${{ steps.signing.outputs.export-options-path }}
          development-team: ${{ needs.pre-release-checks.outputs.development-team }}
          archive-path: Builds/iOS/Archive/${{ inputs.app-name || 'Unity' }}.xcarchive
          export-path: Builds/iOS/Export
          archive-log-path: Logs/iOS/xcode-archive.log
          export-log-path: Logs/iOS/xcode-export.log

      # ── Release metadata + checksums ─────────────────────────────────────────
      - name: Generate release metadata and checksums
        shell: bash
        env:
          IPA_PATH: ${{ steps.archive-export.outputs.ipa-path }}
          ARCHIVE_PATH: Builds/iOS/Archive/${{ inputs.app-name || 'Unity' }}.xcarchive
          BUILD_VERSION: ${{ needs.pre-release-checks.outputs.build-version }}
          ENVIRONMENT: production
          REPORT_PATH: BuildReports/iOS
        run: bash scripts/ios/release_metadata.sh

      # ── Optional: TestFlight upload ──────────────────────────────────────────
      - name: Upload to TestFlight
        id: testflight
        if: inputs.upload-to-testflight == true && inputs.dry-run != true
        uses: ./.github/actions/ios-testflight
        with:
          ipa-path: ${{ steps.archive-export.outputs.ipa-path }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      # ── Upload IPA artifact ──────────────────────────────────────────────────
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: ios-release-ipa-${{ needs.pre-release-checks.outputs.build-version }}-${{ github.run_number }}
          path: |
            Builds/iOS/Export/${{ inputs.app-name || 'Unity' }}.ipa
            BuildReports/iOS/*.sha256
          retention-days: 90
          if-no-files-found: error

      # ── Upload symbols ───────────────────────────────────────────────────────
      - name: Upload dSYM symbols
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: ios-release-symbols-${{ needs.pre-release-checks.outputs.build-version }}-${{ github.run_number }}
          path: Builds/iOS/Archive/${{ inputs.app-name || 'Unity' }}.xcarchive/dSYMs/
          retention-days: 90
          if-no-files-found: ignore

      # ── Upload logs + reports (always) ───────────────────────────────────────
      - name: Upload iOS logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: ios-release-logs-${{ needs.pre-release-checks.outputs.build-version }}-${{ github.run_number }}
          path: |
            Logs/iOS/Editor.log
            Logs/iOS/xcode-archive.log
            Logs/iOS/xcode-export.log
            Logs/iOS/Editor-activation.log
            BuildReports/iOS/
          retention-days: 30
          if-no-files-found: ignore

      # ── Return Unity license ─────────────────────────────────────────────────
      - name: Return Unity license
        if: always()
        shell: bash
        env:
          UNITY_EDITOR: ${{ steps.unity-install.outputs.unity-editor }}
          LOG_PATH: Logs/iOS
        run: bash scripts/ios/run_unity_ios.sh return-license

      # ── Signing cleanup (ALWAYS — scrubs secrets from runner) ────────────────
      - name: Cleanup signing artifacts
        if: always()
        uses: ./.github/actions/ios-cleanup-signing
        with:
          keychain-path: ${{ steps.signing.outputs.keychain-path }}
          keychain-name: ${{ steps.signing.outputs.keychain-name }}
          profile-path: ${{ steps.signing.outputs.profile-path }}

      # ── Discord notification (if: always — notifies on success AND failure) ──
      - name: Discord notification
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          platform: iOS
          environment: production
          build-version: ${{ needs.pre-release-checks.outputs.build-version }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ─── GITHUB RELEASE ────────────────────────────────────────────────────────────
  create-github-release:
    name: Create GitHub Release
    needs: [pre-release-checks, release-build]
    if: always() && needs.release-build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Download IPA artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444306234ed73cf57f4e8a1b  # v4.1.8
        with:
          pattern: ios-release-ipa-*
          path: release-artifacts/
          merge-multiple: true

      - name: Download reports artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444306234ed73cf57f4e8a1b  # v4.1.8
        with:
          pattern: ios-release-logs-*
          path: release-reports/
          merge-multiple: true

      - name: Generate release notes
        id: release-notes
        shell: bash
        env:
          VERSION: ${{ needs.pre-release-checks.outputs.build-version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [[ -n "${PREV_TAG}" ]]; then
            CHANGES=$(git log --oneline "${PREV_TAG}..HEAD" 2>/dev/null || echo "See commit history")
          else
            CHANGES=$(git log --oneline -20 2>/dev/null || echo "See commit history")
          fi

          cat > release-notes.md << EOF
          ## Unity iOS Release v${VERSION}

          **Platform:** iOS
          **Build Number:** ${{ github.run_number }}
          **Commit:** \`${{ github.sha }}\`

          ### Changes
          ${CHANGES}

          ### Build Info
          - Environment: production
          - Runner: macos-unity-xcode
          - Distribution signing: enabled
          - Clean build: yes
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8  # v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          name: iOS Release v${{ needs.pre-release-checks.outputs.build-version }}
          body_path: release-notes.md
          files: |
            release-artifacts/**/*
            release-reports/**/build-metadata.json
            release-reports/**/*.sha256
          draft: false
          prerelease: ${{ contains(needs.pre-release-checks.outputs.build-version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
