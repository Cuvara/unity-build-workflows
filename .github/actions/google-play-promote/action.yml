name: Google Play Track Promotion
description: >
  Promotes an existing build from one Google Play track to another without re-uploading.
  Supports staged rollout. Uses Fastlane supply.

inputs:
  package-name:
    description: Android package name (e.g., com.company.app)
    required: true
  from-track:
    description: Source track (internal/alpha/beta/production)
    required: true
  to-track:
    description: Destination track (internal/alpha/beta/production)
    required: true
  rollout-fraction:
    description: Rollout fraction 0.0-1.0 (default 1.0 = full rollout)
    required: false
    default: '1.0'
  service-account-json:
    description: Google Play service account JSON (prefer passing via env)
    required: true
  toolkit-path:
    description: Path to the toolkit checkout (contains Gemfile + fastlane/)
    required: false
    default: '.toolkit'

outputs:
  promotion-status:
    description: Result of the promotion
    value: ${{ steps.promote.outputs.promotion-status }}

runs:
  using: composite
  steps:
    - name: Setup Fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ${{ inputs.toolkit-path }}

    - name: Promote track
      id: promote
      shell: bash
      env:
        GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ inputs.service-account-json }}
      run: |
        cd "${{ inputs.toolkit-path }}"
        bundle exec fastlane android promote_track \
          package_name:"${{ inputs.package-name }}" \
          from_track:"${{ inputs.from-track }}" \
          to_track:"${{ inputs.to-track }}" \
          rollout_fraction:"${{ inputs.rollout-fraction }}"
        echo "promotion-status=success" >> "${GITHUB_OUTPUT}"
