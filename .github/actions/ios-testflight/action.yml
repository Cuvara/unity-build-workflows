name: iOS TestFlight Upload
description: >
  Uploads an IPA to TestFlight via Fastlane pilot. Optionally waits for
  build processing to complete. Uses App Store Connect API key authentication.

inputs:
  ipa-path:
    description: Path to the .ipa file to upload
    required: true
  app-store-connect-key-id:
    description: App Store Connect API key ID
    required: true
  app-store-connect-issuer-id:
    description: App Store Connect API issuer ID
    required: true
  app-store-connect-private-key:
    description: App Store Connect API private key (.p8 file content)
    required: true
  wait-for-processing:
    description: If true, wait until build finishes processing after upload
    required: false
    default: 'false'
  app-id:
    description: Apple App ID (numeric, required when wait-for-processing is true)
    required: false
    default: ''
  wait-timeout:
    description: Timeout in seconds for build processing wait (default 1800)
    required: false
    default: '1800'
  toolkit-path:
    description: Path to the toolkit checkout (contains Gemfile + fastlane/)
    required: false
    default: '.toolkit'

outputs:
  upload-status:
    description: Upload result — success or failed
    value: ${{ steps.upload.outputs.upload-status }}

runs:
  using: composite
  steps:
    - name: Setup Fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ${{ inputs.toolkit-path }}

    - name: Upload to TestFlight
      id: upload
      shell: bash
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ inputs.app-store-connect-key-id }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.app-store-connect-issuer-id }}
        APP_STORE_CONNECT_PRIVATE_KEY: ${{ inputs.app-store-connect-private-key }}
      run: |
        cd "${{ inputs.toolkit-path }}"
        bundle exec fastlane ios upload_testflight \
          ipa_path:"${{ inputs.ipa-path }}" \
          app_id:"${{ inputs.app-id }}" \
          wait_for_processing:${{ inputs.wait-for-processing }} \
          timeout:${{ inputs.wait-timeout }}
        echo "upload-status=success" >> "${GITHUB_OUTPUT}"
