name: Pipeline WebGL Release

# Self-contained WebGL release pipeline, the third peer of
# pipeline-android-release.yml and pipeline-ios-release.yml:
#
#   03 Build WebGL → 04 Validate artifact → 05 Deploy staging → 06 Deploy production
#
# The two store pipelines already separated build from publish; WebGL did not
# have a pipeline at all, so "release the web build" meant a hand-run of
# scripts/webgl/deploy_cloudflare_pages.sh against whatever was on someone's
# disk. This gives it the same shape, the same approval boundary and the same
# retry semantics as the store platforms.
#
# Build and deploy are separate concepts here too:
#   * dry-run: true            → 03 + 04 only (Build Only)
#   * start-phase: staging     → deploy a stored artifact without rebuilding
#   * start-phase: production  → promote to production without rebuilding
#
# The production node is gated by the `production` GitHub Environment, so a
# green build never publishes to production on its own.
#
# Nesting depth: orchestrator → this → unity-build-webgl = 3 levels (safe).

on:
  workflow_call:
    inputs:
      toolkit-repo:
        description: >-
          Toolkit repository checked out to .toolkit/ for this workflow's own
          scripts. A step-level `uses: ./…` in a reusable workflow resolves
          against the runner WORKSPACE, which is the caller's repository.
        type: string
        required: false
        default: Cuvara/unity-build-workflows
      toolkit-ref:
        description: Git ref of the toolkit repository to check out.
        type: string
        required: false
        default: main

      # ── Build inputs ──
      build-version:
        type: string
        required: true
      # ── Validation inputs ──
      expected-compression:
        description: >-
          Compression the build is configured to emit (gzip | brotli | none).
          Empty accepts whatever the artifact contains. A mismatch between the
          artifact and the hosting configuration renders as a blank canvas in
          the browser, which is why it is a gate and not a warning.
        type: string
        required: false
        default: ''
      max-size-mb:
        description: Fail the artifact above this total size in MB (0 disables).
        type: number
        required: false
        default: 0

      # ── Release inputs ──
      start-phase:
        description: Phase to start from (validate | staging | production)
        type: string
        required: false
        default: validate
      source-run-id:
        description: >-
          Run ID of the Build / Release run that produced the artifact. Required
          because `actions/download-artifact` only sees the current run by
          default — promotion pulls the binary from another run, which is what
          makes it the same binary QA approved rather than a rebuild.
        type: string
        required: true
      artifact-name:
        description: >-
          Existing artifact to deploy when start-phase is staging/production —
          this is what makes "retry the deploy" not rebuild the player.
        type: string
        required: false
        default: ''
      cloudflare-pages-project:
        description: Cloudflare Pages project name.
        type: string
        required: false
        default: ''
      dry-run:
        description: Build and validate only — no deployment.
        type: boolean
        required: false
        default: false

    secrets:
      # Deploy credentials are checked where they are used. Declaring them
      # required here would make a Build Only run unresolvable in a repository
      # that has no Cloudflare account.
      DISCORD_WEBHOOK_URL:
        description: Discord webhook for the stage-07 release notification. Optional.
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

    outputs:
      artifact-name:
        description: Name of the validated WebGL build artifact.
        value: ${{ inputs.artifact-name }}
      staging-url:
        description: URL of the staging deployment, when one ran.
        value: ${{ jobs.deploy-staging.outputs.url }}
      production-url:
        description: URL of the production deployment, when one ran.
        value: ${{ jobs.deploy-production.outputs.url }}

# No workflow_dispatch here. These are reusable workflows; the dispatch
# surface is the consumer's numbered entry point (20/21/22-release-*.yml),
# which is where a human picks a Release Set to promote. The form that used
# to sit here predated promote-only and never asked for `source-run-id`, so
# running it could only ever fail — a second, divergent form for the same
# pipeline is worse than none.

# The pipeline's stages, declared once. Every job renders this same
# ladder with itself marked, so the run summary grows into a progress
# view while the run is still going — GitHub draws no progress on a
# workflow node, and the graph shows shape without distance.
env:
  PIPELINE_STAGES: |
    04 Verify Release Identity
    04 Validate
    05 Deploy — Staging
    06 Deploy — Production

jobs:
  # ─── 04 — VERIFY RELEASE IDENTITY ───────────────────────────────────────────
  # A filename establishes nothing. This proves the downloaded bytes are the
  # ones the named Release Set produced: same run, same commit, same version,
  # same build number, same SHA-256. It fails closed — a promotion that cannot
  # prove what it is holding must not publish it.
  verify-artifact:
    name: 04 / WebGL / Verify Release Identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Download artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ${{ inputs.artifact-name }}
          path: promoted/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Download release manifest
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: release-manifest
          path: release-set/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Verify release identity and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/common/release_manifest.py verify \
            --manifest             release-set/release-manifest.json \
            --platform             WebGL \
            --artifact-path        promoted \
            --expect-run-id        "${{ inputs.source-run-id }}" \
            --expect-artifact-name "${{ inputs.artifact-name }}" \
            --expect-version       "${{ inputs.build-version }}"

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Release / WebGL
          stages: ${{ env.PIPELINE_STAGES }}
          current: 04 Verify Release Identity
  # ─── 04 — ARTIFACT VALIDATION ───────────────────────────────────────────────

  validate-webgl:
    name: 04 / WebGL / Validate
    needs: [verify-artifact]
    if: |
      !cancelled() &&
      needs.verify-artifact.result == 'success' &&
      inputs.start-phase == 'validate'
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Download build artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ${{ inputs.artifact-name }}
          path: build-artifact/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      # Re-verified here, not just in stage 04. This job downloads the artifact
      # again — a separate fetch — and an approval on an earlier phase is not
      # evidence about the bytes this job is holding. Cheap, and it is the last
      # point at which publishing the wrong binary is still preventable.
      - name: Download release manifest
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: release-manifest
          path: release-set/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Verify release identity and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/common/release_manifest.py verify \
            --manifest             release-set/release-manifest.json \
            --platform             WebGL \
            --artifact-path        build-artifact \
            --expect-run-id        "${{ inputs.source-run-id }}" \
            --expect-artifact-name "${{ inputs.artifact-name }}" \
            --expect-version       "${{ inputs.build-version }}"

      - name: Validate artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          ARGS=(
            --search-root build-artifact
            --report      validation-webgl.json
          )
          if [[ -n "${{ inputs.expected-compression }}" && "${{ inputs.expected-compression }}" != "any" ]]; then
            ARGS+=(--expected-compression "${{ inputs.expected-compression }}")
          fi
          if [[ "${{ inputs.max-size-mb }}" != "0" ]]; then
            ARGS+=(--max-size-mb "${{ inputs.max-size-mb }}")
          fi
          python3 .toolkit/scripts/webgl/validate_webgl_artifact.py "${ARGS[@]}"

      - name: Upload validation report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: validation-report-WebGL
          path: validation-webgl.json
          retention-days: 30

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Release / WebGL
          stages: ${{ env.PIPELINE_STAGES }}
          current: 04 Validate

  # ─── 05 — PUBLISH: STAGING ──────────────────────────────────────────────────
  # Staging is the automated half — it deploys the validated artifact as soon
  # as stage 04 is green. It downloads the stored artifact; it never rebuilds.

  deploy-staging:
    name: 05 / WebGL / Deploy — Staging
    needs: [verify-artifact, validate-webgl]
    if: |
      !cancelled() &&
      needs.verify-artifact.result == 'success' &&
      !inputs.dry-run &&
      (
        (inputs.start-phase == 'validate' && needs.validate-webgl.result == 'success') ||
        inputs.start-phase == 'staging'
      )
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Require deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          MISSING=""
          [[ -z "${CLOUDFLARE_API_TOKEN}" ]]  && MISSING="${MISSING} CLOUDFLARE_API_TOKEN"
          [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]] && MISSING="${MISSING} CLOUDFLARE_ACCOUNT_ID"
          if [[ -n "${MISSING}" ]]; then
            echo "::error title=Missing deploy credentials::Stage 05 needs:${MISSING}. Build and validation (stages 03/04) completed — re-run this job once the secrets exist; the artifact will not be rebuilt."
            exit 1
          fi

      - name: Download validated artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ${{ inputs.artifact-name }}
          path: build-artifact/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      # Re-verified here, not just in stage 04. This job downloads the artifact
      # again — a separate fetch — and an approval on an earlier phase is not
      # evidence about the bytes this job is holding. Cheap, and it is the last
      # point at which publishing the wrong binary is still preventable.
      - name: Download release manifest
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: release-manifest
          path: release-set/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Verify release identity and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/common/release_manifest.py verify \
            --manifest             release-set/release-manifest.json \
            --platform             WebGL \
            --artifact-path        build-artifact \
            --expect-run-id        "${{ inputs.source-run-id }}" \
            --expect-artifact-name "${{ inputs.artifact-name }}" \
            --expect-version       "${{ inputs.build-version }}"

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ inputs.cloudflare-pages-project }}
        shell: bash
        run: |
          set -Eeuo pipefail
          WEB_ROOT=$(dirname "$(find build-artifact -name index.html -print | head -1)")
          bash .toolkit/scripts/webgl/deploy_cloudflare_pages.sh \
            "${WEB_ROOT}" staging "${{ inputs.build-version }}"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### 05 — WebGL Deploy (staging)"
            echo "- **Version:** ${{ inputs.build-version }}"
            echo "- **Artifact:** ${{ inputs.artifact-name }}"
            echo "- **URL:** ${{ steps.deploy.outputs.url || 'n/a' }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Release / WebGL
          stages: ${{ env.PIPELINE_STAGES }}
          current: 05 Deploy — Staging

  # ─── 06 — RELEASE: PRODUCTION ───────────────────────────────────────────────
  # Gated by the `production` GitHub Environment. Add required reviewers there
  # and this node waits for a human before anything reaches the live site — a
  # successful build is never sufficient reason to publish production.

  deploy-production:
    name: 06 / WebGL / Deploy — Production
    needs: [verify-artifact, deploy-staging]
    if: |
      !cancelled() &&
      needs.verify-artifact.result == 'success' &&
      !inputs.dry-run &&
      (
        needs.deploy-staging.result == 'success' ||
        inputs.start-phase == 'production'
      )
    runs-on: ubuntu-latest
    environment: production
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Download validated artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ${{ inputs.artifact-name }}
          path: build-artifact/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      # Re-verified here, not just in stage 04. This job downloads the artifact
      # again — a separate fetch — and an approval on an earlier phase is not
      # evidence about the bytes this job is holding. Cheap, and it is the last
      # point at which publishing the wrong binary is still preventable.
      - name: Download release manifest
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: release-manifest
          path: release-set/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Verify release identity and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/common/release_manifest.py verify \
            --manifest             release-set/release-manifest.json \
            --platform             WebGL \
            --artifact-path        build-artifact \
            --expect-run-id        "${{ inputs.source-run-id }}" \
            --expect-artifact-name "${{ inputs.artifact-name }}" \
            --expect-version       "${{ inputs.build-version }}"

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ inputs.cloudflare-pages-project }}
        shell: bash
        run: |
          set -Eeuo pipefail
          WEB_ROOT=$(dirname "$(find build-artifact -name index.html -print | head -1)")
          bash .toolkit/scripts/webgl/deploy_cloudflare_pages.sh \
            "${WEB_ROOT}" production "${{ inputs.build-version }}"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### 06 — WebGL Deploy (production)"
            echo "- **Version:** ${{ inputs.build-version }}"
            echo "- **Artifact:** ${{ inputs.artifact-name }}"
            echo "- **URL:** ${{ steps.deploy.outputs.url || 'n/a' }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Release / WebGL
          stages: ${{ env.PIPELINE_STAGES }}
          current: 06 Deploy — Production

  # ─── 07 — REPORT & NOTIFY ───────────────────────────────────────────────────
  # The pipeline used to end at stage 06, so a release run produced no report:
  # the only way to see how far a promotion got was to read the graph. This
  # says which phase it reached, or which one stopped it, and posts the same
  # to Discord.

  report:
    name: 07 / WebGL / Report & Notify
    needs: [verify-artifact, validate-webgl, deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Report
        uses: ./.toolkit/.github/actions/release-report
        with:
          platform: WebGL
          destination: hosting / CDN
          build-version: ${{ inputs.build-version }}
          artifact-name: ${{ inputs.artifact-name }}
          start-phase: ${{ inputs.start-phase }}
          dry-run: ${{ inputs.dry-run }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          phases: |
            04 Verify Release Identity=${{ needs.verify-artifact.result }}
            04 Validate=${{ needs.validate-webgl.result }}
            05 Deploy — Staging=${{ needs.deploy-staging.result }}
            06 Deploy — Production=${{ needs.deploy-production.result }}
