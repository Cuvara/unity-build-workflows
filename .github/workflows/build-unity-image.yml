name: Build Unity Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/build-unity-image.yml'
  workflow_dispatch:
    inputs:
      unity-version:
        description: "Unity editor version to bake into the image (e.g., 6000.0.23f1). If omitted, falls back to config/unity-build-defaults.json."
        required: false
        type: string
      image-variant:
        description: Image variant to build
        required: true
        type: choice
        options: [android, webgl, linux]
        default: android
      push-image:
        description: Push the built image to the registry
        required: false
        type: boolean
        default: true
      run-vulnerability-scan:
        description: Run Trivy vulnerability scan after build
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/unity-editor

jobs:
  build-image:
    name: Build ${{ inputs.image-variant || 'all' }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # for SARIF upload

    strategy:
      fail-fast: false
      matrix:
        variant: ${{ inputs.image-variant && fromJson(format('["{0}"]', inputs.image-variant)) || fromJson('["android","webgl","linux"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Unity version
        id: unity-version
        shell: bash
        run: |
          # Precedence:
          #   (a) workflow_dispatch input unity-version if non-empty
          #   (b) .unityVersion from config/unity-build-defaults.json
          #   (c) fail with a clear message naming the config path
          export UNITY_VERSION_INPUT="${{ inputs.unity-version }}"
          VERSION="$(bash scripts/common/resolve_unity_version.sh)"
          if [ -z "$VERSION" ]; then
            echo "::error::No unity-version specified and could not resolve from config/unity-build-defaults.json."
            exit 1
          fi
          echo "unity-version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved Unity version: ${VERSION}"

      - name: Compute lowercase image repo
        id: image-ref
        shell: bash
        run: |
          # Docker registry references must be lowercase — lowercase the owner component
          LOWER_REPO=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=${LOWER_REPO}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-ref.outputs.repo }}
          tags: |
            type=raw,value=${{ steps.unity-version.outputs.unity-version }}-${{ matrix.variant }}
            type=raw,value=${{ steps.unity-version.outputs.unity-version }}-${{ matrix.variant }}-${{ github.run_number }}
          labels: |
            org.opencontainers.image.title=Unity Editor (${{ matrix.variant }})
            org.opencontainers.image.description=Unity ${{ steps.unity-version.outputs.unity-version }} with ${{ matrix.variant }} build support
            unity.version=${{ steps.unity-version.outputs.unity-version }}
            unity.variant=${{ matrix.variant }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/variants/${{ matrix.variant }}.Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UNITY_VERSION=${{ steps.unity-version.outputs.unity-version }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Run validation tests
        id: validate
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-ref.outputs.repo }}:${{ steps.unity-version.outputs.unity-version }}-${{ matrix.variant }}
          UNITY_VERSION: ${{ steps.unity-version.outputs.unity-version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "Running container smoke test for ${IMAGE_TAG}..."
          docker run --rm \
            --entrypoint /bin/bash \
            "$IMAGE_TAG" \
            -c "unity-editor -version && echo 'Unity smoke test passed.'"

          echo "Validating entrypoint script..."
          docker run --rm \
            --entrypoint /bin/bash \
            "$IMAGE_TAG" \
            -c "test -x /usr/local/bin/entrypoint.sh && echo 'Entrypoint OK.'"

          echo "Validating variant: ${VARIANT}"
          case "$VARIANT" in
            android)
              docker run --rm --entrypoint /bin/bash "$IMAGE_TAG" \
                -c "unity-editor -quit -batchmode -nographics -buildTarget Android -version 2>/dev/null && echo 'Android target OK.'"
              ;;
            webgl)
              docker run --rm --entrypoint /bin/bash "$IMAGE_TAG" \
                -c "unity-editor -quit -batchmode -nographics -buildTarget WebGL -version 2>/dev/null && echo 'WebGL target OK.'"
              ;;
            linux)
              docker run --rm --entrypoint /bin/bash "$IMAGE_TAG" \
                -c "unity-editor -quit -batchmode -nographics -buildTarget Linux64 -version 2>/dev/null && echo 'Linux target OK.'"
              ;;
          esac

      # Unity editor images are tens of gigabytes; Trivy's default 5m analysis
      # deadline is not enough for them. `6000.3.9f1-linux` died on exactly that
      # in run #47 — "context deadline exceeded" — and because the scan sits
      # before the push, a timeout meant no image was published at all.
      #
      # Pinned to a release rather than @master: an unpinned third-party action
      # is a supply-chain risk and makes a green run unreproducible.
      - name: Scan for vulnerabilities
        if: inputs.run-vulnerability-scan != false
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image-ref.outputs.repo }}:${{ steps.unity-version.outputs.unity-version }}-${{ matrix.variant }}
          format: sarif
          output: trivy-results-${{ matrix.variant }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 30m

      - name: Upload Trivy SARIF results
        if: inputs.run-vulnerability-scan != false && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.variant }}.sarif
          category: trivy-${{ matrix.variant }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image-ref.outputs.repo }}:${{ steps.unity-version.outputs.unity-version }}-${{ matrix.variant }}
          artifact-name: sbom-${{ matrix.variant }}-${{ steps.unity-version.outputs.unity-version }}.spdx.json
          output-file: sbom-${{ matrix.variant }}.spdx.json

      # Push the image that was just validated and scanned — not a second build
      # of it. The previous implementation invoked build-push-action again with
      # `push: true`, which produced a different image (fresh provenance, fresh
      # timestamps) under the same tags: Trivy and the smoke tests had inspected
      # one artefact and the registry received another, and the mutable tag could
      # end up on a digest nothing in this run had examined.
      - name: Push image to registry
        id: push
        if: inputs.push-image != false
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PRIMARY_TAG: ${{ steps.image-ref.outputs.repo }}:${{ steps.unity-version.outputs.unity-version }}-${{ matrix.variant }}
        run: |
          set -Eeuo pipefail

          # `load: true` on the build step tagged the local image with every tag
          # metadata-action emitted, so each one pushes the same digest.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Pushing ${tag}"
            docker push "$tag"
          done <<< "$TAGS"

          # Resolve the digest from the registry, so what is recorded is what a
          # consumer pulling that tag will actually receive.
          DIGEST="$(docker buildx imagetools inspect "$PRIMARY_TAG" --format '{{.Manifest.Digest}}')"
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not resolve the pushed digest for ${PRIMARY_TAG}."
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed digest: ${DIGEST}"

      # Every tag from this run must resolve to the digest recorded below. This
      # catches the failure that motivated the change: a mutable tag left
      # pointing at an older image while the run reported success.
      - name: Verify every tag resolves to the pushed digest
        if: inputs.push-image != false
        shell: bash
        env:
          TAGS:   ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -Eeuo pipefail
          rc=0
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            actual="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [ "$actual" != "$DIGEST" ]; then
              echo "::error::${tag} resolves to '${actual:-<unresolvable>}', expected ${DIGEST}"
              rc=1
            else
              echo "ok  ${tag} -> ${actual}"
            fi
          done <<< "$TAGS"
          exit $rc

      - name: Publish image manifest
        if: inputs.push-image != false
        shell: bash
        env:
          IMAGE_REPO_LOWER: ${{ steps.image-ref.outputs.repo }}
          UNITY_VERSION: ${{ steps.unity-version.outputs.unity-version }}
          VARIANT: ${{ matrix.variant }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          MANIFEST_FILE="image-manifest-${VARIANT}.json"
          cat > "$MANIFEST_FILE" << EOF
          {
            "unity_version": "${UNITY_VERSION}",
            "variant": "${VARIANT}",
            "registry": "ghcr.io",
            "repository": "${IMAGE_REPO_LOWER}",
            "tag": "${UNITY_VERSION}-${VARIANT}",
            "digest": "${IMAGE_DIGEST}",
            "pinned_reference": "${IMAGE_REPO_LOWER}:${UNITY_VERSION}-${VARIANT}@${IMAGE_DIGEST}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "commit": "${{ github.sha }}"
          }
          EOF
          echo "Image manifest:"
          cat "$MANIFEST_FILE"

      - name: Upload image manifest artifact
        if: inputs.push-image != false
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest-${{ matrix.variant }}-${{ steps.unity-version.outputs.unity-version }}
          path: image-manifest-${{ matrix.variant }}.json
          retention-days: 90
