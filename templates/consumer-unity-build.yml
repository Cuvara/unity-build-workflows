# ──────────────────────────────────────────────────────────────────────────────
# consumer-unity-build.yml — Thin caller template for unity-build-workflows
#
# Copy this file to .github/workflows/unity-build.yml in your project.
# Pinned to @v2 (latest stable v2.x). Use @v2.2.1 for an exact pin, or @main
# for development. Keep `toolkit-ref` below on the SAME ref as `uses`.
#
# Required secrets (set in Settings → Secrets and variables → Actions):
#   UNITY_EMAIL      — Unity account email
#   UNITY_PASSWORD   — Unity account password
#   UNITY_LICENSE    — (optional but recommended) raw .ulf file contents
#
# Optional secrets:
#   DISCORD_WEBHOOK_URL    — Discord channel webhook for build notifications
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASS       — Android release signing (production only)
#
# Building on your own machine instead of GitHub-hosted runners: leave the
# runner inputs blank here and set the RUNNER_TYPE / BUILD_ENGINE /
# RUNNER_LABELS variables, or pass them per run. The self-hosted lane requires
# a PlayerBuilder.Build method in the project — see docs/SELF_HOSTED_ORG_RUNNER.md.
#
# See docs/CONSUMER_SETUP.md for the full onboarding walkthrough.
# ──────────────────────────────────────────────────────────────────────────────

name: Unity Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform(s) to build"
        required: false
        default: All
        type: choice
        options: [All, Android, WebGL, Linux64, LinuxServer, Windows64, iOS]

      environment:
        description: "Build environment"
        required: false
        default: production
        type: choice
        options: [development, staging, production]

      run-tests:
        description: "Run EditMode/PlayMode tests before building"
        required: false
        default: false
        type: boolean

      test-mode:
        description: "Test suite (only when run-tests=true)"
        required: false
        default: All
        type: choice
        options: [EditMode, PlayMode, All]

      build-addressables:
        description: "Run Addressable build pipeline before platform builds"
        required: false
        default: false
        type: boolean

      activation-strategy:
        description: "Unity license activation strategy (docker lane only)"
        required: false
        default: auto
        type: choice
        options: [auto, manual-license, account, serial, preactivated, none]

      runner-mode:
        description: "Legacy single-axis lane selector (prefer runner-type + build-engine below)"
        required: false
        default: docker
        type: choice
        options: [docker, self-hosted-windows, self-hosted-macos, auto]

      runner-type:
        description: "WHERE the job runs (blank = repo/org variable RUNNER_TYPE, else github-hosted)"
        required: false
        default: ''
        type: choice
        options: ['', github-hosted, self-hosted]

      build-engine:
        description: "HOW Unity builds (blank = repo/org variable BUILD_ENGINE, else docker)"
        required: false
        default: ''
        type: choice
        options: ['', docker, local]

      runner-labels:
        description: "Comma-separated runs-on labels for a self-hosted runner, e.g. self-hosted,windows"
        required: false
        default: ''
        type: string

      unity-version:
        description: "Override Unity version (leave blank to read from ProjectVersion.txt)"
        required: false
        default: ''
        type: string

      clean-build:
        description: "Clean Library cache before building. auto = use the BUILD_CLEAN repo variable"
        required: false
        default: auto
        type: choice
        options: [auto, 'true', 'false']

      android-export:
        description: "Android output: apk (installable) or aab (Play Store bundle)"
        required: false
        default: apk
        type: choice
        options: [apk, aab]

  push:
    branches:
      - develop
      - staging
      - 'release-*'

  pull_request:
    branches:
      - develop
      - staging
      - 'release-*'

# Cancel in-progress runs on the same branch when a new commit is pushed.
# workflow_dispatch runs are not cancelled (each manual trigger is intentional).
concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  pipeline:
    name: Unity Pipeline
    # Pin the toolkit version. Recommended:
    #   @v2          — latest stable v2.x (gets backward-compatible fixes)   ← production default
    #   @v2.2.1      — exact release (fully reproducible)
    #   @main        — bleeding edge (development only; may break)
    uses: Cuvara/unity-build-workflows/.github/workflows/unity-pipeline.yml@v2
    secrets: inherit
    with:
      # ── Dispatch inputs (fall back to sensible defaults for push/PR events) ──
      platform:             ${{ inputs.platform            || 'All' }}
      environment:          ${{ inputs.environment         || 'production' }}
      run-tests:            ${{ inputs.run-tests           || false }}
      test-mode:            ${{ inputs.test-mode           || 'All' }}
      build-addressables:   ${{ inputs.build-addressables  || false }}
      activation-strategy:  ${{ inputs.activation-strategy || 'auto' }}
      runner-mode:          ${{ inputs.runner-mode         || 'docker' }}
      runner-type:          ${{ inputs.runner-type         || '' }}
      build-engine:         ${{ inputs.build-engine        || '' }}
      runner-labels:        ${{ inputs.runner-labels       || '' }}
      unity-version:        ${{ inputs.unity-version       || '' }}
      clean-build:          ${{ inputs.clean-build         || 'auto' }}
      android-export:       ${{ inputs.android-export      || 'apk' }}

      # ── Fixed per-project values ───────────────────────────────────────────
      project-path: '.'
      toolkit-ref:  'v2'   # MUST match the @ref above (use 'v2.2.1' for exact pin; 'main' for dev)
