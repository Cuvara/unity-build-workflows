name: Unity Pipeline (Reusable)

# Drop-in reusable: ports ALL orchestration jobs from the consumer workflow.
# Callers get the full resolve-config → validate → tests → builds → report
# → discord flow by referencing this file with workflow_call.
#
# Nesting depth: caller → unity-pipeline → reusable-build-platform = 3 (max 4 ✓)
#
# Architecture: see docs/EXPLICIT_PLATFORM_FLOW_SPEC.md
# Branch flow:  see docs/BRANCH_FLOW_CONTRACT.md
# Activation:   see docs/UNITY_PERSONAL_DOCKER_LICENSE.md

on:
  workflow_call:
    inputs:
      # ── Toolkit location ──────────────────────────────────────────────────
      project-path:
        description: "Path to the Unity project root relative to the workspace root."
        required: false
        default: '.'
        type: string

      submodule-auth:
        description: >-
          How git submodules are authenticated: 'token' (default) lets
          actions/checkout fetch them with GITHUB_TOKEN, 'ssh' fetches them in a
          separate step over SSH. Use 'ssh' when a submodule is a private
          repository in another organization — GITHUB_TOKEN cannot see it, and
          git reports it as "not found".
        required: false
        default: token
        type: string

      toolkit-repo:
        description: "Toolkit repository (owner/repo) for resolve_build_flow.sh."
        required: false
        default: 'Cuvara/unity-build-workflows'
        type: string

      toolkit-ref:
        description: "Git ref of the toolkit repo (branch, tag, SHA)."
        required: false
        default: 'main'
        type: string

      # ── Pass-through: mirror of workflow_dispatch inputs ─────────────────
      ios-export-method:
        description: >-
          iOS export method for the production signing stage
          (app-store | ad-hoc | enterprise | development).
        required: false
        default: app-store
        type: string

      ios-app-name:
        description: Application name used for the .xcarchive and .ipa filenames.
        required: false
        default: Unity
        type: string

      build-type:
        description: >-
          development | release. This is NOT the same axis as `environment`.
          It selects the artifact shape and, critically, the artifact NAMES:
          `development-android-apk` versus `release-android-aab`. A release
          build is not a development build with environment=production — it
          produces store-shaped, signed output, and its artifacts must never be
          mistakable for a dev build's.
          Empty derives it from `environment` for backward compatibility.
        required: false
        default: ''
        type: string

      platform:
        description: "Target platform(s): All | Android | WebGL | Linux64 | LinuxServer | iOS"
        required: false
        default: 'All'
        type: string

      environment:
        description: "Build environment: production | staging | development"
        required: false
        default: 'production'
        type: string

      run-tests:
        description: "Run EditMode/PlayMode tests before building."
        required: false
        default: false
        type: boolean

      test-mode:
        description: "Test suite: EditMode | PlayMode | All"
        required: false
        default: 'All'
        type: string

      build-addressables:
        description: "Run Addressable build pipeline before platform builds."
        required: false
        default: false
        type: boolean

      activation-strategy:
        description: "Unity license activation strategy (docker lane only): auto | manual-license | account | serial | preactivated | none"
        required: false
        default: 'auto'
        type: string

      runner-mode:
        description: "Execution lane: docker | self-hosted-windows | auto"
        required: false
        default: 'docker'
        type: string

      runner-type:
        description: "WHERE the job runs: github-hosted | self-hosted (blank = resolver default/legacy mapping)."
        required: false
        default: ''
        type: string

      build-engine:
        description: "HOW Unity builds: docker | local (blank = resolver default/legacy mapping)."
        required: false
        default: ''
        type: string

      runner-labels:
        description: "Comma-separated runs-on labels (blank = resolver-derived from runner-type)."
        required: false
        default: ''
        type: string

      runner-policy:
        description: >-
          Runner scheduling for this run: 'auto' (default) applies the repository's
          runner policy (RUNNER_POLICY variable or .github/unity-runner-policy.json)
          when one exists, and the legacy RUNNER_* resolution otherwise; 'legacy'
          ignores the policy for this run. A non-empty runner-labels input always
          wins over both. See docs/MULTI_RUNNER_SCHEDULING.md.
        required: false
        default: 'auto'
        type: string

      unity-version:
        description: "Override Unity version (blank = use ProjectSettings/ProjectVersion.txt)."
        required: false
        default: ''
        type: string

      clean-build:
        description: "auto|true|false — Force clean Library cache before building (auto = use BUILD_CLEAN variable)."
        required: false
        default: 'auto'
        type: string

      cache-library:
        description: >-
          auto|true|false — Restore and save Unity's Library folder through the
          GitHub Actions cache for this run (auto = use the CACHE_LIBRARY_ENABLED
          variable, default true). 'false' skips the download entirely, which
          is usually faster on a self-hosted runner whose cache download is
          slow or times out.
        required: false
        default: 'auto'
        type: string

      build-profiles:
        description: >-
          Unity Build Profile per platform, as comma-separated Platform=Profile
          pairs, e.g. 'Android=Android-Staging,iOS=iOS-dev'. Profile is the
          asset name in Assets/Settings/Build Profiles (or a project-relative
          .asset path). A platform not listed, or set to ProjectSettings, builds
          with the project's own Player Settings (the behaviour before this
          input existed). Applied by the toolkit's PlayerBuilder on the
          self-hosted native and Windows-docker lanes.
        required: false
        default: ''
        type: string

      android-export:
        description: >-
          DEPRECATED and no longer required. The Android output format is a
          consequence of the lifecycle — development builds an APK, release
          builds the App Bundle Google Play requires — so there is nothing to
          choose. Kept for workflow_call compatibility: pass it and it is
          checked against the lifecycle, and the call fails if they disagree.
          Leave it blank.
        required: false
        default: ''
        type: string

      define-symbols:
        description: |
          Manual-dispatch extra Scripting Define Symbols (';' or ',' separated),
          applied additively at build time. For automatic push/PR builds the
          symbols come from the per-branch *_DEFINE_SYMBOLS repository variables
          instead; this input only applies to workflow_dispatch (e.g. iOS builds,
          which are manual-only).
        required: false
        default: ''
        type: string

    secrets:
      # iOS production signing runs in this lane now (stage 03b), so the
      # distribution credentials belong here. Optional: a pipeline that never
      # builds a release iOS artifact must not require them.
      IOS_DISTRIBUTION_CERTIFICATE_BASE64:
        description: Base64 .p12 distribution certificate for stage 03b.
        required: false
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:
        description: Password for the distribution certificate.
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        description: Base64 provisioning profile for stage 03b.
        required: false
      UNITY_LICENSE:
        description: "Raw .ulf file contents. Optional — docker lane personal activation."
        required: false
      UNITY_EMAIL:
        description: "Unity account email. Optional — docker lane activation."
        required: false
      UNITY_PASSWORD:
        description: "Unity account password. Optional — docker lane activation."
        required: false
      DISCORD_WEBHOOK_URL:
        description: "Discord webhook URL for build notifications. Optional — no-op when absent."
        required: false
      SUBMODULE_SSH_KEY:
        description: >-
          Private SSH key for fetching submodules when submodule-auth is 'ssh'.
          Optional — falls back to the runner's own SSH credentials, which a
          self-hosted runner usually already has.
        required: false
      ANDROID_KEYSTORE_PASS:
        description: >-
          Password of the project's own Android keystore (Player Settings >
          Publishing Settings > Custom Keystore). Native (build-engine=local)
          lanes only: Unity never stores keystore passwords in the project, so a
          batchmode build of a project with a custom keystore cannot sign
          without it. Optional — unused when the project has no custom keystore.
        required: false
      ANDROID_KEY_PASS:
        description: >-
          Password of the key alias in that keystore. Optional — defaults to
          ANDROID_KEYSTORE_PASS when unset.
        required: false

      RUNNER_STATUS_TOKEN:
        description: >-
          Read-only token the runner scheduler uses to see which self-hosted
          runners are online and busy (repository: Administration read;
          organization runners and groups: Self-hosted runners read). Optional:
          without it a runner policy still schedules, with availability
          'unknown'. GITHUB_TOKEN cannot read runner status. See
          docs/MULTI_RUNNER_SCHEDULING.md.
        required: false
      R2_ACCESS_KEY_ID:
        description: >-
          Cloudflare R2 access key, used only when BUILD_DELIVERY=r2. Optional:
          a project that does not publish builds still builds them.
        required: false
      R2_SECRET_ACCESS_KEY:
        description: Cloudflare R2 secret key, used only when BUILD_DELIVERY=r2.
        required: false
      FIREBASE_SERVICE_ACCOUNT_JSON:
        description: >-
          Google service account key JSON with Firebase App Distribution Admin
          role. Used only when BUILD_DELIVERY=firebase. Optional: a project
          that does not use Firebase still builds normally.
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        description: >-
          Google Play service account JSON. Used for Fastlane direct-to-store
          upload when ARTIFACT_STORAGE=firebase. Also used by release pipelines.
        required: false
      APP_STORE_CONNECT_KEY_ID:
        description: App Store Connect API key ID for Fastlane iOS upload.
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        description: App Store Connect API issuer ID for Fastlane iOS upload.
        required: false
      APP_STORE_CONNECT_PRIVATE_KEY:
        description: App Store Connect API private key (.p8) for Fastlane iOS upload.
        required: false

# The pipeline's stages, declared once. Every job renders this same ladder with
# itself marked, so the run summary grows into a progress view while the run is
# still going — GitHub draws no progress on a workflow node, and the graph
# shows shape without distance.
env:
  PIPELINE_STAGES: |
    01 Prepare
    02 Quality Gate
    03 Build
    03b Sign iOS
    04 Validate
    05 Release Manifest
    07 Report

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 0: select-environment
  # ════════════════════════════════════════════════════════════════════════════
  # Picks the GitHub Environment (development | staging | production) before
  # resolve-config starts, so resolve-config can declare it. A job only sees an
  # environment's variables when it declares that environment, and `vars.X`
  # then yields the environment value, else the repository value. That is what
  # lets one generic name -- BUILD_PLATFORMS, TEST_ENABLED, ... -- replace the
  # per-branch BUILD_DEVELOP_PLATFORMS / BUILD_STAGING_PLATFORMS / ... family.
  # Same resolver, same answer as the build job's secrets-environment: empty
  # for pull requests and when BUILD_ENVIRONMENT_SECRETS=false.
  # docs/ENVIRONMENT_VARIABLES.md
  select-environment:
    name: Select Environment
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.select.outputs.secrets-environment }}
    steps:
      - name: Checkout toolkit (for resolve_build_flow.sh)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref:        ${{ inputs.toolkit-ref }}
          path:       .toolkit
          sparse-checkout: |
            scripts/common
            config
          sparse-checkout-cone-mode: true

      - name: Select environment
        id: select
        shell: bash
        env:
          EVENT_NAME:            ${{ github.event_name }}
          REF_NAME:              ${{ github.ref_name }}
          BASE_REF:              ${{ github.base_ref }}
          IN_PLATFORM:           ${{ inputs.platform || '' }}
          IN_ENVIRONMENT:        ${{ inputs.environment || '' }}
          IN_RUN_TESTS:          ${{ inputs.run-tests || '' }}
          IN_TEST_MODE:          ${{ inputs.test-mode || '' }}
          IN_BUILD_ADDRESSABLES: ${{ inputs.build-addressables || '' }}
          IN_BUILD_TYPE:         ${{ inputs.build-type || '' }}
          # Repository level only: this job has no environment yet.
          # The capability gate rejects a dispatch the project cannot build
          # here already, as it would in resolve-config.
          PLATFORMS:             ${{ vars.PLATFORMS || '' }}
          NEW_PLATFORMS:         ${{ vars.BUILD_PLATFORMS_ENABLED || '' }}
          NEW_BUILD_ENVIRONMENT_SECRETS: ${{ vars.BUILD_ENVIRONMENT_SECRETS }}
        run: |
          set -euo pipefail
          # Only secrets-environment is used. Platform lists and toggles are
          # resolved again in resolve-config, with the environment's variables.
          bash .toolkit/scripts/common/resolve_build_flow.sh > /dev/null
          grep '^secrets-environment=' "$GITHUB_OUTPUT" || echo "secrets-environment=<none>"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: resolve-config
  # ════════════════════════════════════════════════════════════════════════════
  resolve-config:
    name: Resolve Build Config
    needs: [select-environment]
    runs-on: ubuntu-latest
    # Declaring the environment makes every vars.* below resolve to the
    # environment's value first (BUILD_PLATFORMS, BUILD_NUMBER_OFFSET, ...).
    # Empty (pull requests, BUILD_ENVIRONMENT_SECRETS=false) = repository only.
    environment: ${{ needs.select-environment.outputs.name }}
    outputs:
      # ── Unity / project ────────────────────────────────────────────────────
      unity-version:      ${{ steps.version.outputs.version }}
      project-path:       ${{ steps.version.outputs.project-path }}
      toolkit-ref:        ${{ steps.version.outputs.toolkit-ref }}
      # ── Flow resolver outputs ───────────────────────────────────────────────
      flow-type:          ${{ steps.flow.outputs.flow-type }}
      environment:        ${{ steps.flow.outputs.environment }}
      gh-environment:     ${{ steps.flow.outputs.gh-environment }}
      secrets-environment: ${{ steps.flow.outputs.secrets-environment }}
      run-tests:          ${{ steps.flow.outputs.run-tests }}
      test-mode:          ${{ steps.flow.outputs.test-mode }}
      build-addressables: ${{ steps.flow.outputs.build-addressables }}
      build-android:      ${{ steps.flow.outputs.build-android }}
      build-webgl:        ${{ steps.flow.outputs.build-webgl }}
      build-linux64:      ${{ steps.flow.outputs.build-linux64 }}
      build-linuxserver:  ${{ steps.flow.outputs.build-linuxserver }}
      build-windows64:    ${{ steps.flow.outputs.build-windows64 }}
      build-ios:          ${{ steps.flow.outputs.build-ios }}
      signing:            ${{ steps.flow.outputs.signing }}
      platform-source:    ${{ steps.flow.outputs.platform-source }}
      define-symbols:     ${{ steps.flow.outputs.define-symbols }}
      # ── New grouped config resolver outputs ─────────────────────────────────
      build-method:            ${{ steps.flow.outputs.build-method }}
      build-timeout-minutes:   ${{ steps.flow.outputs.build-timeout-minutes }}
      clean-build:             ${{ steps.flow.outputs.clean-build }}
      clean-build-source:      ${{ steps.flow.outputs.clean-build-source }}
      test-editmode:           ${{ steps.flow.outputs.test-editmode }}
      test-playmode:           ${{ steps.flow.outputs.test-playmode }}
      test-fail-fast:          ${{ steps.flow.outputs.test-fail-fast }}
      runner-mode:             ${{ steps.flow.outputs.runner-mode }}
      runner-windows-label:    ${{ steps.flow.outputs.runner-windows-label }}
      runner-macos-label:      ${{ steps.flow.outputs.runner-macos-label }}
      runner-linux-label:      ${{ steps.flow.outputs.runner-linux-label }}
      # ── Runner / Build-Engine separation (V2) ───────────────────────────────
      runner-type:             ${{ steps.flow.outputs.runner-type }}
      build-engine:            ${{ steps.flow.outputs.build-engine }}
      execution-strategy:      ${{ steps.flow.outputs.execution-strategy }}
      runner-labels:           ${{ steps.flow.outputs.runner-labels }}
      runner-labels-csv:       ${{ steps.flow.outputs.runner-labels-csv }}
      # One row per selected platform: where it lands and which tier decided.
      runner-plan:             ${{ steps.flow.outputs.runner-plan }}
      runner-labels-by-platform: ${{ steps.flow.outputs.runner-labels-by-platform }}
      runner-labels-linux:     ${{ steps.flow.outputs.runner-labels-linux }}
      runner-labels-ios:       ${{ steps.flow.outputs.runner-labels-ios }}
      # ── Runner selection (ADR 004 stage 2c) — the single source of truth ───
      # Every Unity job's runs-on, engine and the reason for both. The three
      # values below it are serializations of the same document.
      runner-selection:        ${{ steps.runners.outputs.runner-selection }}
      uses-docker:             ${{ steps.runners.outputs.uses-docker }}
      runs-on-unitytests:      ${{ steps.runners.outputs.runs-on-unitytests }}
      runs-on-addressables:    ${{ steps.runners.outputs.runs-on-addressables }}
      activation-strategy:     ${{ steps.flow.outputs.activation-strategy }}
      cache-library:           ${{ steps.flow.outputs.cache-library }}
      cache-gradle:            ${{ steps.flow.outputs.cache-gradle }}
      cache-addressables:      ${{ steps.flow.outputs.cache-addressables }}
      cache-nuget:             ${{ steps.flow.outputs.cache-nuget }}
      artifact-retention-days: ${{ steps.matrix.outputs.retention-days }}
      log-retention-days:      ${{ steps.matrix.outputs.log-retention-days }}
      artifact-compression:    ${{ steps.flow.outputs.artifact-compression }}
      # ── Project metadata (extract_project_metadata.sh) ─────────────────────
      product-name:       ${{ steps.meta.outputs.product-name }}
      app-version:        ${{ steps.meta.outputs.app-version }}
      bundle-id:          ${{ steps.meta.outputs.bundle-id-android }}
      scripting-backend:  ${{ steps.meta.outputs.scripting-backend }}
      android-arch:       ${{ steps.meta.outputs.android-arch }}
      orientation:        ${{ steps.meta.outputs.orientation }}
      store-link:         ${{ steps.meta.outputs.store-link-android }}
      android-export-type: ${{ steps.flow.outputs.android-export-type }}
      define-symbols-count: ${{ steps.meta.outputs.define-symbols-count }}
      bundle-id-ios:      ${{ steps.meta.outputs.bundle-id-ios }}
      define-symbols-count-ios: ${{ steps.meta.outputs.define-symbols-count-ios }}
      # ── Build matrix + node display labels (stages 03/04) ──────────────────
      configuration:          ${{ steps.matrix.outputs.configuration }}
      build-number:           ${{ steps.matrix.outputs.build-number }}
      sign-ios:               ${{ steps.matrix.outputs.sign-ios }}
      ipa-artifact-name:      ${{ steps.matrix.outputs.ipa-artifact-name }}
      build-type:             ${{ steps.matrix.outputs.build-type }}
      planned-platforms:      ${{ steps.matrix.outputs.planned-platforms }}
      build-type-label:       ${{ steps.matrix.outputs.build-type-label }}
      android-artifact-type:  ${{ steps.matrix.outputs.android-artifact-type }}
      label-addressables:     ${{ steps.matrix.outputs.label-addressables }}
      build-matrix:           ${{ steps.matrix.outputs.build-matrix }}
      validate-matrix:        ${{ steps.matrix.outputs.validate-matrix }}
      sign-matrix:            ${{ steps.matrix.outputs.sign-matrix }}
      has-builds:             ${{ steps.matrix.outputs.has-builds }}
      has-validations:        ${{ steps.matrix.outputs.has-validations }}
      has-sign-ops:           ${{ steps.matrix.outputs.has-sign-ops }}
      # ── Discord routing (read by notify-discord) ─────────────────────────────
      discord-thread-id:           ${{ steps.discord.outputs.thread-id }}
      discord-platform-thread-ids: ${{ steps.discord.outputs.platform-thread-ids }}
    steps:
      - name: Checkout (shallow — only needs ProjectVersion.txt)
        uses: actions/checkout@v4
        with:
          # `project-path` may be '.' (project at the repo root) or a subdirectory,
          # and the next step reads "${PROJECT_PATH}/ProjectSettings/ProjectVersion.txt".
          # A non-cone pattern containing a slash is anchored to the repo root, so the
          # bare 'ProjectSettings/...' pattern checked out nothing for a project in a
          # subdirectory and the resolve step failed. A leading '**/' matches the file
          # at any depth, the repo root included, which covers every project-path.
          # ProjectSettings.asset is here for the metadata step below, which
          # reads bundleVersion. Without it the extractor took its
          # "file not found" path, emitted an empty app-version, and the
          # Release Set was written with no version at all — so a promotion's
          # --expect-version had nothing to compare against and passed
          # vacuously. Identity fields must be present, not merely checked.
          # The runner policy is read here too: runner selection happens in this
          # job, before any build job exists to be scheduled.
          sparse-checkout: |
            **/ProjectSettings/ProjectVersion.txt
            **/ProjectSettings/ProjectSettings.asset
            ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
            ${{ vars.DISCORD_CONFIG_FILE || '.github/discord.json' }}
          sparse-checkout-cone-mode: false

      - name: Resolve Unity version
        id: version
        shell: bash
        env:
          # Explicit pin: dispatch input > UNITY_VERSION repo variable. Either is
          # OPTIONAL and is validated against ProjectVersion.txt (the SSOT) below —
          # a mismatch fails the build, so the pin can only confirm, never override.
          OVERRIDE:     ${{ inputs.unity-version || vars.UNITY_VERSION }}
          PROJECT_PATH: ${{ inputs.project-path }}
          TOOLKIT_REF:  ${{ inputs.toolkit-ref }}
        run: |
          set -euo pipefail
          PV="${PROJECT_PATH%/}/ProjectSettings/ProjectVersion.txt"
          if [ ! -f "$PV" ]; then
            echo "::error::ProjectVersion.txt not found at ${PV}"
            exit 1
          fi
          # Unity on Windows writes ProjectVersion.txt with CRLF, so awk's field
          # keeps a trailing CR. Strip it, or the comparison below rejects two
          # versions that print identically.
          PROJECT_VERSION=$(grep '^m_EditorVersion:' "$PV" | awk '{print $2}' | tr -d '\r')
          echo "Project Unity version (SSOT): ${PROJECT_VERSION}"
          if [ -n "${OVERRIDE}" ] && [ "${OVERRIDE}" != "${PROJECT_VERSION}" ]; then
            echo "::error::Unity version mismatch:"
            echo "::error::  ProjectVersion.txt: ${PROJECT_VERSION}"
            echo "::error::  Pin (input/UNITY_VERSION var): ${OVERRIDE}"
            echo "::error::ProjectVersion.txt is the source of truth. Either update it to change the Unity version, or fix the UNITY_VERSION repository variable / unity-version input to match."
            exit 1
          fi
          RESOLVED="${OVERRIDE:-${PROJECT_VERSION}}"
          echo "version=${RESOLVED}"          >> "$GITHUB_OUTPUT"
          echo "project-path=${PROJECT_PATH}" >> "$GITHUB_OUTPUT"
          echo "toolkit-ref=${TOOLKIT_REF}"   >> "$GITHUB_OUTPUT"
          echo "Resolved: version=${RESOLVED} project-path=${PROJECT_PATH} toolkit-ref=${TOOLKIT_REF}"

      - name: Checkout toolkit (for resolve_build_flow.sh)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref:        ${{ inputs.toolkit-ref }}
          path:       .toolkit

      - name: Extract project metadata
        id: meta
        continue-on-error: true
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set +e
          bash .toolkit/scripts/common/extract_project_metadata.sh || true

      - name: Resolve build flow
        id: flow
        shell: bash
        env:
          EVENT_NAME:            ${{ github.event_name }}
          REF_NAME:              ${{ github.ref_name }}
          BASE_REF:              ${{ github.base_ref }}
          IN_PLATFORM:           ${{ inputs.platform || '' }}
          IN_ENVIRONMENT:        ${{ inputs.environment || '' }}
          IN_RUN_TESTS:          ${{ inputs.run-tests || '' }}
          IN_TEST_MODE:          ${{ inputs.test-mode || '' }}
          IN_BUILD_ADDRESSABLES: ${{ inputs.build-addressables || '' }}
          IN_BUILD_TYPE:         ${{ inputs.build-type || '' }}
          # Kept for workflow_call compatibility. It no longer selects the
          # format — the lifecycle does — but a caller that states one gets it
          # validated rather than ignored.
          IN_ANDROID_EXPORT:     ${{ inputs.android-export || '' }}
          IN_DEFINE_SYMBOLS:     ${{ inputs.define-symbols || '' }}
          # ── Platform capability (I-013/I-014) ──────────────────────────────
          # Which platforms this PROJECT can build at all — a different
          # question from which ones a branch builds. Unset means all, so
          # existing projects are unaffected. Without this line the resolver
          # never saw the variable and the capability gate was inert: a
          # project declaring Android,WebGL still built Windows64 on request.
          PLATFORMS:                       ${{ vars.PLATFORMS || '' }}
          NEW_PLATFORMS:                   ${{ vars.BUILD_PLATFORMS_ENABLED || '' }}
          # ── Repository Variables (optional platform/config overrides) ──────
          VAR_DEVELOP_BUILD_PLATFORMS:     ${{ vars.DEVELOP_BUILD_PLATFORMS || '' }}
          VAR_STAGING_BUILD_PLATFORMS:     ${{ vars.STAGING_BUILD_PLATFORMS || '' }}
          VAR_RELEASE_BUILD_PLATFORMS:     ${{ vars.RELEASE_BUILD_PLATFORMS || '' }}
          VAR_DEVELOP_RUN_TESTS:          ${{ vars.DEVELOP_RUN_TESTS || '' }}
          VAR_STAGING_RUN_TESTS:          ${{ vars.STAGING_RUN_TESTS || '' }}
          VAR_RELEASE_RUN_TESTS:          ${{ vars.RELEASE_RUN_TESTS || '' }}
          VAR_DEVELOP_BUILD_ADDRESSABLES: ${{ vars.DEVELOP_BUILD_ADDRESSABLES || '' }}
          VAR_STAGING_BUILD_ADDRESSABLES: ${{ vars.STAGING_BUILD_ADDRESSABLES || '' }}
          VAR_RELEASE_BUILD_ADDRESSABLES: ${{ vars.RELEASE_BUILD_ADDRESSABLES || '' }}
          VAR_DEFAULT_RUNNER_MODE:        ${{ vars.DEFAULT_RUNNER_MODE || '' }}
          VAR_DEVELOP_DEFINE_SYMBOLS:     ${{ vars.DEVELOP_DEFINE_SYMBOLS || '' }}
          VAR_STAGING_DEFINE_SYMBOLS:     ${{ vars.STAGING_DEFINE_SYMBOLS || '' }}
          VAR_RELEASE_DEFINE_SYMBOLS:     ${{ vars.RELEASE_DEFINE_SYMBOLS || '' }}
          # ── Environment-scoped generic names (win over per-branch names) ───
          # Set once per GitHub Environment; this job declares it, so vars.X
          # is the environment value, else the repository value.
          # docs/ENVIRONMENT_VARIABLES.md
          NEW_ENV_BUILD_PLATFORMS:      ${{ vars.BUILD_PLATFORMS }}
          NEW_ENV_TEST_ENABLED:         ${{ vars.TEST_ENABLED }}
          NEW_ENV_ADDRESSABLES_ENABLED: ${{ vars.ADDRESSABLES_ENABLED }}
          NEW_ENV_UNITY_DEFINE_SYMBOLS: ${{ vars.UNITY_DEFINE_SYMBOLS }}
          # ── New grouped Repository Variables (New > Legacy > Default) ──────
          NEW_BUILD_DEVELOP_PLATFORMS:  ${{ vars.BUILD_DEVELOP_PLATFORMS }}
          NEW_BUILD_STAGING_PLATFORMS:  ${{ vars.BUILD_STAGING_PLATFORMS }}
          NEW_BUILD_RELEASE_PLATFORMS:  ${{ vars.BUILD_RELEASE_PLATFORMS }}
          NEW_TEST_DEVELOP_ENABLED:     ${{ vars.TEST_DEVELOP_ENABLED }}
          NEW_TEST_STAGING_ENABLED:     ${{ vars.TEST_STAGING_ENABLED }}
          NEW_TEST_RELEASE_ENABLED:     ${{ vars.TEST_RELEASE_ENABLED }}
          NEW_ADDRESSABLES_DEVELOP_ENABLED: ${{ vars.ADDRESSABLES_DEVELOP_ENABLED }}
          NEW_ADDRESSABLES_STAGING_ENABLED: ${{ vars.ADDRESSABLES_STAGING_ENABLED }}
          NEW_ADDRESSABLES_RELEASE_ENABLED: ${{ vars.ADDRESSABLES_RELEASE_ENABLED }}
          NEW_DEVELOP_DEFINE_SYMBOLS:   ${{ vars.UNITY_DEVELOP_DEFINE_SYMBOLS }}
          NEW_STAGING_DEFINE_SYMBOLS:   ${{ vars.UNITY_STAGING_DEFINE_SYMBOLS }}
          NEW_RELEASE_DEFINE_SYMBOLS:   ${{ vars.UNITY_RELEASE_DEFINE_SYMBOLS }}
          # UNITY_VERSION / UNITY_PROJECT_PATH are NOT wired as repo variables:
          # Unity version SSOT is ProjectSettings/ProjectVersion.txt; project path
          # is set by the caller (the project-path input). Both would be redundant.
          NEW_UNITY_BUILD_METHOD:       ${{ vars.UNITY_BUILD_METHOD }}
          NEW_BUILD_TIMEOUT_MINUTES:    ${{ vars.BUILD_TIMEOUT_MINUTES }}
          NEW_BUILD_CLEAN:              ${{ vars.BUILD_CLEAN }}
          NEW_BUILD_ENVIRONMENT_SECRETS: ${{ vars.BUILD_ENVIRONMENT_SECRETS }}
          NEW_BUILD_IOS_SIGN_DEVELOPMENT: ${{ vars.BUILD_IOS_SIGN_DEVELOPMENT }}
          NEW_TEST_EDITMODE_ENABLED:    ${{ vars.TEST_EDITMODE_ENABLED }}
          NEW_TEST_PLAYMODE_ENABLED:    ${{ vars.TEST_PLAYMODE_ENABLED }}
          NEW_TEST_FAIL_FAST:           ${{ vars.TEST_FAIL_FAST }}
          NEW_RUNNER_DEFAULT_MODE:      ${{ vars.RUNNER_DEFAULT_MODE }}
          NEW_RUNNER_WINDOWS_LABEL:     ${{ vars.RUNNER_WINDOWS_LABEL }}
          NEW_RUNNER_MACOS_LABEL:       ${{ vars.RUNNER_MACOS_LABEL }}
          NEW_RUNNER_LINUX_LABEL:       ${{ vars.RUNNER_LINUX_LABEL }}
          # ── Runner / Build-Engine separation (V2) ───────────────────────────
          NEW_RUNNER_TYPE:              ${{ vars.RUNNER_TYPE }}
          NEW_BUILD_ENGINE:             ${{ vars.BUILD_ENGINE }}
          NEW_RUNNER_LABELS:            ${{ vars.RUNNER_LABELS }}
          IN_RUNNER_TYPE:               ${{ inputs.runner-type }}
          IN_BUILD_ENGINE:              ${{ inputs.build-engine }}
          IN_RUNNER_LABELS:             ${{ inputs.runner-labels }}
          IN_ACTIVATION_STRATEGY:       ${{ inputs.activation-strategy }}
          # Only tells the resolver a runner policy exists, so its "no runner
          # named" fallback message does not claim settings were ignored that
          # the policy is about to honour. Routing is the scheduler's.
          RUNNER_POLICY:                ${{ vars.RUNNER_POLICY || '' }}
          RUNNER_POLICY_FILE:           ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
          IN_RUNNER_POLICY:             ${{ inputs.runner-policy || 'auto' }}
          NEW_CACHE_LIBRARY_ENABLED:    ${{ vars.CACHE_LIBRARY_ENABLED }}
          NEW_CACHE_GRADLE_ENABLED:     ${{ vars.CACHE_GRADLE_ENABLED }}
          NEW_CACHE_ADDRESSABLES_ENABLED: ${{ vars.CACHE_ADDRESSABLES_ENABLED }}
          NEW_CACHE_NUGET_ENABLED:      ${{ vars.CACHE_NUGET_ENABLED }}
          NEW_ARTIFACT_RETENTION_DAYS:  ${{ vars.ARTIFACT_RETENTION_DAYS }}
          NEW_ARTIFACT_COMPRESSION:     ${{ vars.ARTIFACT_COMPRESSION }}
          IN_CLEAN_BUILD:               ${{ inputs.clean-build || '' }}
          IN_CACHE_LIBRARY:             ${{ inputs.cache-library || '' }}
        run: |
          set -euo pipefail
          echo "Flow resolver: event=${EVENT_NAME} ref=${REF_NAME} base=${BASE_REF:-<none>}"
          if [[ "${IN_RUNNER_POLICY}" != "legacy" ]] \
             && { [[ -n "${RUNNER_POLICY}" ]] || [[ -f "${RUNNER_POLICY_FILE}" ]]; }; then
            export RUNNER_POLICY_PRESENT=true
          fi
          bash .toolkit/scripts/common/resolve_build_flow.sh

      # ── Runner selection (ADR 004 stage 2c) ────────────────────────────────
      # One decision per Unity job -- each matrix platform, Unity tests and the
      # Addressables build -- made here, before any of those jobs exists, because
      # `runs-on` cannot be chosen from inside the job it schedules.
      #
      # resolve_build_flow.sh above owns the legacy answer (RUNNER_TYPE,
      # BUILD_ENGINE, RUNNER_LABELS, the per-OS labels, RUNNER_DEFAULT_MODE);
      # runner_scheduler.py consumes it. With no runner policy every job is a
      # passthrough of that answer, byte for byte. With a policy, the scheduler
      # looks for a self-hosted runner that can build the job and is available,
      # falling back only as the policy allows. The result is one JSON document,
      # `runner-selection`, which the matrix step, the job inputs, the summary
      # and the final report all read. See docs/MULTI_RUNNER_SCHEDULING.md.
      # Per-platform Discord threads, from the project's .github/discord.json
      # and DISCORD_THREAD_ID_* variables (see docs/DISCORD_NOTIFICATIONS.md).
      # Resolved here, at the start of the run, so a broken config file shows
      # up as an annotation before any build — never as a failed build.
      # Thread IDs are variables, not secrets, so passing all vars is safe.
      - name: Resolve Discord threads
        id: discord
        continue-on-error: true
        shell: bash
        env:
          VARS_JSON:         ${{ toJSON(vars) }}
          BUILD_ENVIRONMENT: ${{ steps.flow.outputs.environment }}
          CONFIG_FILE:       ${{ vars.DISCORD_CONFIG_FILE || '.github/discord.json' }}
        run: |
          set -Eeuo pipefail
          printf '%s' "${VARS_JSON}" \
            | python3 .toolkit/scripts/common/resolve_discord_threads.py \
                --environment "${BUILD_ENVIRONMENT}" --config "${CONFIG_FILE}" \
                >> "$GITHUB_OUTPUT"

      - name: Select runners
        id: runners
        shell: bash
        env:
          IN_PLATFORM:       ${{ inputs.platform || '' }}
          SEL_ANDROID:       ${{ steps.flow.outputs.build-android }}
          SEL_WEBGL:         ${{ steps.flow.outputs.build-webgl }}
          SEL_LINUX64:       ${{ steps.flow.outputs.build-linux64 }}
          SEL_LINUXSERVER:   ${{ steps.flow.outputs.build-linuxserver }}
          SEL_WINDOWS64:     ${{ steps.flow.outputs.build-windows64 }}
          SEL_IOS:           ${{ steps.flow.outputs.build-ios }}
          SEL_TESTS:         ${{ steps.flow.outputs.run-tests }}
          SEL_ADDRESSABLES:  ${{ steps.flow.outputs.build-addressables }}
          RS_LANE:                      pipeline
          RS_LEGACY_LABELS_BY_PLATFORM: ${{ steps.flow.outputs.runner-labels-by-platform }}
          RS_LEGACY_LABELS_LINUX:       ${{ steps.flow.outputs.runner-labels-linux }}
          RS_LEGACY_LABELS_SOURCE:      ${{ steps.flow.outputs.runner-labels-source }}
          RS_LEGACY_BUILD_ENGINE:       ${{ steps.flow.outputs.build-engine }}
          RS_LEGACY_ACTIVATION:         ${{ steps.flow.outputs.activation-strategy }}
          RS_ACTIVATION_DOCKER:         ${{ steps.flow.outputs.activation-strategy-docker }}
          RS_ACTIVATION_LOCAL:          ${{ steps.flow.outputs.activation-strategy-local }}
          RS_UNITY_VERSION:             ${{ steps.version.outputs.version }}
          RS_POLICY_MODE:               ${{ inputs.runner-policy || 'auto' }}
          RUNNER_POLICY:                ${{ vars.RUNNER_POLICY || '' }}
          RUNNER_POLICY_FILE:           ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
          # Read-only runner-status token. Never echoed: the scheduler sends it
          # only as an Authorization header and redacts it from every message.
          RUNNER_STATUS_TOKEN:          ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -Eeuo pipefail
          jobs=()
          # `platform: None` is the CI lane: the matrix step builds no player, so
          # no player job is scheduled either.
          if [[ "${IN_PLATFORM}" != "None" ]]; then
            [[ "${SEL_ANDROID}" == "true" ]]     && jobs+=(Android)
            [[ "${SEL_IOS}" == "true" ]]         && jobs+=(iOS)
            [[ "${SEL_WEBGL}" == "true" ]]       && jobs+=(WebGL)
            [[ "${SEL_LINUX64}" == "true" ]]     && jobs+=(Linux64)
            [[ "${SEL_LINUXSERVER}" == "true" ]] && jobs+=(LinuxServer)
            [[ "${SEL_WINDOWS64}" == "true" ]]   && jobs+=(Windows64)
          fi
          [[ "${SEL_TESTS}" == "true" ]]         && jobs+=(UnityTests)
          [[ "${SEL_ADDRESSABLES}" == "true" ]]  && jobs+=(Addressables)
          RS_JOBS="$(IFS=,; echo "${jobs[*]:-}")"
          export RS_JOBS
          # Unity tests and Addressables are always recorded, so the jobs that
          # read their runs-on resolve even when this run does not schedule them.
          export RS_INACTIVE_JOBS="UnityTests,Addressables"
          python3 .toolkit/scripts/common/runner_scheduler.py

      # ── Build matrix ───────────────────────────────────────────────────────
      # The platform set is DATA, not nine hardcoded jobs. Nine `if:`-gated jobs
      # meant GitHub drew a skipped node for every platform you did not ask for,
      # so an Android-only run still rendered WebGL, iOS, Linux64, LinuxServer,
      # Windows64 and two artifact validations greyed out. A matrix renders
      # exactly the platforms that were selected — and adding a platform becomes
      # a row here instead of a new 45-line job.
      #
      # Casing lives here too: GitHub expressions have no upper()/title(), so
      # resolving "Production" and "AAB" once beats seven copies of `tr`.
      - name: Resolve build matrix
        id: matrix
        shell: bash
        env:
          ENVIRONMENT:  ${{ steps.flow.outputs.environment }}
          ANDROID_TYPE: ${{ steps.flow.outputs.android-export-type }}
          BUILD_TYPE_IN: ${{ steps.flow.outputs.build-type }}
          IN_PLATFORM:   ${{ inputs.platform }}
          RUN_NUMBER:    ${{ github.run_number }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
          BUILD_NUMBER_OFFSET_DEVELOPMENT: ${{ vars.BUILD_NUMBER_OFFSET_DEVELOPMENT }}
          BUILD_NUMBER_OFFSET_RELEASE: ${{ vars.BUILD_NUMBER_OFFSET_RELEASE }}
          PRODUCT_NAME:  ${{ steps.meta.outputs.product-name }}
          APP_VERSION:   ${{ steps.meta.outputs.app-version }}
          RETENTION_DAYS:   ${{ steps.flow.outputs.artifact-retention-days }}
          RETENTION_SOURCE: ${{ steps.flow.outputs.artifact-retention-source }}
          # Per-platform runs-on and engine, read from the runner selection the
          # `runners` step made -- the same document the summary prints, so the
          # table and the routing cannot disagree.
          RUNNER_SELECTION: ${{ steps.runners.outputs.runner-selection }}
          # Platform=Profile pairs; each row takes its own platform's profile.
          BUILD_PROFILES: ${{ inputs.build-profiles || '' }}
          SEL_ANDROID:     ${{ steps.flow.outputs.build-android }}
          SEL_WEBGL:       ${{ steps.flow.outputs.build-webgl }}
          SEL_LINUX64:     ${{ steps.flow.outputs.build-linux64 }}
          SEL_LINUXSERVER: ${{ steps.flow.outputs.build-linuxserver }}
          SEL_WINDOWS64:   ${{ steps.flow.outputs.build-windows64 }}
          SEL_IOS:         ${{ steps.flow.outputs.build-ios }}
          IOS_SIGN_DEV:    ${{ steps.flow.outputs.ios-sign-development }}
        # The rows of every platform job: scripts/common/resolve_build_matrix.sh.
        run: bash .toolkit/scripts/common/resolve_build_matrix.sh

      - name: Write config summary
        if: always()
        continue-on-error: true
        shell: bash
        env:
          FLOW_TYPE:      ${{ steps.flow.outputs.flow-type }}
          ENVIRONMENT:    ${{ steps.flow.outputs.environment }}
          UNITY_VERSION:  ${{ steps.version.outputs.version }}
          RUNNER_MODE:    ${{ steps.flow.outputs.runner-mode }}
          RUNNER_TYPE:        ${{ steps.flow.outputs.runner-type }}
          RUNNER_LABELS_CSV:  ${{ steps.flow.outputs.runner-labels-csv }}
          BUILD_ENGINE:       ${{ steps.flow.outputs.build-engine }}
          EXECUTION_STRATEGY: ${{ steps.flow.outputs.execution-strategy }}
          RUNNER_PLAN:        ${{ steps.flow.outputs.runner-plan }}
          ACTIVATION_STRATEGY: ${{ steps.flow.outputs.activation-strategy }}
          SEL_ANDROID:     ${{ steps.flow.outputs.build-android }}
          SEL_WEBGL:       ${{ steps.flow.outputs.build-webgl }}
          SEL_LINUX64:     ${{ steps.flow.outputs.build-linux64 }}
          SEL_LINUXSERVER: ${{ steps.flow.outputs.build-linuxserver }}
          SEL_WINDOWS64:   ${{ steps.flow.outputs.build-windows64 }}
          SEL_IOS:         ${{ steps.flow.outputs.build-ios }}
          RUN_TESTS:       ${{ steps.flow.outputs.run-tests }}
          TEST_MODE:       ${{ steps.flow.outputs.test-mode }}
          BUILD_ADDR:      ${{ steps.flow.outputs.build-addressables }}
          DEFINE_SYMBOLS:  ${{ steps.flow.outputs.define-symbols }}
          BUILD_TIMEOUT:   ${{ steps.flow.outputs.build-timeout-minutes }}
          CACHE_LIBRARY:      ${{ steps.flow.outputs.cache-library }}
          CACHE_GRADLE:       ${{ steps.flow.outputs.cache-gradle }}
          CACHE_ADDRESSABLES: ${{ steps.flow.outputs.cache-addressables }}
          CACHE_NUGET:        ${{ steps.flow.outputs.cache-nuget }}
          ARTIFACT_RETENTION: ${{ steps.flow.outputs.artifact-retention-days }}
          ARTIFACT_COMPRESSION: ${{ steps.flow.outputs.artifact-compression }}
          CLEAN_BUILD:        ${{ steps.flow.outputs.clean-build }}
          CLEAN_BUILD_SOURCE: ${{ steps.flow.outputs.clean-build-source }}
        run: |
          set +e
          PLATFORMS=""
          [ "${SEL_ANDROID}" = "true" ]     && PLATFORMS="${PLATFORMS:+$PLATFORMS, }Android"
          [ "${SEL_WEBGL}" = "true" ]       && PLATFORMS="${PLATFORMS:+$PLATFORMS, }WebGL"
          [ "${SEL_LINUX64}" = "true" ]     && PLATFORMS="${PLATFORMS:+$PLATFORMS, }Linux64"
          [ "${SEL_LINUXSERVER}" = "true" ] && PLATFORMS="${PLATFORMS:+$PLATFORMS, }LinuxServer"
          [ "${SEL_WINDOWS64}" = "true" ]   && PLATFORMS="${PLATFORMS:+$PLATFORMS, }Windows64"
          [ "${SEL_IOS}" = "true" ]         && PLATFORMS="${PLATFORMS:+$PLATFORMS, }iOS"
          [ -z "${PLATFORMS}" ] && PLATFORMS="(none)"

          TESTS="disabled"
          [ "${RUN_TESTS}" = "true" ] && TESTS="${TEST_MODE:-All}"

          CACHE="library=${CACHE_LIBRARY:-?} gradle=${CACHE_GRADLE:-?} addressables=${CACHE_ADDRESSABLES:-?} nuget=${CACHE_NUGET:-?}"
          ARTIFACT="retention=${ARTIFACT_RETENTION:-?}d compression=${ARTIFACT_COMPRESSION:-?}"

          {
            echo "## Resolve Config Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Flow | \`${FLOW_TYPE:-unknown}\` |"
            echo "| Environment | \`${ENVIRONMENT:-unknown}\` |"
            echo "| Unity Version | \`${UNITY_VERSION:-unknown}\` |"
            echo "| Runner | \`${RUNNER_MODE:-unknown}\` |"
            echo "| Runner Type | \`${RUNNER_TYPE:-unknown}\` |"
            echo "| Runner Labels | \`${RUNNER_LABELS_CSV:-unknown}\` |"
            echo "| Build Engine | \`${BUILD_ENGINE:-unknown}\` |"
            echo "| Execution Strategy | \`${EXECUTION_STRATEGY:-unknown}\` |"
            echo "| Activation Strategy | \`${ACTIVATION_STRATEGY:-unknown}\` |"
            echo "| Platforms | ${PLATFORMS} |"
            echo "| Tests | \`${TESTS}\` |"
            echo "| Addressables | \`${BUILD_ADDR:-false}\` |"
            echo "| Define Symbols | \`${DEFINE_SYMBOLS:-(none)}\` |"
            echo "| Timeout | \`${BUILD_TIMEOUT:-?} min\` |"
            echo "| Cache | \`${CACHE}\` |"
            echo "| Artifact | \`${ARTIFACT}\` |"
            echo "| Clean Build | \`${CLEAN_BUILD:-false}\` (source: \`${CLEAN_BUILD_SOURCE:-default}\`) |"
            # Eight settings feed one decision and nothing printed the answer.
            # This is the legacy resolver's answer, per platform. It used to be
            # written from inside the table above, which split that table in
            # two. The final routing -- after any runner policy -- is the
            # "Runner selection" table the `runners` step writes.
            if [ -n "${RUNNER_PLAN:-}" ] && [ "${RUNNER_PLAN}" != "[]" ]; then
              echo ""
              echo "### Runner plan (legacy resolution)"
              echo ""
              echo "| Platform | runs-on | Engine | Labels from | Note |"
              echo "|---|---|---|---|---|"
              printf '%s' "${RUNNER_PLAN}" | jq -r '.[] |
                "| \(.platform) | `\(.runsOn | join(", "))` | \(.engine) | \(.labelsSource) | \(.note) |"'
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: validate-project
  # ════════════════════════════════════════════════════════════════════════════
  validate-project:
    name: Validate Unity Project
    needs: [resolve-config]
    if: needs.resolve-config.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project structure
        shell: bash
        env:
          PROJECT_PATH:  ${{ needs.resolve-config.outputs.project-path }}
          UNITY_VERSION: ${{ needs.resolve-config.outputs.unity-version }}
        run: |
          set -euo pipefail
          ERRORS=0

          check() {
            local path="$1" label="$2"
            if [ ! -e "${PROJECT_PATH%/}/${path}" ]; then
              echo "::error::Missing ${label}: ${PROJECT_PATH%/}/${path}"
              ERRORS=$((ERRORS + 1))
            else
              echo "  ✓ ${label}"
            fi
          }

          echo "Validating Unity project at '${PROJECT_PATH}' (Unity ${UNITY_VERSION})"
          check "ProjectSettings/ProjectVersion.txt" "ProjectVersion.txt"
          check "Packages/manifest.json"             "Packages/manifest.json"
          check "Assets"                             "Assets directory"

          if [ "${ERRORS}" -gt 0 ]; then
            echo "::error::Project validation failed (${ERRORS} error(s))"
            exit 1
          fi
          echo "Project validation passed."

      - name: Checkout toolkit (for check_identity_drift.py)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref:        ${{ needs.resolve-config.outputs.toolkit-ref }}
          path:       .toolkit

      # ── App identity ────────────────────────────────────────────────────
      # A consumer shipped Android builds for weeks stamped with the URP blank
      # template's identifier and a version one release behind, while its
      # BuildConfig said otherwise and every build went green. Two reasons it
      # stayed invisible: on this lane BuildConfig never reaches PlayerSettings
      # (game-ci supplies its own builder, and `Company.BuildPipeline` runs only
      # when `build-method` is set), and nothing compared the two. A config that
      # is both inert and wrong looks exactly like one that is working.
      - name: Check app identity
        shell: bash
        env:
          PROJECT_PATH: ${{ needs.resolve-config.outputs.project-path }}
          ENVIRONMENT:  ${{ needs.resolve-config.outputs.environment }}
          IDENTITY_DRIFT: ${{ vars.IDENTITY_DRIFT || 'error' }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/.toolkit/scripts/common/check_identity_drift.py" \
            --project-path "${PROJECT_PATH}" \
            --environment "${ENVIRONMENT:-production}"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2.5: validate-license
  # ════════════════════════════════════════════════════════════════════════════
  # Validates UNITY_LICENSE before any Docker-based job runs.
  # Compares UNITY_LICENSE_VERSION variable (set by generate-license) against
  # the project's Unity version. Fails fast with clear regeneration instructions
  # when the license is missing, malformed, or version-mismatched.
  validate-license:
    name: Validate Unity License
    needs: [resolve-config]
    # Any Unity job on the docker engine needs the license, not only a run whose
    # global engine is docker: a runner policy can put one platform in docker
    # while the rest build with local Unity. Without a policy uses-docker is
    # exactly `build-engine == 'docker'`.
    if: >-
      needs.resolve-config.result == 'success' &&
      needs.resolve-config.outputs.uses-docker == 'true'
    runs-on: ubuntu-latest
    outputs:
      license-valid: ${{ steps.check.outputs.valid }}
    steps:
      - name: Check license validity
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_VERSION: ${{ needs.resolve-config.outputs.unity-version }}
          LICENSE_VERSION: ${{ vars.UNITY_LICENSE_VERSION }}
        run: |
          set -euo pipefail
          VALID=true
          REASONS=""

          # Determine available credentials
          HAS_LICENSE=$( [ -n "${UNITY_LICENSE}" ] && echo true || echo false )
          HAS_EMAIL=$( [ -n "${UNITY_EMAIL}" ] && echo true || echo false )
          HAS_PASSWORD=$( [ -n "${UNITY_PASSWORD}" ] && echo true || echo false )

          echo "Credentials: license=${HAS_LICENSE} email=${HAS_EMAIL} password=${HAS_PASSWORD}"

          # Activation requires at least email+password (account activation)
          # or UNITY_LICENSE (.ulf for personal-combined)
          if [ "${HAS_LICENSE}" = "false" ]; then
            if [ "${HAS_EMAIL}" = "true" ] && [ "${HAS_PASSWORD}" = "true" ]; then
              echo "::notice::No UNITY_LICENSE — GameCI will attempt account activation with email+password."
            else
              echo "::error::No valid activation credentials found. Need: (UNITY_EMAIL+UNITY_PASSWORD) or (UNITY_LICENSE)"
              REASONS="${REASONS}\n  - No activation credentials (license or email+password)"
              VALID=false
            fi
          fi

          # If UNITY_LICENSE is set, check version match
          if [ "${HAS_LICENSE}" = "true" ] && [ -n "${LICENSE_VERSION}" ] && [ "${LICENSE_VERSION}" != "${UNITY_VERSION}" ]; then
            echo "::warning::License version mismatch: UNITY_LICENSE_VERSION=${LICENSE_VERSION}, project uses Unity ${UNITY_VERSION}. License may need regeneration."
          fi

          # Content hints (warning only)
          if [ "${HAS_LICENSE}" = "true" ]; then
            if printf '%s' "${UNITY_LICENSE}" | grep -qiE '<ActivationRequest|\.alf'; then
              echo "::warning::UNITY_LICENSE looks like an .alf (activation request), not a .ulf (license)."
            fi
          fi

          echo "valid=${VALID}" >> "$GITHUB_OUTPUT"

          if [ "${VALID}" = "false" ]; then
            {
              echo "## License Validation Failed"
              echo ""
              echo "**Problems:**"
              printf '%b\n' "${REASONS}"
              echo ""
              echo "**Fix:**"
              echo "1. Run the **Generate Docker License** workflow for Unity \`${UNITY_VERSION}\`"
              echo "2. Download the artifact (**.alf** file)"
              echo "3. Upload to https://license.unity3d.com/manual → download **.ulf**"
              echo "4. Set the secret:"
              echo '   ```bash'
              echo "   gh secret set UNITY_LICENSE --org <ORG> --visibility all < Unity_lic.ulf"
              echo "   gh variable set UNITY_LICENSE_VERSION --org <ORG> --visibility all --body \"${UNITY_VERSION}\""
              echo '   ```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "License validation passed (Unity ${UNITY_VERSION})"
          {
            echo "## License Validation"
            echo "License valid for Unity \`${UNITY_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: unity-tests
  # ════════════════════════════════════════════════════════════════════════════
  unity-tests:
    name: Unity Tests
    needs: [resolve-config, validate-project, validate-license]
    if: >-
      !cancelled() &&
      needs.validate-project.result == 'success' &&
      (needs.validate-license.result == 'success' || needs.validate-license.result == 'skipped') &&
      needs.resolve-config.outputs.run-tests == 'true'
    uses: ./.github/workflows/reusable-unity-tests.yml
    with:
      node-label:          ${{ needs.resolve-config.outputs.test-mode }}
      unity-version:       ${{ needs.resolve-config.outputs.unity-version }}
      test-mode:           ${{ needs.resolve-config.outputs.test-mode }}
      project-path:        ${{ needs.resolve-config.outputs.project-path }}
      # Off unless the repository says it granted `checks: write`. Supplying a
      # token is what makes game-ci attempt a check run, and on a read-only
      # token that attempt fails on every run.
      post-test-check-run: ${{ vars.POST_TEST_CHECK_RUN == 'true' }}
      runner-mode:         ${{ inputs.runner-mode || needs.resolve-config.outputs.runner-mode }}
      runner-labels:       ${{ needs.resolve-config.outputs.runs-on-unitytests || needs.resolve-config.outputs.runner-labels-linux }}
      build-engine:        ${{ needs.resolve-config.outputs.build-engine }}
      activation-strategy: ${{ needs.resolve-config.outputs.activation-strategy }}
      toolkit-ref:         ${{ needs.resolve-config.outputs.toolkit-ref }}
      toolkit-repo:        ${{ inputs.toolkit-repo }}
      submodule-auth:      ${{ inputs.submodule-auth || 'token' }}
      build-timeout-minutes:   ${{ fromJSON(needs.resolve-config.outputs.build-timeout-minutes) }}
      cache-library:           ${{ fromJSON(needs.resolve-config.outputs.cache-library) }}
      artifact-retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}
      log-retention-days:      ${{ fromJSON(needs.resolve-config.outputs.log-retention-days) }}
      runner-windows-label:    ${{ needs.resolve-config.outputs.runner-windows-label }}
      runner-macos-label:      ${{ needs.resolve-config.outputs.runner-macos-label }}
      runner-linux-label:      ${{ needs.resolve-config.outputs.runner-linux-label }}
      test-fail-fast:          ${{ fromJSON(needs.resolve-config.outputs.test-fail-fast) }}
    secrets:
      UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3.5: quality-gate  — STAGE 02 boundary
  # ════════════════════════════════════════════════════════════════════════════
  # The single edge every stage-03 build depends on. Before this job existed the
  # builds only needed validate-project/validate-license, so Unity Tests ran
  # *beside* the builds: a red test suite still burned a full Android + WebGL +
  # Windows build before anyone was told. Everything expensive now sits behind
  # this one node, and the graph shows exactly where the pipeline stopped.
  #
  # This job is deliberately cheap (a few seconds on ubuntu-latest). It adds one
  # node of latency in exchange for not paying for builds that were never going
  # to ship.
  #
  # Pass semantics — `skipped` is a pass, everywhere:
  #   * validate-license is skipped on the local build engine (no license needed)
  #   * unity-tests is skipped when run-tests resolves false
  # Anything else (failure, cancelled, timed_out, or an empty result from a job
  # that never reported) closes the gate.
  quality-gate:
    name: Quality Gate
    needs: [resolve-config, validate-project, validate-license, unity-tests]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
      blocking-stage: ${{ steps.gate.outputs.blocking-stage }}
    steps:
      - name: Evaluate quality gate
        id: gate
        shell: bash
        env:
          R_RESOLVE:  ${{ needs.resolve-config.result }}
          R_VALIDATE: ${{ needs.validate-project.result }}
          R_LICENSE:  ${{ needs.validate-license.result }}
          R_TESTS:    ${{ needs.unity-tests.result }}
          TEST_MODE:  ${{ needs.resolve-config.outputs.test-mode }}
          RUN_TESTS:  ${{ needs.resolve-config.outputs.run-tests }}
        run: |
          set -Eeuo pipefail

          PASSED=true
          BLOCKING=""

          gate() { # stage-label job-label result
            case "$3" in
              success|skipped) echo "  ✓ $2: $3" ;;
              *)
                echo "  ✗ $2: ${3:-<no result>}"
                PASSED=false
                [[ -z "${BLOCKING}" ]] && BLOCKING="$1 / $2"
                ;;
            esac
          }

          echo "Quality gate (run-tests=${RUN_TESTS:-false}, test-mode=${TEST_MODE:-N/A})"
          # resolve-config must be checked explicitly. Everything downstream of
          # it is SKIPPED when it fails, and `skipped` is a pass here — so
          # without this line a failed resolver opened the gate and the whole
          # run reported green with nothing built.
          gate "01 PREPARE"      "Resolve Build Config"   "${R_RESOLVE}"
          gate "01 PREPARE"      "Validate Unity Project" "${R_VALIDATE}"
          gate "01 PREPARE"      "Validate Unity License" "${R_LICENSE}"
          gate "02 QUALITY GATE" "Unity Tests"            "${R_TESTS}"

          echo "passed=${PASSED}"          >> "$GITHUB_OUTPUT"
          echo "blocking-stage=${BLOCKING}" >> "$GITHUB_OUTPUT"

          {
            echo "## 02 — Quality Gate"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| 01 / Resolve Build Config | \`${R_RESOLVE}\` |"
            echo "| 01 / Validate Unity Project | \`${R_VALIDATE}\` |"
            echo "| 01 / Validate Unity License | \`${R_LICENSE}\` |"
            echo "| 02 / Unity Tests | \`${R_TESTS}\` |"
            echo ""
            if [[ "${PASSED}" == "true" ]]; then
              echo "✅ Gate open — stage 03 (BUILD ARTIFACTS) may start."
            else
              echo "❌ Gate closed at **${BLOCKING}** — no platform build was started."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${PASSED}" != "true" ]]; then
            echo "::error title=Quality Gate::Blocked at ${BLOCKING}. Stage 03 builds were not started."
            exit 1
          fi


  build-addressables:
    name: Addressables
    needs: [resolve-config, quality-gate]
    if: >-
      !cancelled() &&
      needs.quality-gate.outputs.passed == 'true' &&
      needs.resolve-config.outputs.build-addressables == 'true'
    uses: ./.github/workflows/reusable-build-platform.yml
    with:
      platform:            Addressables
      artifact-name:       ${{ needs.resolve-config.outputs.build-type }}-addressables
      node-label:          ${{ needs.resolve-config.outputs.label-addressables }}
      configuration:       ${{ needs.resolve-config.outputs.configuration }}
      artifact-type:       ADDRESSABLES
      app-version:         ${{ needs.resolve-config.outputs.app-version }}
      build-number:        ${{ needs.resolve-config.outputs.build-number }}
      toolkit-repo:        ${{ inputs.toolkit-repo }}
      unity-version:       ${{ needs.resolve-config.outputs.unity-version }}
      project-path:        ${{ needs.resolve-config.outputs.project-path }}
      environment:         ${{ needs.resolve-config.outputs.environment }}
      runner-mode:         ${{ inputs.runner-mode || needs.resolve-config.outputs.runner-mode }}
      runner-labels:       ${{ needs.resolve-config.outputs.runs-on-addressables || needs.resolve-config.outputs.runner-labels-linux }}
      build-engine:        ${{ needs.resolve-config.outputs.build-engine }}
      activation-strategy: ${{ needs.resolve-config.outputs.activation-strategy }}
      clean-build:         ${{ fromJSON(needs.resolve-config.outputs.clean-build) }}
      build-addressables:  false
      toolkit-ref:         ${{ needs.resolve-config.outputs.toolkit-ref }}
      submodule-auth:      ${{ inputs.submodule-auth || 'token' }}
      define-symbols:      ${{ needs.resolve-config.outputs.define-symbols }}
      build-timeout-minutes:   ${{ fromJSON(needs.resolve-config.outputs.build-timeout-minutes) }}
      cache-library:           ${{ fromJSON(needs.resolve-config.outputs.cache-library) }}
      cache-gradle:            ${{ fromJSON(needs.resolve-config.outputs.cache-gradle) }}
      cache-addressables:      ${{ fromJSON(needs.resolve-config.outputs.cache-addressables) }}
      cache-nuget:             ${{ fromJSON(needs.resolve-config.outputs.cache-nuget) }}
      artifact-retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}
      log-retention-days:      ${{ fromJSON(needs.resolve-config.outputs.log-retention-days) }}
      build-delivery:          ${{ vars.BUILD_DELIVERY || 'none' }}
      artifact-storage:        ${{ vars.ARTIFACT_STORAGE || 'github' }}
      artifact-compression:    ${{ needs.resolve-config.outputs.artifact-compression }}
      build-method:            ${{ needs.resolve-config.outputs.build-method }}
      runner-windows-label:    ${{ needs.resolve-config.outputs.runner-windows-label }}
      runner-macos-label:      ${{ needs.resolve-config.outputs.runner-macos-label }}
      runner-linux-label:      ${{ needs.resolve-config.outputs.runner-linux-label }}
    secrets:
      UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 03 — BUILD ARTIFACTS  (one matrix job, not one job per platform)
  # ════════════════════════════════════════════════════════════════════════════
  # This was six near-identical jobs, each gated by `if:`. GitHub renders an
  # `if:`-false job as a SKIPPED NODE, so an Android-only run drew WebGL, iOS,
  # Linux64, LinuxServer and Windows64 greyed out next to it — the graph
  # advertised five platforms nobody had asked for, and adding a sixth meant
  # copying a 45-line block.
  #
  # The matrix comes from stage 01, so the graph contains exactly the platforms
  # that were selected. `fail-fast: false` keeps the platforms independent: a
  # failed iOS leg must not cancel a running Android leg.
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: ${{ matrix.label }}
    needs: [resolve-config, quality-gate, build-addressables]
    if: >-
      !cancelled() &&
      needs.quality-gate.outputs.passed == 'true' &&
      (needs.build-addressables.result == 'success' || needs.build-addressables.result == 'skipped') &&
      needs.resolve-config.outputs.has-builds == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-config.outputs.build-matrix) }}
    uses: ./.github/workflows/reusable-build-platform.yml
    with:
      platform:            ${{ matrix.platform }}
      node-label:          ${{ matrix.node }}
      artifact-type:       ${{ matrix.artifact-type }}
      artifact-name:       ${{ matrix.artifact-name }}
      configuration:       ${{ needs.resolve-config.outputs.configuration }}
      app-version:         ${{ needs.resolve-config.outputs.app-version }}
      build-number:        ${{ needs.resolve-config.outputs.build-number }}
      toolkit-repo:        ${{ inputs.toolkit-repo }}
      unity-version:       ${{ needs.resolve-config.outputs.unity-version }}
      project-path:        ${{ needs.resolve-config.outputs.project-path }}
      environment:         ${{ needs.resolve-config.outputs.environment }}
      runner-mode:         ${{ inputs.runner-mode || needs.resolve-config.outputs.runner-mode }}
      # Per platform, not one list for the whole matrix: a single shared
      # runs-on sent Android to the machine iOS needed, and back again.
      runner-labels:       ${{ matrix.runner-labels }}
      # Engine and activation follow the row as well: a runner policy can send
      # one platform to a local-Unity machine while the rest stay in docker.
      # Without a policy every row carries the run-wide value, unchanged.
      build-engine:        ${{ matrix.build-engine || needs.resolve-config.outputs.build-engine }}
      activation-strategy: ${{ matrix.activation-strategy || needs.resolve-config.outputs.activation-strategy }}
      runner-selected:     ${{ matrix.runner-selected || '' }}
      build-profile:       ${{ matrix.build-profile || '' }}
      clean-build:         ${{ fromJSON(needs.resolve-config.outputs.clean-build) }}
      build-addressables:  false
      android-export-type: ${{ needs.resolve-config.outputs.android-export-type }}
      toolkit-ref:         ${{ needs.resolve-config.outputs.toolkit-ref }}
      submodule-auth:      ${{ inputs.submodule-auth || 'token' }}
      define-symbols:      ${{ needs.resolve-config.outputs.define-symbols }}
      build-timeout-minutes:   ${{ fromJSON(needs.resolve-config.outputs.build-timeout-minutes) }}
      cache-library:           ${{ fromJSON(needs.resolve-config.outputs.cache-library) }}
      cache-gradle:            ${{ fromJSON(needs.resolve-config.outputs.cache-gradle) }}
      cache-addressables:      ${{ fromJSON(needs.resolve-config.outputs.cache-addressables) }}
      cache-nuget:             ${{ fromJSON(needs.resolve-config.outputs.cache-nuget) }}
      artifact-retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}
      log-retention-days:      ${{ fromJSON(needs.resolve-config.outputs.log-retention-days) }}
      build-delivery:          ${{ vars.BUILD_DELIVERY || 'none' }}
      artifact-storage:        ${{ vars.ARTIFACT_STORAGE || 'github' }}
      artifact-compression:    ${{ needs.resolve-config.outputs.artifact-compression }}
      build-method:            ${{ needs.resolve-config.outputs.build-method }}
      runner-windows-label:    ${{ needs.resolve-config.outputs.runner-windows-label }}
      runner-macos-label:      ${{ needs.resolve-config.outputs.runner-macos-label }}
      runner-linux-label:      ${{ needs.resolve-config.outputs.runner-linux-label }}
      # iOS signing — folded into the build so non-iOS builds have no
      # signing node in the Actions graph. Only the iOS matrix row activates.
      sign-ios:                ${{ matrix.platform == 'iOS' && needs.resolve-config.outputs.sign-ios == 'true' }}
      # Release exports with the configured method (app-store by default);
      # a signed development build takes the method from its profile.
      ios-export-method:       ${{ needs.resolve-config.outputs.build-type == 'release' && inputs.ios-export-method || '' }}
      ios-app-name:            ${{ inputs.ios-app-name }}
      ipa-artifact-name:       ${{ matrix.platform == 'iOS' && needs.resolve-config.outputs.ipa-artifact-name || '' }}
      # Environment-scoped signing secrets; empty when BUILD_ENVIRONMENT_SECRETS=false or for PRs.
      secrets-environment:     ${{ needs.resolve-config.outputs.secrets-environment }}
    secrets:
      UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 03b — iOS PRODUCTION SIGNING
  # ════════════════════════════════════════════════════════════════════════════
  # iOS signing is now folded into the build job via reusable-build-platform.yml
  # conditional steps (sign-ios input). The IPA is produced, manifested and
  # uploaded in the same macOS build job that produces the Xcode project.
  #
  # This eliminates the separate sign-ios job node from the Actions graph,
  # so non-iOS builds never show an iOS-related node.
  #
  # Artifact contract is unchanged:
  #   Stage 03 produces: release-ios-xcodeproj AND release-ios-ipa
  #   Stage 04 validates: release-ios-ipa (validator=ipa)
  #   Stage 05 collects: release-ios-ipa into the Release Set
  # ════════════════════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 04 — ARTIFACT VALIDATION  (one matrix job, not one job per platform)
  # ════════════════════════════════════════════════════════════════════════════
  # "The build exited 0" and "the artifact is shippable" are different claims.
  # Unity happily writes a 4 KB APK with no dex, a WebGL folder with a plain
  # loader next to a brotli wasm, or an Xcode export missing Libraries/ — all
  # exit 0, all fail hours later in a store upload or a blank browser canvas.
  #
  # Every platform has a validator now: Android, iOS and WebGL their own,
  # Windows and both Linux targets the shared `desktop` one. A platform with
  # no validator would contribute no node rather than a permanently skipped
  # one, but there is no longer such a platform.
  #
  # `needs: [build]` is the whole build matrix, which means a failed iOS leg
  # delays Android's validation until the matrix settles. That is a GitHub
  # limitation — a matrix job cannot be depended on leg-by-leg. It costs
  # ordering, never correctness: each leg downloads its own stored artifact and
  # re-running one validation rebuilds nothing.
  #
  # A plain job, not a workflow_call: caller → unity-pipeline →
  # reusable-build-platform already spends 3 of GitHub's 4 nesting levels.
  # ════════════════════════════════════════════════════════════════════════════

  validate-artifact:
    name: ${{ matrix.label }} / Validate ${{ matrix.artifact-type }}
    # iOS signing is now part of the build job (reusable-build-platform.yml),
    # so the IPA artifact is ready when the build matrix completes.
    needs: [resolve-config, build]
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.resolve-config.outputs.has-validations == 'true' &&
      (vars.ARTIFACT_STORAGE || 'github') != 'firebase'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-config.outputs.validate-matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ needs.resolve-config.outputs.toolkit-ref }}
          path: .toolkit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build-artifact/

      # The manifest is its own artifact because the build output directory is
      # owned by the Unity container on the docker lane and is not writable by
      # the runner. Landing it alongside the binary here is what lets the
      # validators fall back to the shipped identity when no Android SDK is
      # available to read the artifact directly.
      - name: Download artifact manifest
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-manifest
          path: build-artifact/

      - name: Validate artifact
        id: validate
        shell: bash
        env:
          VALIDATOR:     ${{ matrix.validator }}
          ARTIFACT_TYPE: ${{ matrix.artifact-type }}
          ENVIRONMENT:   ${{ needs.resolve-config.outputs.environment }}
        run: |
          set -Eeuo pipefail
          case "${VALIDATOR}" in
            android)
              ARGS=(--search-root build-artifact --expected-type "${ARTIFACT_TYPE}"
                    --report validation-${VALIDATOR}.json)
              # A production artifact that is not signed cannot ship, so the
              # check is a gate there and a warning everywhere else.
              [ "${ENVIRONMENT}" = "production" ] && ARGS+=(--require-signed)
              python3 .toolkit/scripts/android/validate_android_artifact.py "${ARGS[@]}"
              ;;
            webgl)
              python3 .toolkit/scripts/webgl/validate_webgl_artifact.py \
                --search-root build-artifact --report validation-${VALIDATOR}.json
              ;;
            ios)
              python3 .toolkit/scripts/ios/validate_xcode_project.py \
                --search-root build-artifact --report validation-${VALIDATOR}.json
              ;;
            desktop)
              # Windows, Linux and the Linux dedicated server ship the same
              # shape: an executable plus its <Product>_Data directory.
              python3 .toolkit/scripts/desktop/validate_desktop_artifact.py \
                --search-root build-artifact \
                --platform "${{ matrix.platform }}" \
                --report validation-${VALIDATOR}.json
              ;;
            ipa)
              # The signed release artifact. Production must be signed, or it
              # cannot be distributed and App Store Connect rejects the upload
              # after it has already consumed a build number.
              IPA=$(find build-artifact -name '*.ipa' -type f | head -1)
              if [ -z "${IPA}" ]; then
                echo "::error::No .ipa found in build-artifact — stage 03b did not produce one"
                exit 1
              fi
              REQUIRE_SIGNED=true \
              EXPECTED_VERSION="${{ needs.resolve-config.outputs.app-version }}" \
              EXPECTED_BUILD_NUMBER="${{ needs.resolve-config.outputs.build-number }}" \
                bash .toolkit/scripts/ios/validate_ipa.sh "${IPA}"
              ;;
            *)
              echo "::error::No validator registered for '${VALIDATOR}'"
              exit 1
              ;;
          esac

      - name: Record platform result
        if: always()
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          OUTCOME:  ${{ steps.validate.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p pipeline-results
          printf '{"platform":"%s","stage":"04","result":"%s"}\n' \
            "${PLATFORM}" "${OUTCOME}" > "pipeline-results/validate-${PLATFORM}.json"

      # Matrix legs are not addressable from `needs`, so each leg writes its own
      # result file and stage 07 aggregates them. This is what lets the report
      # say "iOS failed at stage 04" instead of "the pipeline failed".
      - name: Upload platform result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-result-validate-${{ matrix.platform }}
          path: pipeline-results/
          retention-days: ${{ fromJSON(needs.resolve-config.outputs.log-retention-days) }}

      - name: Upload validation report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-validation-report
          path: validation-${{ matrix.validator }}.json
          if-no-files-found: ignore
          retention-days: ${{ fromJSON(needs.resolve-config.outputs.log-retention-days) }}

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Build / ${{ needs.resolve-config.outputs.build-type == 'release' && 'Release' || 'Development' }}
          stages: ${{ env.PIPELINE_STAGES }}
          current: 04 Validate
          toolkit-path: .toolkit

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 05 — RELEASE MANIFEST  (release builds only)
  # ════════════════════════════════════════════════════════════════════════════
  # One Build / Release run is a Release Set: one commit, one version, one build
  # number, one Unity version, and the artifacts produced from them.
  #
  # The manifest is what makes that set identifiable later and what a promotion
  # checks an artifact against before publishing it. Without it a promotion can
  # only trust a filename, which establishes nothing about the bytes.
  #
  # It runs after validation, so an artifact that failed stage 04 never becomes
  # part of a promotable set.
  # ════════════════════════════════════════════════════════════════════════════

  release-manifest:
    name: Release Manifest
    needs: [resolve-config, build, validate-artifact]
    if: >-
      !cancelled() &&
      needs.resolve-config.outputs.build-type == 'release' &&
      needs.build.result == 'success' &&
      (needs.validate-artifact.result == 'success' || needs.validate-artifact.result == 'skipped') &&
      (vars.ARTIFACT_STORAGE || 'github') != 'firebase'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ needs.resolve-config.outputs.toolkit-ref }}
          path: .toolkit

      # Every artifact of this Release Set, so the manifest can hash the exact
      # bytes rather than trusting what the build job reported.
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*_${{ needs.resolve-config.outputs.build-type }}_*'
          path: artifacts

      - name: Generate release manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .toolkit/scripts/common/release_manifest.py generate \
            --search-root    artifacts \
            --artifacts-root artifacts \
            --output         release-manifest.json \
            --version        "${{ needs.resolve-config.outputs.app-version }}" \
            --build-number   "${{ needs.resolve-config.outputs.build-number }}" \
            --commit         "${{ github.sha }}" \
            --ref            "${{ github.ref_name }}" \
            --run-id         "${{ github.run_id }}" \
            --run-number     "${{ github.run_number }}" \
            --run-url        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --unity-version  "${{ needs.resolve-config.outputs.unity-version }}" \
            --build-type     "${{ needs.resolve-config.outputs.build-type }}" \
            --configuration  "${{ needs.resolve-config.outputs.configuration }}" \
            --environment    "${{ needs.resolve-config.outputs.environment }}" \
            --define-symbols "${{ needs.resolve-config.outputs.define-symbols }}" \
            --require-artifacts \
            > /dev/null

      # Long retention: a production artifact whose manifest has expired cannot
      # be verified, and an unverifiable artifact cannot be promoted.
      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          # The same lifetime as the artifacts it describes. Ninety days was
          # hardcoded here while the artifacts followed the project's setting,
          # so a project retaining artifacts for thirty days kept a manifest
          # for sixty more days after the bytes it points at had gone — a
          # Release Set that reads as promotable and is not.
          retention-days: ${{ fromJSON(needs.resolve-config.outputs.artifact-retention-days) }}

      # Where the run has got to, drawn into this job's summary.
      - name: Progress
        if: always()
        continue-on-error: true
        uses: ./.toolkit/.github/actions/pipeline-progress
        with:
          title: Build / ${{ needs.resolve-config.outputs.build-type == 'release' && 'Release' || 'Development' }}
          stages: ${{ env.PIPELINE_STAGES }}
          current: 05 Release Manifest
          toolkit-path: .toolkit

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 07 — FINAL REPORT
  # ════════════════════════════════════════════════════════════════════════════
  # Stages 03 and 04 are matrix jobs, and GitHub does not expose a matrix leg's
  # result through `needs` — `needs.build.result` is one aggregate for the whole
  # matrix. Each leg therefore writes a small JSON result file and uploads it as
  # `pipeline-result-*`; this job collects them.
  #
  # That indirection buys something the old fixed table could not do: the report
  # covers whichever platforms actually ran, so adding a platform needs no change
  # here, and it carries real per-platform artifact type, size and duration
  # rather than a hardcoded artifact name.
  # ════════════════════════════════════════════════════════════════════════════

  final-report:
    name: Final Report
    needs:
      - resolve-config
      - validate-project
      - validate-license
      - unity-tests
      - quality-gate
      - build-addressables
      - build
      - validate-artifact
      - release-manifest
    if: always()
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-config.outputs.gh-environment }}
    outputs:
      overall: ${{ steps.report.outputs.overall }}
      failed-stage: ${{ steps.report.outputs.failed-stage }}
      platform-summary: ${{ steps.report.outputs.platform-summary }}
    steps:
      # The report logic is scripts/common/pipeline_results.py, shared with
      # Notify Discord. A local (./) path in a reusable workflow resolves
      # against the caller's repository, so the toolkit is checked out here.
      - name: Checkout toolkit (report scripts)
        if: always()
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref:        ${{ inputs.toolkit-ref }}
          path:       .toolkit
          sparse-checkout: scripts/common

      - name: Collect platform results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: pipeline-result-*
          path: pipeline-results
          merge-multiple: true

      # Fallback when a leg's pipeline-result artifact did not upload (e.g. the
      # repository's artifact storage quota is full): each leg also returns
      # the same JSON as its own result-json-<Platform> output.
      - name: Fill missing platform results from build outputs
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RJ_Android:      ${{ needs.build.outputs.result-json-Android }}
          RJ_WebGL:        ${{ needs.build.outputs.result-json-WebGL }}
          RJ_Linux64:      ${{ needs.build.outputs.result-json-Linux64 }}
          RJ_LinuxServer:  ${{ needs.build.outputs.result-json-LinuxServer }}
          RJ_Windows64:    ${{ needs.build.outputs.result-json-Windows64 }}
          RJ_iOS:          ${{ needs.build.outputs.result-json-iOS }}
          RJ_Addressables: ${{ needs.build-addressables.outputs.result-json-Addressables }}
        run: python3 .toolkit/scripts/common/pipeline_results.py fill-missing --results-dir pipeline-results

      - name: Write step summary
        id: report
        shell: bash
        env:
          RUN_ID:        ${{ github.run_id }}
          RUN_URL:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT:        ${{ github.sha }}
          EVENT_NAME:    ${{ github.event_name }}
          REF_NAME:      ${{ github.ref_name }}
          BASE_REF:      ${{ github.base_ref }}
          UNITY_VERSION: ${{ needs.resolve-config.outputs.unity-version }}
          FLOW_TYPE:     ${{ needs.resolve-config.outputs.flow-type }}
          ENVIRONMENT:   ${{ needs.resolve-config.outputs.environment }}
          CONFIGURATION: ${{ needs.resolve-config.outputs.configuration }}
          BUILD_TYPE:    ${{ needs.resolve-config.outputs.build-type }}
          APP_VERSION:   ${{ needs.resolve-config.outputs.app-version }}
          BUILD_NUMBER:  ${{ github.run_number }}
          SIGNING:       ${{ needs.resolve-config.outputs.signing }}
          TEST_MODE:     ${{ needs.resolve-config.outputs.test-mode }}
          BUILD_MATRIX:  ${{ needs.resolve-config.outputs.build-matrix }}
          R_RESOLVE:     ${{ needs.resolve-config.result }}
          R_VALIDATE:    ${{ needs.validate-project.result }}
          R_LICENSE:     ${{ needs.validate-license.result }}
          R_TESTS:       ${{ needs.unity-tests.result }}
          R_GATE:        ${{ needs.quality-gate.result }}
          GATE_BLOCKER:  ${{ needs.quality-gate.outputs.blocking-stage }}
          R_ADDR:        ${{ needs.build-addressables.result }}
          R_BUILD:       ${{ needs.build.result }}
          R_VALIDATION:  ${{ needs.validate-artifact.result }}
        # Verdict, the stage that broke it, the step summary, and the
        # platform-summary Discord reads. Exits 1 on a failed run.
        run: python3 .toolkit/scripts/common/pipeline_results.py final-report --results-dir pipeline-results

      # Where every Unity job was sent and why, rendered from the same
      # runner-selection document stage 01 routed on. Reporting only: a failure
      # here must never turn a green run red.
      - name: Runner selection report
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RUNNER_SELECTION: ${{ needs.resolve-config.outputs.runner-selection }}
        run: |
          if [[ -f .toolkit/scripts/common/runner_scheduler.py ]]; then
            python3 .toolkit/scripts/common/runner_scheduler.py --render >/dev/null || true
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 12: notify-discord
  # ════════════════════════════════════════════════════════════════════════════
  notify-discord:
    name: Notify Discord
    needs:
      - resolve-config
      - validate-project
      - unity-tests
      - build-addressables
      - build
      - quality-gate
      - validate-artifact
      - final-report
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A local (./) composite action resolves from the runner workspace, which
      # for a reusable workflow is the CALLER's repo — not this toolkit. So we
      # check the toolkit out and reference the action (and the shared
      # scripts/common/pipeline_results.py) from there.
      - name: Checkout toolkit (for the Discord action)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Download platform results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: pipeline-result-build-*
          path: ./platform-results

      # Fallback when a leg's pipeline-result artifact did not upload (e.g. the
      # repository's artifact storage quota is full): each leg also returns
      # the same JSON as its own result-json-<Platform> output.
      - name: Fill missing platform results from build outputs
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RJ_Android:      ${{ needs.build.outputs.result-json-Android }}
          RJ_WebGL:        ${{ needs.build.outputs.result-json-WebGL }}
          RJ_Linux64:      ${{ needs.build.outputs.result-json-Linux64 }}
          RJ_LinuxServer:  ${{ needs.build.outputs.result-json-LinuxServer }}
          RJ_Windows64:    ${{ needs.build.outputs.result-json-Windows64 }}
          RJ_iOS:          ${{ needs.build.outputs.result-json-iOS }}
          RJ_Addressables: ${{ needs.build-addressables.outputs.result-json-Addressables }}
        run: python3 .toolkit/scripts/common/pipeline_results.py fill-missing --results-dir ./platform-results

      # Only a binary small enough to attach is worth downloading: the
      # message links everything else. Downloading every artifact of the run
      # pulled hundreds of MB onto this runner to attach nothing.
      - name: Pick the builds small enough to attach
        id: attachable
        if: always()
        continue-on-error: true
        shell: bash
        # Keep --max-bytes in step with attach-size-threshold-mb below.
        run: python3 .toolkit/scripts/common/pipeline_results.py attachable --results-dir ./platform-results --max-bytes 8388608

      - name: Download attachable builds
        # An empty pattern would download every artifact of the run.
        if: ${{ always() && steps.attachable.outputs.pattern != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ${{ steps.attachable.outputs.pattern }}
          path: ./artifacts

      - name: Derive overall status
        id: status
        shell: bash
        env:
          R_VALIDATE:    ${{ needs.validate-project.result }}
          R_TESTS:       ${{ needs.unity-tests.result }}
          R_ADDR:        ${{ needs.build-addressables.result }}
          R_BUILD:       ${{ needs.build.result }}
          PLATFORM_SUMMARY: ${{ needs.final-report.outputs.platform-summary }}
          R_GATE:        ${{ needs.quality-gate.result }}
          GATE_BLOCKER:  ${{ needs.quality-gate.outputs.blocking-stage }}
          V_ALL:         ${{ needs.validate-artifact.result }}
          REPORT_OVERALL: ${{ needs.final-report.outputs.overall }}
          REPORT_FAILED_STAGE: ${{ needs.final-report.outputs.failed-stage }}
        # Stage 07 already collected every matrix leg and decided the verdict
        # (a matrix job reports one aggregate result through `needs`); this
        # unpacks its platform-summary into the Discord action's inputs.
        run: python3 .toolkit/scripts/common/pipeline_results.py discord-status

      - name: Gather run context (commit message, author, duration)
        id: ctx
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BUILD_DURATION=""

          # ── Commit message (first line) ───────────────────────────────────
          COMMIT_MSG=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" \
            -q '.commit.message' 2>/dev/null | head -1) || true
          echo "commit-message=${COMMIT_MSG}" >> "$GITHUB_OUTPUT"

          # ── Commit author ─────────────────────────────────────────────────
          COMMIT_AUTHOR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" \
            -q '.commit.author.name' 2>/dev/null) || true
          echo "commit-author=${COMMIT_AUTHOR}" >> "$GITHUB_OUTPUT"

          # ── Build duration ────────────────────────────────────────────────
          START=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -q '.run_started_at' 2>/dev/null) || true
          if [ -n "${START}" ]; then
            START_EPOCH=$(date -u -d "${START}" +%s 2>/dev/null) || true
            if [ -n "${START_EPOCH}" ] && [ "${START_EPOCH}" -gt 0 ] 2>/dev/null; then
              NOW=$(date -u +%s)
              ELAPSED=$(( NOW - START_EPOCH ))
              if [ "${ELAPSED}" -ge 60 ]; then
                BUILD_DURATION="$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s"
              else
                BUILD_DURATION="${ELAPSED}s"
              fi
            fi
          fi
          echo "build-duration=${BUILD_DURATION}" >> "$GITHUB_OUTPUT"

      - name: Gather per-platform error/warning counts + log artifact ids
        id: diag
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TYPE: ${{ needs.resolve-config.outputs.build-type }}
        run: |
          set -uo pipefail
          # This run's artifact names and ids, for the log and binary links.
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            -q '.artifacts[]|"\(.name) \(.id)"' > "${RUNNER_TEMP}/artifact-map.txt" 2>/dev/null || true
          # Counts come from each build leg's own log summary (result file),
          # not from downloading the logs.
          python3 .toolkit/scripts/common/pipeline_results.py diagnostics \
            --results-dir ./platform-results \
            --build-type "${BUILD_TYPE}" \
            --artifact-map "${RUNNER_TEMP}/artifact-map.txt"

      - name: Post build to Discord thread
        uses: ./.toolkit/.github/actions/discord-upload-build
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          status:              ${{ steps.status.outputs.overall }}
          flow-type:           ${{ needs.resolve-config.outputs.flow-type }}
          environment:         ${{ needs.resolve-config.outputs.environment }}
          run-url:             ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit-sha:          ${{ github.sha }}
          branch:              ${{ github.ref_name }}
          unity-version:       ${{ needs.resolve-config.outputs.unity-version }}
          # Per-platform results come from the matrix legs via stage 07, since a
          # matrix job's legs are not addressable through `needs`.
          result-android:      ${{ steps.status.outputs.result-android }}
          result-webgl:        ${{ steps.status.outputs.result-webgl }}
          result-linux64:      ${{ steps.status.outputs.result-linux64 }}
          result-linuxserver:  ${{ steps.status.outputs.result-linuxserver }}
          result-windows64:    ${{ steps.status.outputs.result-windows64 }}
          result-ios:          ${{ steps.status.outputs.result-ios }}
          result-addressables: ${{ needs.build-addressables.result }}
          result-tests:        ${{ needs.unity-tests.result }}
          result-validation-android: ${{ steps.status.outputs.validation-android }}
          result-validation-webgl:   ${{ steps.status.outputs.validation-webgl }}
          result-validation-ios:     ${{ steps.status.outputs.validation-ios }}
          failed-stage:        ${{ needs.final-report.outputs.failed-stage }}
          configuration:       ${{ needs.resolve-config.outputs.configuration }}
          # Resolved in resolve-config; falls back to the single-thread variable
          # if that step failed.
          thread-id:           ${{ needs.resolve-config.outputs.discord-thread-id || vars.DISCORD_THREAD_ID }}
          platform-thread-ids: ${{ needs.resolve-config.outputs.discord-platform-thread-ids }}
          # Routed even when the quality gate stopped them before they built.
          planned-platforms:   ${{ needs.resolve-config.outputs.planned-platforms }}
          artifact-dir:        ./artifacts
          attach-size-threshold-mb: '8'
          actor:               ${{ github.actor }}
          event:               ${{ github.event_name }}
          run-number:          ${{ github.run_number }}
          repository:          ${{ github.repository }}
          commit-message:      ${{ steps.ctx.outputs.commit-message }}
          commit-author:       ${{ steps.ctx.outputs.commit-author }}
          build-duration:      ${{ steps.ctx.outputs.build-duration }}
          platform-diagnostics: ${{ steps.diag.outputs.platform-diagnostics }}
          # The size the build itself measured. Discord used to re-derive it by
          # zipping a downloaded directory, which answers a different question
          # (how big is a zip of the artifact) and answers 0 when the directory
          # is not where it looked.
          platform-summary:     ${{ needs.final-report.outputs.platform-summary }}
          total-errors:        ${{ steps.diag.outputs.total-errors }}
          total-warnings:      ${{ steps.diag.outputs.total-warnings }}
          product-name:        ${{ needs.resolve-config.outputs.product-name }}
          app-version:         ${{ needs.resolve-config.outputs.app-version }}
          bundle-id:           ${{ needs.resolve-config.outputs.bundle-id }}
          scripting-backend:   ${{ needs.resolve-config.outputs.scripting-backend }}
          android-arch:        ${{ needs.resolve-config.outputs.android-arch }}
          orientation:         ${{ needs.resolve-config.outputs.orientation }}
          store-link:          ${{ needs.resolve-config.outputs.store-link }}
          android-export-type: ${{ needs.resolve-config.outputs.android-export-type }}
          define-symbols-count: ${{ needs.resolve-config.outputs.define-symbols-count }}
          bundle-id-ios:       ${{ needs.resolve-config.outputs.bundle-id-ios }}
          define-symbols-count-ios: ${{ needs.resolve-config.outputs.define-symbols-count-ios }}
          define-symbols:      ${{ needs.resolve-config.outputs.define-symbols }}
