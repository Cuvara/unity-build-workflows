name: Pipeline iOS Release

# Self-contained iOS release pipeline:
#   Build Xcode → Archive/Export IPA → Validate IPA → TestFlight → External → App Store
#
# Each release phase is a separate job gated by GitHub Environments.
# Build step calls unity-build-ios.yml for Xcode project generation.
# Archive/Export runs on macOS with signing composite actions.
# Store phases use ASC API (ubuntu-latest except TestFlight upload needs macOS).
#
# Nesting depth: orchestrator → this → unity-build-ios = 3 levels (safe).

on:
  workflow_call:
    inputs:
      toolkit-repo:
        description: >-
          Toolkit repository checked out to .toolkit/ for this workflow's own
          composite actions and scripts. A step-level `uses: ./…` in a reusable
          workflow resolves against the runner WORKSPACE, which is the caller's
          repository — so the toolkit's actions are not on disk unless checked
          out explicitly.
        type: string
        required: false
        default: Cuvara/unity-build-workflows
      toolkit-ref:
        description: Git ref of the toolkit repository to check out.
        type: string
        required: false
        default: main
      # ── Build inputs ──
      project-path:
        type: string
        required: false
        default: '.'
      unity-version:
        type: string
        required: true
      build-config-path:
        type: string
        required: false
        default: BuildConfig
      build-version:
        type: string
        required: true
      build-addressables:
        type: boolean
        required: false
        default: true
      ios-runner-label:
        description: macOS runner label for Unity + Xcode
        type: string
        required: false
        default: macos-unity-xcode
      workflow-repository:
        type: string
        required: false
        default: ''
      workflow-ref:
        type: string
        required: false
        default: ''
      integration-mode:
        type: string
        required: false
        default: remote
      toolkit-path:
        type: string
        required: false
        default: tools/unity-build-workflows

      # ── Release inputs ──
      app-id:
        description: App Store Connect app ID
        type: string
        required: true
      version-string:
        description: App Store version string (e.g., 1.2.3)
        type: string
        required: true
      export-method:
        description: IPA export method
        type: string
        required: false
        default: app-store
      bundle-id:
        description: >-
          Expected CFBundleIdentifier. When set, stage 04 fails the IPA whose
          Info.plist does not match, instead of letting App Store Connect
          reject the upload afterwards. Empty skips the check.
        type: string
        required: false
        default: ''
      app-name:
        description: Application name for archive/IPA naming
        type: string
        required: false
        default: Unity
      start-phase:
        description: Phase to start from (validate/internal/external/production)
        type: string
        required: false
        default: validate
      source-run-id:
        description: >-
          Run ID of the Build / Release run that produced the artifact. Required
          because `actions/download-artifact` only sees the current run by
          default — promotion pulls the binary from another run, which is what
          makes it the same binary QA approved rather than a rebuild.
        type: string
        required: true
      artifact-name:
        description: >-
          Existing IPA artifact to publish when start-phase is
          internal/external/production. This is what makes the binary QA
          approved the binary that ships — nothing is rebuilt between them.
        type: string
        required: false
        default: ''
      phased-release:
        description: Enable 7-day phased release on production
        type: boolean
        required: false
        default: true
      from-tag:
        description: Git tag to generate release notes from
        type: string
        required: false
        default: ''
      dry-run:
        description: Build without submitting to store
        type: boolean
        required: false
        default: false

    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false
      # Optional at the call boundary, checked where they are used: a
      # `required: true` secret is validated when the workflow call is
      # RESOLVED, so declaring these required made Build Only impossible in a
      # repository that has no store credentials. Signing fails in stage 03 and
      # publishing fails in stage 05 if they are genuinely missing.
      IOS_DISTRIBUTION_CERTIFICATE_BASE64:
        required: false
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_PRIVATE_KEY:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false

    outputs:
      artifact-name:
        description: Name of the Xcode project artifact
        value: ${{ inputs.artifact-name }}

  workflow_dispatch:
    inputs:
      unity-version:
        description: Unity editor version
        required: true
        type: string
      build-version:
        description: Build version string (CFBundleVersion)
        required: true
        type: string
      version-string:
        description: App Store version string (e.g., 1.2.3)
        required: true
        type: string
      app-id:
        description: App Store Connect app ID
        required: true
        type: string
      export-method:
        description: IPA export method
        required: false
        type: choice
        default: app-store
        options: [app-store, ad-hoc, enterprise, development]
      app-name:
        description: Application name
        required: false
        type: string
        default: Unity
      start-phase:
        description: Phase to start from
        required: false
        type: choice
        default: validate
        options: [validate, internal, external, production]
      phased-release:
        description: Enable 7-day phased release
        required: false
        type: boolean
        default: true
      dry-run:
        description: Build without submitting
        required: false
        type: boolean
        default: false

jobs:
  # ─── ARCHIVE & EXPORT IPA ──────────────────────────────────────────────────
  archive-export:
    name: 03 / iOS / IPA
    if: |
      always() &&
      inputs.start-phase == 'validate'
    runs-on: ${{ inputs.ios-runner-label || 'macos-unity-xcode' }}
    outputs:
      ipa-artifact-name: ${{ steps.set-artifact.outputs.ipa-artifact-name }}
      bundle-id: ${{ steps.archive.outputs.bundle-id }}
      bundle-version: ${{ steps.archive.outputs.bundle-version }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Download Xcode project
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ${{ inputs.artifact-name }}
          path: xcode-project/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Setup signing
        id: signing
        uses: ./.toolkit/.github/actions/ios-setup-signing
        with:
          ios-distribution-certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          ios-distribution-certificate-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          ios-provisioning-profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          export-method: ${{ inputs.export-method || 'app-store' }}

      - name: Find Xcode project
        id: find-project
        shell: bash
        run: |
          XCODEPROJ=$(find xcode-project/ -name '*.xcodeproj' -type d | head -1)
          if [[ -z "${XCODEPROJ}" ]]; then
            echo "::error::No .xcodeproj found in artifact"
            exit 1
          fi
          PROJECT_DIR=$(dirname "${XCODEPROJ}")
          echo "project-dir=${PROJECT_DIR}" >> "${GITHUB_OUTPUT}"
          echo "[archive] Found: ${XCODEPROJ}"

      - name: Archive and export
        id: archive
        uses: ./.toolkit/.github/actions/ios-archive-export
        with:
          xcode-project-path: ${{ steps.find-project.outputs.project-dir }}
          export-options-path: ${{ steps.signing.outputs.export-options-path }}
          development-team: ${{ steps.signing.outputs.development-team || '' }}
          archive-path: build-output/${{ inputs.app-name || 'Unity' }}.xcarchive
          export-path: build-output/ipa

      # A 5000-byte floor was the whole of the old gate. An IPA can be the right
      # size and still be unsigned, carry an expired profile, or hold the wrong
      # bundle id — all of which App Store Connect rejects after the upload has
      # already burned a build number.
      - name: Validate IPA
        shell: bash
        env:
          EXPECTED_BUNDLE_ID: ${{ inputs.bundle-id }}
          EXPECTED_VERSION: ${{ inputs.version-string }}
          REQUIRE_SIGNED: 'true'
        run: |
          set -Eeuo pipefail
          bash .toolkit/scripts/ios/validate_ipa.sh "${{ steps.archive.outputs.ipa-path }}"

      - name: Upload IPA artifact
        id: set-artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: ios-ipa-${{ inputs.build-version }}
          path: |
            ${{ steps.archive.outputs.ipa-path }}
            build-output/${{ inputs.app-name || 'Unity' }}.xcarchive/dSYMs/
          retention-days: 30

      - name: Set output
        shell: bash
        run: echo "ipa-artifact-name=ios-ipa-${{ inputs.build-version }}" >> "${GITHUB_OUTPUT}"

      - name: Cleanup signing
        if: always()
        uses: ./.toolkit/.github/actions/ios-cleanup-signing
        with:
          keychain-name: ${{ steps.signing.outputs.keychain-name || '' }}

      - name: Summary
        shell: bash
        run: |
          echo "### Archive & Export" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Bundle ID:** ${{ steps.archive.outputs.bundle-id }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Bundle Version:** ${{ steps.archive.outputs.bundle-version }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Export Method:** ${{ inputs.export-method || 'app-store' }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **IPA Artifact:** ios-ipa-${{ inputs.build-version }}" >> "${GITHUB_STEP_SUMMARY}"

  # ─── RELEASE NOTES ──────────────────────────────────────────────────────────
  release-notes:
    name: 04 / iOS / Release Notes
    if: |
      always() &&
      true
    runs-on: ubuntu-latest
    steps:
      # Release notes come from the CALLER's git history, so the caller repo is
      # the workspace checkout; the toolkit only supplies the action.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Generate notes
        uses: ./.toolkit/.github/actions/generate-release-notes
        with:
          from-tag: ${{ inputs.from-tag }}
          format: app-store-text
          output-path: release-notes.txt

      - name: Upload notes
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: ios-release-notes
          path: release-notes.txt
          retention-days: 7

  # ─── PHASE 1: TESTFLIGHT INTERNAL ──────────────────────────────────────────
  internal-testing:
    name: 05 / iOS / Publish — TestFlight Internal
    needs: [archive-export, release-notes]
    if: |
      always() && !inputs.dry-run &&
      (
        needs.archive-export.result == 'success' ||
        inputs.start-phase == 'internal'
      )
    runs-on: macos-latest
    environment: internal-testing
    outputs:
      build-id: ${{ steps.upload.outputs.build-id }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Download IPA artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ${{ needs.archive-export.outputs.ipa-artifact-name || inputs.artifact-name || format('ios-ipa-{0}', inputs.build-version) }}
          path: ipa-artifact/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Find IPA
        id: find-ipa
        shell: bash
        run: |
          IPA_PATH=$(find ipa-artifact/ -name '*.ipa' -type f | head -1)
          if [[ -z "${IPA_PATH}" ]]; then
            echo "::error::No .ipa file found in artifact"
            exit 1
          fi
          echo "ipa-path=${IPA_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload to TestFlight + wait for processing
        id: upload
        uses: ./.toolkit/.github/actions/ios-testflight
        with:
          ipa-path: ${{ steps.find-ipa.outputs.ipa-path }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          wait-for-processing: 'true'
          app-id: ${{ inputs.app-id }}

      - name: Summary
        shell: bash
        run: |
          echo "### Phase 1: TestFlight Internal" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Build ID:** ${{ steps.upload.outputs.build-id }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Processing:** Complete" >> "${GITHUB_STEP_SUMMARY}"

  # ─── PHASE 2: TESTFLIGHT EXTERNAL ──────────────────────────────────────────
  external-testing:
    name: 06 / iOS / Release — TestFlight External
    needs: [internal-testing]
    if: |
      always() && !inputs.dry-run &&
      (
        needs.internal-testing.result == 'success' ||
        inputs.start-phase == 'external'
      )
    runs-on: ubuntu-latest
    environment: external-testing
    outputs:
      build-id: ${{ needs.internal-testing.outputs.build-id }}
    steps:
      - name: External testing gate
        shell: bash
        run: |
          BUILD_ID="${{ needs.internal-testing.outputs.build-id }}"
          echo "[ios-release] Build ID: ${BUILD_ID}"
          echo "[ios-release] External beta review: add build to external TestFlight groups in App Store Connect."
          echo "[ios-release] This environment gate ensures manual approval before external distribution."

      - name: Summary
        shell: bash
        run: |
          echo "### Phase 2: TestFlight External" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Build ID:** ${{ needs.internal-testing.outputs.build-id }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Approved for external TestFlight testing" >> "${GITHUB_STEP_SUMMARY}"

  # ─── PHASE 3: APP STORE PRODUCTION ─────────────────────────────────────────
  production-release:
    name: 06 / iOS / Release — App Store
    needs: [internal-testing, external-testing, release-notes]
    if: |
      always() && !inputs.dry-run &&
      (
        needs.external-testing.result == 'success' ||
        inputs.start-phase == 'production'
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Resolve build ID
        id: resolve
        shell: bash
        run: |
          BUILD_ID="${{ needs.internal-testing.outputs.build-id || needs.external-testing.outputs.build-id }}"
          if [[ -z "${BUILD_ID}" ]]; then
            echo "::error::No build-id available from prior phases"
            exit 1
          fi
          echo "build-id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download release notes
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ios-release-notes
          path: ./
        continue-on-error: true

      - name: Submit for App Store review
        uses: ./.toolkit/.github/actions/ios-asc-submit-review
        with:
          app-id: ${{ inputs.app-id }}
          build-id: ${{ steps.resolve.outputs.build-id }}
          version-string: ${{ inputs.version-string }}
          phased-release: ${{ inputs.phased-release && 'true' || 'false' }}
          release-notes-file: release-notes.txt
          asc-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          asc-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          asc-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Summary
        shell: bash
        run: |
          echo "### Phase 3: App Store Submission" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Version:** ${{ inputs.version-string }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Build ID:** ${{ steps.resolve.outputs.build-id }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Phased Release:** ${{ inputs.phased-release }}" >> "${GITHUB_STEP_SUMMARY}"

  # ─── 07 — REPORT & NOTIFY ───────────────────────────────────────────────────
  # The pipeline used to end at stage 06, so a release run produced no report:
  # the only way to see how far a promotion got was to read the graph. This
  # says which phase it reached, or which one stopped it, and posts the same
  # to Discord.
  report:
    name: 07 / iOS / Report & Notify
    needs: [archive-export, release-notes, internal-testing, external-testing, production-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit

      - name: Report
        uses: ./.toolkit/.github/actions/release-report
        with:
          platform: iOS
          destination: App Store Connect
          build-version: ${{ inputs.build-version }}
          artifact-name: ${{ inputs.artifact-name }}
          start-phase: ${{ inputs.start-phase }}
          dry-run: ${{ inputs.dry-run }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          phases: |
            03 Archive & Export IPA=${{ needs.archive-export.result }}
            04 Release Notes=${{ needs.release-notes.result }}
            05 Publish — TestFlight Internal=${{ needs.internal-testing.result }}
            06 Release — TestFlight External=${{ needs.external-testing.result }}
            06 Release — App Store=${{ needs.production-release.result }}
