      runner-windows-label:    ${{ needs.resolve-config.outputs.runner-windows-label }}
      runner-macos-label:      ${{ needs.resolve-config.outputs.runner-macos-label }}
      runner-linux-label:      ${{ needs.resolve-config.outputs.runner-linux-label }}
      test-fail-fast:          ${{ fromJSON(needs.resolve-config.outputs.test-fail-fast) }}
    secrets:
      UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3.5: quality-gate  — STAGE 02 boundary
  # ════════════════════════════════════════════════════════════════════════════
  # The single edge every stage-03 build depends on. Before this job existed the
  # builds only needed validate-project/validate-license, so Unity Tests ran
  # *beside* the builds: a red test suite still burned a full Android + WebGL +
  # Windows build before anyone was told. Everything expensive now sits behind
  # this one node, and the graph shows exactly where the pipeline stopped.
  #
  # This job is deliberately cheap (a few seconds on ubuntu-latest). It adds one
  # node of latency in exchange for not paying for builds that were never going
  # to ship.
  #
  # Pass semantics — `skipped` is a pass, everywhere:
  #   * validate-license is skipped on the local build engine (no license needed)
  #   * unity-tests is skipped when run-tests resolves false
  # Anything else (failure, cancelled, timed_out, or an empty result from a job
  # that never reported) closes the gate.
  quality-gate:
    name: 02 / Quality Gate
    needs: [resolve-config, validate-project, validate-license, unity-tests]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
      blocking-stage: ${{ steps.gate.outputs.blocking-stage }}
    steps:
      - name: Evaluate quality gate
        id: gate
        shell: bash
        env:
          R_VALIDATE: ${{ needs.validate-project.result }}
          R_LICENSE:  ${{ needs.validate-license.result }}
          R_TESTS:    ${{ needs.unity-tests.result }}
          TEST_MODE:  ${{ needs.resolve-config.outputs.test-mode }}
          RUN_TESTS:  ${{ needs.resolve-config.outputs.run-tests }}
        run: |
          set -Eeuo pipefail

          PASSED=true
          BLOCKING=""

          gate() { # stage-label job-label result
            case "$3" in
              success|skipped) echo "  ✓ $2: $3" ;;
              *)
                echo "  ✗ $2: ${3:-<no result>}"
                PASSED=false
                [[ -z "${BLOCKING}" ]] && BLOCKING="$1 / $2"
                ;;
            esac
          }

          echo "Quality gate (run-tests=${RUN_TESTS:-false}, test-mode=${TEST_MODE:-N/A})"
          gate "01 PREPARE"      "Validate Unity Project" "${R_VALIDATE}"
          gate "01 PREPARE"      "Validate Unity License" "${R_LICENSE}"
          gate "02 QUALITY GATE" "Unity Tests"            "${R_TESTS}"

          echo "passed=${PASSED}"          >> "$GITHUB_OUTPUT"
          echo "blocking-stage=${BLOCKING}" >> "$GITHUB_OUTPUT"

          {
            echo "## 02 — Quality Gate"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| 01 / Validate Unity Project | \`${R_VALIDATE}\` |"
            echo "| 01 / Validate Unity License | \`${R_LICENSE}\` |"
            echo "| 02 / Unity Tests | \`${R_TESTS}\` |"
            echo ""
            if [[ "${PASSED}" == "true" ]]; then
              echo "✅ Gate open — stage 03 (BUILD ARTIFACTS) may start."
            else
              echo "❌ Gate closed at **${BLOCKING}** — no platform build was started."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${PASSED}" != "true" ]]; then
            echo "::error title=Quality Gate::Blocked at ${BLOCKING}. Stage 03 builds were not started."
            exit 1
          fi

