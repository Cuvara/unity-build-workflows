name: Setup Fastlane
description: >
  Install Ruby and Fastlane with Bundler caching.
  Used by release pipelines that replace custom Python/shell scripts.

inputs:
  ruby-version:
    description: Ruby version to install.
    required: false
    default: '3.2'
  working-directory:
    description: Directory containing the Gemfile (toolkit root).
    required: false
    default: '.toolkit'

runs:
  using: composite
  steps:
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true
        working-directory: ${{ inputs.working-directory }}
