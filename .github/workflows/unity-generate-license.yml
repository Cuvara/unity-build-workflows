name: Generate Unity License

# Generate a Docker-compatible .ulf license file using game-ci/unity-activate.
#
# This uses GameCI's official activation action which handles Unity Personal
# licensing correctly (including Unity 6).
#
# When APP_ID + APP_PRIVATE_KEY secrets are present, the .ulf is automatically
# set as UNITY_LICENSE org/repo secret via GitHub App bot.
#
# Prerequisites:
#   - UNITY_EMAIL and UNITY_PASSWORD secrets must be set
#   - (Optional) APP_ID and APP_PRIVATE_KEY secrets for auto-set

on:
  workflow_call:
    inputs:
      unity-version:
        description: Unity editor version
        type: string
        required: true
      secret-scope:
        description: "Where to set the secret: 'org' or 'repo'"
        type: string
        required: false
        default: org
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

  workflow_dispatch:
    inputs:
      unity-version:
        description: Unity editor version
        required: true
        default: '6000.0.26f1'
      secret-scope:
        description: "Where to set the secret: 'org' or 'repo'"
        required: false
        default: org
        type: choice
        options: [org, repo]

jobs:
  generate:
    name: Generate Docker License
    runs-on: ubuntu-latest
    steps:
      - name: Activate Unity and generate .ulf
        id: activate
        uses: game-ci/unity-activate@fbbebcb5a254e2d1dc44ad931047e3f320e4968a # main with Unity 6 fix
        with:
          unityVersion: ${{ inputs.unity-version }}
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Find generated .ulf
        id: find-ulf
        run: |
          # game-ci/unity-activate writes .ulf to Unity config directory
          ULF=$(find /home/runner -name "*.ulf" -o -name "Unity_lic.ulf" 2>/dev/null | head -1)
          if [ -z "${ULF}" ]; then
            ULF=$(find /tmp -name "*.ulf" 2>/dev/null | head -1)
          fi
          if [ -z "${ULF}" ]; then
            # Check Unity license paths
            for dir in \
              "${HOME}/.local/share/unity3d/Unity" \
              "${HOME}/.config/unity3d/Unity" \
              "/usr/share/unity3d/config"; do
              if [ -d "$dir" ]; then
                ULF=$(find "$dir" -name "*.ulf" 2>/dev/null | head -1)
                [ -n "${ULF}" ] && break
              fi
            done
          fi

          if [ -n "${ULF}" ]; then
            echo "ulf-path=${ULF}" >> "$GITHUB_OUTPUT"
            echo "ulf-found=true" >> "$GITHUB_OUTPUT"
            mkdir -p license-output
            cp "${ULF}" license-output/Unity_lic.ulf
            echo "Found .ulf: ${ULF}"
          else
            echo "ulf-found=false" >> "$GITHUB_OUTPUT"
            echo "::error::No .ulf file found after activation"
          fi

      - name: Upload license artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-docker-license
          path: license-output/
          retention-days: 1
          if-no-files-found: warn

      - name: Auto-set UNITY_LICENSE secret via bot
        if: steps.find-ulf.outputs.ulf-found == 'true'
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          UNITY_VERSION: ${{ inputs.unity-version }}
          SECRET_SCOPE: ${{ inputs.secret-scope }}
        run: |
          set -euo pipefail

          ULF_FILE="license-output/Unity_lic.ulf"

          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "::warning::APP_ID or APP_PRIVATE_KEY not set — cannot auto-set secret."
            echo "Manual step required:"
            echo "  gh secret set UNITY_LICENSE < ${ULF_FILE}"
            exit 0
          fi

          # Generate GitHub App installation token
          BOT_TOKEN=$(node -e "
          const crypto = require('crypto');
          const https = require('https');

          const APP_ID = process.env.APP_ID;
          const PEM = process.env.APP_PRIVATE_KEY;
          const ORG = process.env.GITHUB_REPOSITORY.split('/')[0];

          const now = Math.floor(Date.now() / 1000);
          const header = Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT'})).toString('base64url');
          const payload = Buffer.from(JSON.stringify({iat: now-60, exp: now+600, iss: APP_ID})).toString('base64url');
          const signature = crypto.sign('SHA256', Buffer.from(header+'.'+payload), PEM).toString('base64url');
          const jwt = header+'.'+payload+'.'+signature;

          function api(path, token, method, body) {
            return new Promise((resolve, reject) => {
              const opts = {
                hostname: 'api.github.com', path, method: method||'GET',
                headers: {
                  'Authorization': 'Bearer '+token,
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'cuvara-bot',
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              };
              const req = https.request(opts, res => {
                let d=''; res.on('data', c => d+=c);
                res.on('end', () => resolve({status: res.statusCode, data: JSON.parse(d||'{}')}));
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          (async () => {
            const instRes = await api('/app/installations', jwt);
            const inst = instRes.data.find(i => i.account.login === ORG);
            if (!inst) { console.error('App not installed on '+ORG); process.exit(1); }
            const tokenRes = await api('/app/installations/'+inst.id+'/access_tokens', jwt, 'POST', {});
            if (tokenRes.status !== 201) { console.error('Token error:', JSON.stringify(tokenRes.data)); process.exit(1); }
            console.log(tokenRes.data.token);
          })();
          ")

          if [ -z "${BOT_TOKEN}" ]; then
            echo "::error::Failed to generate bot token"
            exit 1
          fi

          export GH_TOKEN="${BOT_TOKEN}"
          REPO="${GITHUB_REPOSITORY}"
          ORG=$(echo "${REPO}" | cut -d/ -f1)

          if [ "${SECRET_SCOPE}" = "org" ]; then
            echo "Setting UNITY_LICENSE org secret for ${ORG}..."
            gh secret set UNITY_LICENSE --org "${ORG}" --visibility all < "${ULF_FILE}"
            echo "Setting UNITY_LICENSE_VERSION org variable..."
            gh variable set UNITY_LICENSE_VERSION --org "${ORG}" --visibility all --body "${UNITY_VERSION}"
          else
            echo "Setting UNITY_LICENSE repo secret..."
            gh secret set UNITY_LICENSE --repo "${REPO}" < "${ULF_FILE}"
            echo "Setting UNITY_LICENSE_VERSION repo variable..."
            gh variable set UNITY_LICENSE_VERSION --repo "${REPO}" --body "${UNITY_VERSION}"
          fi

          echo "::notice::UNITY_LICENSE and UNITY_LICENSE_VERSION set for Unity ${UNITY_VERSION}"

      - name: Report result
        if: always()
        env:
          ULF_FOUND: ${{ steps.find-ulf.outputs.ulf-found }}
        run: |
          if [ "${ULF_FOUND}" = "true" ]; then
            {
              echo "## License Generated Successfully"
              echo "Unity \`${{ inputs.unity-version }}\` license generated."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## License Generation Failed"
              echo "game-ci/unity-activate could not generate a .ulf file."
              echo "Check Unity credentials (UNITY_EMAIL, UNITY_PASSWORD)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
