name: Unity Test

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          Runner label(s) for the Unity job, comma-separated. Empty (default)
          uses the repository's runner policy when one exists, otherwise
          `ubuntu-latest` as before. A value here wins over the policy.
        type: string
        required: false
        default: ''
      project-path:
        description: Path to the Unity project root relative to the consumer repo root
        type: string
        required: false
        default: '.'
      unity-version:
        description: Unity editor version
        type: string
        required: true
      target-platform:
        description: Target platform (used for image resolution and cache key)
        type: string
        required: false
        default: Linux64
      test-level:
        description: Tests to run (editmode, playmode, full)
        type: string
        required: false
        default: editmode
      cache-mode:
        description: Library cache strategy (off, safe, aggressive)
        type: string
        required: false
        default: safe
      image-registry:
        description: Docker image registry
        type: string
        required: false
        default: ghcr.io
      image-namespace:
        description: Image repository namespace override (e.g. myorg/unity-images)
        type: string
        required: false
        default: ''
      image-name:
        description: Image name override (e.g. unity-editor)
        type: string
        required: false
        default: ''
      image-digest:
        description: Pinned image digest for the test container
        type: string
        required: false
        default: ''
      workflow-repository:
        description: >
          Repository that owns this workflow (owner/repo). Must be the
          owner/repo of the unity-build-workflows toolkit. REQUIRED — the
          reusable workflow cannot auto-detect its own source repo cross-repo.
        type: string
        required: false
        default: ''
      workflow-ref:
        description: >
          Git ref or SHA of the workflow repository to checkout as the toolkit.
          Required. Must match the @<ref> used in the caller's `uses:` reference.
        type: string
        required: false
        default: ''
      integration-mode:
        description: >
          How the toolkit is supplied: 'remote' (default) checks out from
          workflow-repository@workflow-ref; 'submodule' symlinks from the
          consumer repo's checked-out submodule at toolkit-path.
        type: string
        required: false
        default: remote
      toolkit-path:
        description: >
          Relative path within the consumer repo where the toolkit submodule
          lives (submodule mode only). Must not start with '/' or contain '..'.
          Ignored in remote mode.
        type: string
        required: false
        default: tools/unity-build-workflows

    secrets:
      RUNNER_STATUS_TOKEN:
        description: >-
          Optional read-only token for runner availability (repository
          Administration: read, or organization Self-hosted runners: read).
          See docs/MULTI_RUNNER_SCHEDULING.md.
        required: false
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false

    outputs:
      tests-passed:
        description: Whether all tests passed
        value: ${{ jobs.test.outputs.tests-passed }}
      test-report-artifact:
        description: Name of the uploaded test report artifact
        value: ${{ jobs.test.outputs.test-report-artifact }}

jobs:
  # ── Runner selection (ADR 004 stage 2c) ──────────────────────────────────
  # Chooses the runner the Unity job below runs on, before that job exists:
  # runs-on cannot be decided from inside the job it schedules.
  #
  # This job runs on GitHub-hosted ubuntu-latest, and ONLY when a runner policy
  # is opted in through a repository/organization variable (RUNNER_POLICY or
  # RUNNER_POLICY_FILE) and no explicit runner label was passed. Otherwise it is
  # skipped and the Unity job below uses the explicit label, else
  # `ubuntu-latest` -- exactly the routing this workflow had before runner
  # scheduling, with no extra GitHub-hosted job. When it runs,
  # runner_scheduler.py looks for an eligible, available self-hosted runner on
  # the standalone-docker lane; if it cannot, it fails here with a report instead of
  # leaving the Unity job queued. See docs/MULTI_RUNNER_SCHEDULING.md.
  resolve-runner:
    name: Select runner
    if: ${{ (vars.RUNNER_POLICY != '' || vars.RUNNER_POLICY_FILE != '') && inputs.runner-label == '' }}
    runs-on: ubuntu-latest
    outputs:
      runs-on:         ${{ steps.select.outputs.runs-on }}
      selected-target: ${{ steps.select.outputs.selected-target }}
    steps:
      - name: Checkout runner policy
        uses: actions/checkout@v4
        with:
          path: project
          lfs: false
          persist-credentials: ${{ inputs.integration-mode == 'submodule' }}
          # The policy file only -- and in submodule mode the toolkit's gitlink,
          # so the scheduler can be checked out when a policy applies.
          sparse-checkout: |
            ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
            ${{ inputs.integration-mode == 'submodule' && inputs.toolkit-path || vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
          sparse-checkout-cone-mode: false

      - name: Decide whether a runner policy applies
        id: need
        shell: bash
        env:
          RUNNER_POLICY:      ${{ vars.RUNNER_POLICY || '' }}
          RUNNER_POLICY_FILE: ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
          EXPLICIT_LABEL:     ${{ inputs.runner-label }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${EXPLICIT_LABEL}" ]] \
             && { [[ -n "${RUNNER_POLICY}" ]] || [[ -f "project/${RUNNER_POLICY_FILE}" ]]; }; then
            echo "scheduler=true" >> "$GITHUB_OUTPUT"
          else
            echo "scheduler=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout toolkit (remote mode)
        if: steps.need.outputs.scheduler == 'true' && inputs.integration-mode != 'submodule'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.workflow-repository }}
          ref:        ${{ inputs.workflow-ref }}
          path:       .ci/unity-build-workflows
          sparse-checkout: scripts/common
          persist-credentials: false

      - name: Select runner
        id: select
        shell: bash
        env:
          SCHEDULER:              ${{ steps.need.outputs.scheduler }}
          INTEGRATION_MODE:       ${{ inputs.integration-mode }}
          TOOLKIT_PATH_INPUT:     ${{ inputs.toolkit-path }}
          RS_JOBS:                UnityTests
          RS_LANE:                standalone-docker
          RS_LEGACY_BUILD_ENGINE: docker
          RS_LEGACY_ACTIVATION:   auto
          RS_FALLBACK_LABELS:     ubuntu-latest
          RS_EXPLICIT_LABELS:     ${{ inputs.runner-label }}
          RS_UNITY_VERSION:       ${{ inputs.unity-version }}
          RUNNER_POLICY:          ${{ vars.RUNNER_POLICY || '' }}
          RUNNER_POLICY_FILE:     ${{ vars.RUNNER_POLICY_FILE || '.github/unity-runner-policy.json' }}
          # Read-only runner-status token; sent only as an Authorization header.
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ "${SCHEDULER}" != "true" ]]; then
            # No policy applies: the caller's explicit label, else the label this
            # workflow has always used. Nothing to schedule, nothing to fetch.
            if [[ -n "${RS_EXPLICIT_LABELS}" ]]; then
              labels="${RS_EXPLICIT_LABELS}"; why="explicit runner label input"
            else
              labels="${RS_FALLBACK_LABELS}"; why="no runner policy applies"
            fi
            labels="${labels//[\[\]\"]/}"
            json="["; sep=""
            for label in ${labels//,/ }; do json+="${sep}\"${label}\""; sep=","; done
            json+="]"
            echo "Runner selection: runs-on=${json} (${why})"
            echo "runs-on=${json}" >> "$GITHUB_OUTPUT"
            echo "selected-target=${labels}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${INTEGRATION_MODE:-remote}" == "submodule" ]]; then
            TP="${TOOLKIT_PATH_INPUT:-tools/unity-build-workflows}"
            if [[ "$TP" == /* ]] || [[ "$TP" == *..* ]]; then
              echo "::error::toolkit-path must be a relative path with no '..' components. Got: '$TP'"
              exit 1
            fi
            git -C project submodule update --init --depth 1 -- "${TP}"
            TOOLKIT="$(pwd)/project/${TP}"
          else
            TOOLKIT="$(pwd)/.ci/unity-build-workflows"
          fi
          if [[ ! -f "${TOOLKIT}/scripts/common/runner_scheduler.py" ]]; then
            echo "::error title=Runner scheduler missing::A runner policy applies, but the toolkit at '${TOOLKIT}' has no scripts/common/runner_scheduler.py. Check workflow-repository/workflow-ref (remote mode) or toolkit-path (submodule mode), or pass the runner label explicitly."
            exit 1
          fi
          # The policy file is resolved from the consumer checkout's root.
          cd project
          python3 "${TOOLKIT}/scripts/common/runner_scheduler.py"

  test:
    name: Run Tests (${{ inputs.test-level }})
    needs: [resolve-runner]
    # Skipped resolver (no policy opted in, or an explicit label) is the
    # normal case, not a failure.
    if: ${{ !cancelled() && (needs.resolve-runner.result == 'success' || needs.resolve-runner.result == 'skipped') }}
    runs-on: ${{ needs.resolve-runner.result == 'success' && fromJSON(needs.resolve-runner.outputs.runs-on) || inputs.runner-label || 'ubuntu-latest' }}
    outputs:
      tests-passed: ${{ steps.check-results.outputs.tests-passed }}
      test-report-artifact: ${{ steps.set-artifact-name.outputs.artifact-name }}

    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true

      # ── 1. Consumer repo checkout ─────────────────────────────────────────────
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          path: project
          lfs: true

      # ── 2. Toolkit setup ─────────────────────────────────────────────────────
      - name: Setup toolkit
        id: toolkit
        shell: bash
        env:
          INTEGRATION_MODE: ${{ inputs.integration-mode }}
          TOOLKIT_PATH_INPUT: ${{ inputs.toolkit-path }}
          WORKFLOW_REPO: ${{ inputs.workflow-repository }}
          WORKFLOW_REF: ${{ inputs.workflow-ref }}
        run: |
          MODE="${INTEGRATION_MODE:-remote}"

          if [ "$MODE" = "submodule" ]; then
            TP="${TOOLKIT_PATH_INPUT:-tools/unity-build-workflows}"
            # Reject path traversal and absolute paths
            if [[ "$TP" == /* ]] || [[ "$TP" == *..* ]]; then
              echo "::error::toolkit-path must be a relative path with no '..' components. Got: '$TP'"
              exit 1
            fi
            SUBMODULE_SRC="project/${TP}"
            if [ ! -d "$SUBMODULE_SRC" ]; then
              echo "::error::toolkit-path submodule not found at '${SUBMODULE_SRC}'."
              echo "::error::Ensure '${TP}' is initialized: git submodule update --init '${TP}'"
              exit 1
            fi
            mkdir -p .ci
            ln -sf "$(realpath "${SUBMODULE_SRC}")" .ci/unity-build-workflows
            echo "[toolkit] Linked submodule: ${SUBMODULE_SRC} → .ci/unity-build-workflows"
            SHA=$(git -C "${SUBMODULE_SRC}" rev-parse HEAD 2>/dev/null || echo "unknown")
            echo "[toolkit] Submodule commit: ${SHA}"
          else
            # remote mode — require explicit repo + ref
            if [ -z "$WORKFLOW_REPO" ]; then
              echo "::error::workflow-repository input is required (integration-mode: remote)."
              echo "::error::Add to your caller workflow's 'with:' block:"
              echo "::error::  workflow-repository: <OWNER>/unity-build-workflows"
              exit 1
            fi
            if [ -z "$WORKFLOW_REF" ]; then
              echo "::error::workflow-ref input is required (integration-mode: remote)."
              echo "::error::Add to your caller workflow's 'with:' block:"
              echo "::error::  workflow-ref: <REF>"
              exit 1
            fi
            echo "repo=${WORKFLOW_REPO}" >> "$GITHUB_OUTPUT"
            echo "ref=${WORKFLOW_REF}"   >> "$GITHUB_OUTPUT"
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "TOOLKIT_PATH=.ci/unity-build-workflows" >> "$GITHUB_ENV"

      - name: Checkout toolkit (remote mode)
        if: steps.toolkit.outputs.mode == 'remote'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.toolkit.outputs.repo }}
          ref: ${{ steps.toolkit.outputs.ref }}
          path: .ci/unity-build-workflows
          persist-credentials: false

      - name: Report toolkit version
        shell: bash
        run: |
          git -C .ci/unity-build-workflows log -1 --format="Toolkit: %H (%s)" 2>/dev/null \
            || echo "Toolkit version: unknown" 

      # ── 3. Compute effective project path ─────────────────────────────────────
      - name: Compute effective project path
        id: paths
        shell: bash
        run: |
          PP="${{ inputs.project-path }}"
          if [ "$PP" = "." ] || [ -z "$PP" ]; then
            echo "project-root=project" >> "$GITHUB_OUTPUT"
          else
            echo "project-root=project/${PP}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Docker cache
        uses: ./.ci/unity-build-workflows/.github/actions/restore-docker-cache
        with:
          project-path: ${{ steps.paths.outputs.project-root }}
          unity-version: ${{ inputs.unity-version }}
          target-platform: ${{ inputs.target-platform }}
          cache-mode: ${{ inputs.cache-mode }}

      - name: Resolve Unity image
        id: resolve-image
        uses: ./.ci/unity-build-workflows/.github/actions/resolve-unity-image
        with:
          unity-version: ${{ inputs.unity-version }}
          target-platform: ${{ inputs.target-platform }}
          image-registry: ${{ inputs.image-registry }}
          image-namespace: ${{ inputs.image-namespace }}
          image-name: ${{ inputs.image-name }}
          image-variant: linux
          image-digest: ${{ inputs.image-digest }}

      - name: Activate Unity license on host
        uses: ./.ci/unity-build-workflows/.github/actions/activate-unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unity-version: ${{ inputs.unity-version }}

      - name: Run EditMode tests
        id: test-editmode
        if: inputs.test-level == 'editmode' || inputs.test-level == 'full'
        uses: ./.ci/unity-build-workflows/.github/actions/run-unity-container
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          project-path: ${{ steps.paths.outputs.project-root }}
          unity-version: ${{ inputs.unity-version }}
          target-platform: ${{ inputs.target-platform }}
          image-reference: ${{ steps.resolve-image.outputs.image-reference }}
          image-digest: ${{ steps.resolve-image.outputs.image-digest }}
          command: test-editmode
          cache-mode: ${{ inputs.cache-mode }}
          output-path: TestResults/editmode

      - name: Run PlayMode tests
        id: test-playmode
        if: inputs.test-level == 'playmode' || inputs.test-level == 'full'
        uses: ./.ci/unity-build-workflows/.github/actions/run-unity-container
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          project-path: ${{ steps.paths.outputs.project-root }}
          unity-version: ${{ inputs.unity-version }}
          target-platform: ${{ inputs.target-platform }}
          image-reference: ${{ steps.resolve-image.outputs.image-reference }}
          image-digest: ${{ steps.resolve-image.outputs.image-digest }}
          command: test-playmode
          cache-mode: ${{ inputs.cache-mode }}
          output-path: TestResults/playmode

      - name: Check test results
        id: check-results
        if: always()
        shell: bash
        env:
          EDITMODE_EXIT: ${{ steps.test-editmode.outputs.exit-code || '0' }}
          PLAYMODE_EXIT: ${{ steps.test-playmode.outputs.exit-code || '0' }}
          TEST_LEVEL: ${{ inputs.test-level }}
        run: |
          PASSED="true"
          FAILURES=0

          # Parse XML result files if present
          for xml_file in TestResults/**/*.xml TestResults/*.xml; do
            [ -f "$xml_file" ] || continue
            FILE_FAILS=$(python3 - "$xml_file" << 'PYEOF'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
              print(int(root.get('failures', 0)) + int(root.get('errors', 0)))
          except Exception:
              print(0)
          PYEOF
            )
            FAILURES=$((FAILURES + FILE_FAILS))
          done

          # Also fail if container itself exited non-zero
          [ "$EDITMODE_EXIT" != "0" ] && [ "$EDITMODE_EXIT" != "" ] && FAILURES=$((FAILURES + 1))
          [ "$PLAYMODE_EXIT"  != "0" ] && [ "$PLAYMODE_EXIT"  != "" ] && FAILURES=$((FAILURES + 1))

          [ "$FAILURES" -gt 0 ] && PASSED="false"

          echo "tests-passed=${PASSED}" >> "$GITHUB_OUTPUT"
          echo "Test failures: ${FAILURES} | Passed: ${PASSED}"

      - name: Set artifact name
        id: set-artifact-name
        shell: bash
        run: |
          echo "artifact-name=test-results-${{ inputs.test-level }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Collect EditMode output
        if: always() && (inputs.test-level == 'editmode' || inputs.test-level == 'full')
        uses: ./.ci/unity-build-workflows/.github/actions/collect-container-output
        with:
          target-platform: ${{ inputs.target-platform }}
          command: test-editmode
          container-exit-code: ${{ steps.test-editmode.outputs.exit-code || '0' }}
          log-path: ${{ steps.test-editmode.outputs.log-path }}
          report-path: ${{ steps.test-editmode.outputs.report-path }}

      - name: Collect PlayMode output
        if: always() && (inputs.test-level == 'playmode' || inputs.test-level == 'full')
        uses: ./.ci/unity-build-workflows/.github/actions/collect-container-output
        with:
          target-platform: ${{ inputs.target-platform }}
          command: test-playmode
          container-exit-code: ${{ steps.test-playmode.outputs.exit-code || '0' }}
          log-path: ${{ steps.test-playmode.outputs.log-path }}
          report-path: ${{ steps.test-playmode.outputs.report-path }}

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact-name }}
          path: TestResults/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish Test Report
        if: always()
        continue-on-error: true  # reporter may lack checks:write — never fail the job
        uses: dorny/test-reporter@v1
        with:
          name: Unity Tests (${{ inputs.test-level }})
          path: TestResults/**/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Fail if tests failed
        if: steps.check-results.outputs.tests-passed == 'false'
        shell: bash
        run: |
          echo "::error::One or more Unity tests failed. See test report artifact for details."
          exit 1
