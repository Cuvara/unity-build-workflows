name: iOS App Store Submit for Review
description: >
  Submits a processed TestFlight build for App Store review via Fastlane deliver.
  Optionally enables phased release. Uses App Store Connect API key authentication.

inputs:
  bundle-id:
    description: iOS bundle identifier (e.g., com.studio.game)
    required: true
  version-string:
    description: App Store version string (e.g., 1.2.3)
    required: true
  build-number:
    description: Build number to submit
    required: true
  phased-release:
    description: Enable 7-day phased release
    required: false
    default: 'false'
  asc-key-id:
    description: App Store Connect API key ID
    required: true
  asc-issuer-id:
    description: App Store Connect API issuer ID
    required: true
  asc-private-key:
    description: App Store Connect API private key (.p8 content)
    required: true
  toolkit-path:
    description: Path to the toolkit checkout (contains Gemfile + fastlane/)
    required: false
    default: '.toolkit'

outputs:
  submission-status:
    description: Submission result (success/failed)
    value: ${{ steps.submit.outputs.submission-status }}

runs:
  using: composite
  steps:
    - name: Setup Fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ${{ inputs.toolkit-path }}

    - name: Submit for review
      id: submit
      shell: bash
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ inputs.asc-key-id }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.asc-issuer-id }}
        APP_STORE_CONNECT_PRIVATE_KEY: ${{ inputs.asc-private-key }}
      run: |
        cd "${{ inputs.toolkit-path }}"
        bundle exec fastlane ios submit_for_review \
          bundle_id:"${{ inputs.bundle-id }}" \
          version_string:"${{ inputs.version-string }}" \
          build_number:"${{ inputs.build-number }}" \
          phased_release:${{ inputs.phased-release }}
        echo "submission-status=success" >> "${GITHUB_OUTPUT}"
