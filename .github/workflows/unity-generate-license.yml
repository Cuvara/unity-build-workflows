name: Generate Unity License

# Generate a Docker-compatible .ulf license file by running Unity activation
# directly inside the unityci/editor Docker image.
#
# game-ci/unity-activate@v2 hardcodes dockerRepoVersion=1, but Unity 6 images
# only exist at version 3+. This workflow bypasses the action and drives Docker
# directly so the correct image tag is always used.
#
# When APP_ID + APP_PRIVATE_KEY secrets are present, the .ulf is automatically
# set as UNITY_LICENSE org/repo secret via GitHub App bot.
#
# Prerequisites:
#   - UNITY_EMAIL and UNITY_PASSWORD secrets must be set
#   - (Optional) APP_ID and APP_PRIVATE_KEY secrets for auto-set

on:
  workflow_call:
    inputs:
      unity-version:
        description: Unity editor version
        type: string
        required: true
      secret-scope:
        description: "Where to set the secret: 'org' or 'repo'"
        type: string
        required: false
        default: org
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

  workflow_dispatch:
    inputs:
      unity-version:
        description: Unity editor version
        required: true
        default: '6000.0.26f1'
      secret-scope:
        description: "Where to set the secret: 'org' or 'repo'"
        required: false
        default: org
        type: choice
        options: [org, repo]

jobs:
  generate:
    name: Generate Docker License
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "After:"; df -h / | tail -1

      - name: Generate .alf and exchange for .ulf
        id: activate
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_VERSION: ${{ inputs.unity-version }}
        run: |
          set -euo pipefail

          # Resolve the latest available Docker image tag for this Unity version.
          IMAGE_BASE="unityci/editor"
          IMAGE=""
          for REPO_VER in 3 1; do
            CANDIDATE="${IMAGE_BASE}:ubuntu-${UNITY_VERSION}-linux-il2cpp-${REPO_VER}"
            echo "Trying image: ${CANDIDATE}"
            if docker pull "${CANDIDATE}" 2>/dev/null; then
              IMAGE="${CANDIDATE}"
              break
            fi
          done

          if [ -z "${IMAGE}" ]; then
            echo "::error::No unityci/editor image found for Unity ${UNITY_VERSION}"
            exit 1
          fi

          mkdir -p license-output

          # Step 1: Generate manual activation file (.alf) inside Docker
          echo "--- Step 1: Generating .alf ---"
          docker run --rm \
            -v "$(pwd)/license-output:/output" \
            "${IMAGE}" \
            bash -c '
              unity-editor -batchmode -nographics -quit \
                -createManualActivationFile \
                -logFile /dev/stdout 2>&1 || true
              ALF=$(find / -maxdepth 5 -name "*.alf" 2>/dev/null | head -1)
              if [ -n "$ALF" ]; then
                cp "$ALF" /output/Unity.alf
                echo "ALF found: $ALF"
              else
                echo "ERROR: No .alf generated"
                exit 1
              fi
            '

          if [ ! -f "license-output/Unity.alf" ]; then
            echo "::error::.alf file was not generated"
            exit 1
          fi
          echo "ALF file size: $(wc -c < license-output/Unity.alf) bytes"

          # Step 2: Exchange .alf for .ulf via Unity's license API
          echo "--- Step 2: Exchanging .alf for .ulf via Unity license API ---"
          ALF_CONTENT=$(cat license-output/Unity.alf)

          # Unity's manual activation endpoint
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/xml" \
            -d "${ALF_CONTENT}" \
            "https://license.unity3d.com/update/manual" 2>&1) || true

          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          echo "License API HTTP status: ${HTTP_CODE}"

          if echo "${BODY}" | grep -q "<?xml"; then
            echo "${BODY}" > license-output/Unity_lic.ulf
            echo "ULF received from Unity API"
          else
            echo "::warning::Automatic .ulf exchange failed (HTTP ${HTTP_CODE}). Uploading .alf as artifact for manual activation."
            echo "Manual steps:"
            echo "  1. Download the 'unity-docker-license' artifact"
            echo "  2. Go to https://license.unity3d.com/manual"
            echo "  3. Upload Unity.alf → download the .ulf"
            echo "  4. Run: gh secret set UNITY_LICENSE --org Cuvara < Unity_lic.ulf"
            # Don't fail — we still upload the .alf as artifact
          fi

      - name: Verify .ulf was generated
        id: find-ulf
        run: |
          if [ -f "license-output/Unity_lic.ulf" ]; then
            echo "ulf-found=true" >> "$GITHUB_OUTPUT"
            echo "License file size: $(wc -c < license-output/Unity_lic.ulf) bytes"
          else
            echo "ulf-found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No .ulf file generated — check artifacts for .alf file and complete manual activation"
          fi

      - name: Upload license artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-docker-license
          path: license-output/
          retention-days: 1
          if-no-files-found: warn

      - name: Auto-set UNITY_LICENSE secret via bot
        if: steps.find-ulf.outputs.ulf-found == 'true'
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          UNITY_VERSION: ${{ inputs.unity-version }}
          SECRET_SCOPE: ${{ inputs.secret-scope }}
        run: |
          set -euo pipefail

          ULF_FILE="license-output/Unity_lic.ulf"

          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "::warning::APP_ID or APP_PRIVATE_KEY not set — cannot auto-set secret."
            echo "Manual step required:"
            echo "  gh secret set UNITY_LICENSE < ${ULF_FILE}"
            exit 0
          fi

          # Generate GitHub App installation token
          BOT_TOKEN=$(node -e "
          const crypto = require('crypto');
          const https = require('https');

          const APP_ID = process.env.APP_ID;
          const PEM = process.env.APP_PRIVATE_KEY;
          const ORG = process.env.GITHUB_REPOSITORY.split('/')[0];

          const now = Math.floor(Date.now() / 1000);
          const header = Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT'})).toString('base64url');
          const payload = Buffer.from(JSON.stringify({iat: now-60, exp: now+600, iss: APP_ID})).toString('base64url');
          const signature = crypto.sign('SHA256', Buffer.from(header+'.'+payload), PEM).toString('base64url');
          const jwt = header+'.'+payload+'.'+signature;

          function api(path, token, method, body) {
            return new Promise((resolve, reject) => {
              const opts = {
                hostname: 'api.github.com', path, method: method||'GET',
                headers: {
                  'Authorization': 'Bearer '+token,
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'cuvara-bot',
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              };
              const req = https.request(opts, res => {
                let d=''; res.on('data', c => d+=c);
                res.on('end', () => resolve({status: res.statusCode, data: JSON.parse(d||'{}')}));
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          (async () => {
            const instRes = await api('/app/installations', jwt);
            const inst = instRes.data.find(i => i.account.login === ORG);
            if (!inst) { console.error('App not installed on '+ORG); process.exit(1); }
            const tokenRes = await api('/app/installations/'+inst.id+'/access_tokens', jwt, 'POST', {});
            if (tokenRes.status !== 201) { console.error('Token error:', JSON.stringify(tokenRes.data)); process.exit(1); }
            console.log(tokenRes.data.token);
          })();
          ")

          if [ -z "${BOT_TOKEN}" ]; then
            echo "::error::Failed to generate bot token"
            exit 1
          fi

          export GH_TOKEN="${BOT_TOKEN}"
          REPO="${GITHUB_REPOSITORY}"
          ORG=$(echo "${REPO}" | cut -d/ -f1)

          if [ "${SECRET_SCOPE}" = "org" ]; then
            echo "Setting UNITY_LICENSE org secret for ${ORG}..."
            gh secret set UNITY_LICENSE --org "${ORG}" --visibility all < "${ULF_FILE}"
            echo "Setting UNITY_LICENSE_VERSION org variable..."
            gh variable set UNITY_LICENSE_VERSION --org "${ORG}" --visibility all --body "${UNITY_VERSION}"
          else
            echo "Setting UNITY_LICENSE repo secret..."
            gh secret set UNITY_LICENSE --repo "${REPO}" < "${ULF_FILE}"
            echo "Setting UNITY_LICENSE_VERSION repo variable..."
            gh variable set UNITY_LICENSE_VERSION --repo "${REPO}" --body "${UNITY_VERSION}"
          fi

          echo "::notice::UNITY_LICENSE and UNITY_LICENSE_VERSION set for Unity ${UNITY_VERSION}"

      - name: Report result
        if: always()
        env:
          ULF_FOUND: ${{ steps.find-ulf.outputs.ulf-found }}
        run: |
          if [ "${ULF_FOUND}" = "true" ]; then
            {
              echo "## License Generated Successfully"
              echo "Unity \`${{ inputs.unity-version }}\` license generated and set as secret."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Manual Activation Required"
              echo "The .alf file has been uploaded as an artifact."
              echo ""
              echo "### Steps to complete:"
              echo "1. Download the \`unity-docker-license\` artifact from this run"
              echo "2. Go to https://license.unity3d.com/manual"
              echo "3. Upload \`Unity.alf\` and download the resulting \`.ulf\` file"
              echo "4. Set it as a secret:"
              echo "\`\`\`bash"
              echo "gh secret set UNITY_LICENSE --org \$(echo \$GITHUB_REPOSITORY | cut -d/ -f1) < Unity_lic.ulf"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            # Don't exit 1 — the .alf artifact is still useful
          fi
